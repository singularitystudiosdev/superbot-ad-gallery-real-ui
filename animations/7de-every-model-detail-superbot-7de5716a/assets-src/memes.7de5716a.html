<!doctype html>
<!-- Source of every meme image in this spot. ?m=<name> renders one 1024x1024 meme;
     shoot-memes.7de5716a.mjs screenshots each into ../img/. The Muse character is SVG,
     redrawn after the user-supplied Muse mascot (white plush hood, cream face window). -->
<html><head><meta charset="utf-8"><title>Muse memes</title>
<style>
  html,body{margin:0;background:#111}
  #m{width:1024px;height:1024px;position:relative;overflow:hidden;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif}
  .impact{font-family:Impact,"Anton","Haettenschweiler",sans-serif;color:#fff;text-transform:uppercase;text-align:center;
    letter-spacing:.5px;line-height:1.02;-webkit-text-stroke:7px #000;paint-order:stroke fill}
  .abs{position:absolute}
  svg.muse{position:absolute;overflow:visible}
</style></head>
<body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <radialGradient id="fur-g" cx="38%" cy="28%" r="78%">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".45" stop-color="#f8f5f1"/>
      <stop offset=".8" stop-color="#e7e0d8"/><stop offset="1" stop-color="#cdc3b8"/>
    </radialGradient>
    <radialGradient id="face-g" cx="45%" cy="38%" r="70%">
      <stop offset="0" stop-color="#fff4ea"/><stop offset=".7" stop-color="#f6e3d2"/><stop offset="1" stop-color="#e9cdb7"/>
    </radialGradient>
    <radialGradient id="shade-g" cx="70%" cy="85%" r="60%">
      <stop offset="0" stop-color="#9c9086" stop-opacity=".55"/><stop offset="1" stop-color="#9c9086" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-g" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#bfe3ff" stop-opacity=".95"/><stop offset="1" stop-color="#7cc1ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="fur" x="-12%" y="-12%" width="124%" height="124%">
      <feTurbulence type="fractalNoise" baseFrequency="0.62" numOctaves="2" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="11" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="1.1 0.42" numOctaves="3" seed="9"/>
      <feColorMatrix type="matrix" values="0 0 0 0 .45  0 0 0 0 .41  0 0 0 0 .37  0 0 0 -2.3 1.25"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="soft2" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.4"/></filter>
    <filter id="drop" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>
</svg>
<div id="m"></div>
<script>
let uid = 0;
const BODY = 'M200 34 C302 34 352 112 356 202 C360 282 372 352 352 394 C330 414 280 408 200 410 C120 408 70 414 48 394 C28 352 40 282 44 202 C48 112 98 34 200 34 Z';

function eyesSvg(kind, cx, cy, look) {
  const L = cx - 36, R = cx + 36, lx = look * 6;
  const dot = (x) => `<ellipse cx="${x + lx}" cy="${cy}" rx="10.5" ry="12.5" fill="#18171c"/>
    <circle cx="${x + lx - 3.5}" cy="${cy - 4.5}" r="3.8" fill="#fff"/><circle cx="${x + lx + 3.2}" cy="${cy + 4.2}" r="1.7" fill="#fff" opacity=".9"/>`;
  const wide = (x) => `<ellipse cx="${x + lx}" cy="${cy}" rx="15" ry="17" fill="#18171c"/>
    <circle cx="${x + lx - 5}" cy="${cy - 6}" r="5.6" fill="#fff"/><circle cx="${x + lx + 4.5}" cy="${cy + 5.5}" r="2.6" fill="#fff"/>
    <circle cx="${x + lx + 6}" cy="${cy - 8}" r="1.6" fill="#fff"/>`;
  const happy = (x) => `<path d="M${x - 13} ${cy + 3} Q${x} ${cy - 11} ${x + 13} ${cy + 3}" fill="none" stroke="#18171c" stroke-width="5" stroke-linecap="round"/>`;
  const shut = (x) => `<path d="M${x - 13} ${cy} Q${x} ${cy + 6} ${x + 13} ${cy}" fill="none" stroke="#18171c" stroke-width="5" stroke-linecap="round"/>`;
  const tired = (x) => `<ellipse cx="${x + lx}" cy="${cy + 2}" rx="10.5" ry="11" fill="#18171c"/><circle cx="${x + lx - 3}" cy="${cy + 4}" r="2.6" fill="#fff"/>
    <path d="M${x - 15} ${cy - 2} L${x + 15} ${cy - 2} L${x + 15} ${cy - 16} L${x - 15} ${cy - 16} Z" fill="url(#face-g)"/>
    <path d="M${x - 14} ${cy - 1.5} L${x + 14} ${cy - 1.5}" stroke="#18171c" stroke-width="4" stroke-linecap="round"/>`;
  const heart = (x) => `<path transform="translate(${x} ${cy}) scale(1.15)" d="M0 9 C-14 -1 -12 -13 -5 -13 C-1 -13 0 -9 0 -8 C0 -9 1 -13 5 -13 C12 -13 14 -1 0 9 Z" fill="#ff3d63"/>
    <circle cx="${x - 5}" cy="${cy - 7}" r="2.4" fill="#fff" opacity=".85"/>`;
  const f = { dot, wide, happy, shut, tired, heart }[kind] || dot;
  return f(L) + f(R);
}
function mouthSvg(kind, cx, cy) {
  switch (kind) {
    case 'grin': return `<path d="M${cx - 20} ${cy - 3} Q${cx} ${cy + 1} ${cx + 20} ${cy - 3} Q${cx + 17} ${cy + 22} ${cx} ${cy + 23} Q${cx - 17} ${cy + 22} ${cx - 20} ${cy - 3} Z" fill="#5b2730"/>
      <path d="M${cx - 10} ${cy + 15} Q${cx} ${cy + 7} ${cx + 10} ${cy + 15} Q${cx} ${cy + 24} ${cx - 10} ${cy + 15} Z" fill="#f07b8c"/>`;
    case 'frown': return `<path d="M${cx - 13} ${cy + 8} Q${cx} ${cy - 3} ${cx + 13} ${cy + 8}" fill="none" stroke="#3a2629" stroke-width="4.2" stroke-linecap="round"/>`;
    case 'smirk': return `<path d="M${cx - 13} ${cy + 3} Q${cx + 4} ${cy + 12} ${cx + 16} ${cy - 4}" fill="none" stroke="#3a2629" stroke-width="4.2" stroke-linecap="round"/>`;
    case 'o': return `<ellipse cx="${cx}" cy="${cy + 5}" rx="7" ry="9" fill="#5b2730"/>`;
    case 'wobble': return `<path d="M${cx - 16} ${cy + 4} q4 -6 8 0 t8 0 t8 0 t8 0" fill="none" stroke="#3a2629" stroke-width="4" stroke-linecap="round"/>`;
    default: return `<path d="M${cx - 12} ${cy} Q${cx} ${cy + 11} ${cx + 12} ${cy}" fill="none" stroke="#3a2629" stroke-width="4.2" stroke-linecap="round"/>`;
  }
}
function arm(cx, cy, rx, ry, rot) {
  return `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" transform="rotate(${rot} ${cx} ${cy})" fill="url(#fur-g)" filter="url(#fur)"/>
    <ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" transform="rotate(${rot} ${cx} ${cy})" fill="url(#shade-g)" opacity=".5"/>`;
}
const ARMS = {
  down: { back: '', front: arm(64, 322, 30, 46, 16) + arm(336, 322, 30, 46, -16) },
  block: { back: arm(336, 322, 30, 46, -16), front: arm(96, 206, 40, 60, -14) + `<ellipse cx="90" cy="160" rx="12" ry="9" fill="#e9e2da" filter="url(#fur)"/>` },
  point: { back: arm(64, 322, 30, 46, 16), front: arm(338, 232, 62, 28, -38) + arm(392, 186, 13, 22, -38) },
  up: { back: arm(64, 168, 28, 50, 32) + arm(336, 168, 28, 50, -32), front: '' },
  hold: { back: '', front: '' },
  mug: { back: arm(336, 322, 30, 46, -16), front: '' },
};
function muse(o = {}) {
  const { size = 400, x = 0, y = 0, eyes = 'dot', mouth = 'smile', arms = 'down', dx = 0, look = 0, tilt = 0,
    sweat = false, phone = false, mug = false, shadow = true, brows = '' } = o;
  const id = ++uid, fx = 200 + dx, fy = 190;
  const A = ARMS[arms] || ARMS.down;
  const browSvg = brows === 'annoyed'
    ? `<path d="M${fx - 52} ${fy - 30} L${fx - 22} ${fy - 22}" stroke="#4a3a35" stroke-width="4.5" stroke-linecap="round"/><path d="M${fx + 52} ${fy - 30} L${fx + 22} ${fy - 22}" stroke="#4a3a35" stroke-width="4.5" stroke-linecap="round"/>`
    : brows === 'worried'
    ? `<path d="M${fx - 50} ${fy - 24} L${fx - 22} ${fy - 33}" stroke="#4a3a35" stroke-width="4.5" stroke-linecap="round"/><path d="M${fx + 50} ${fy - 24} L${fx + 22} ${fy - 33}" stroke="#4a3a35" stroke-width="4.5" stroke-linecap="round"/>` : '';
  const phoneSvg = phone ? `
    <ellipse cx="${fx}" cy="${fy + 10}" rx="120" ry="100" fill="url(#glow-g)" opacity=".55"/>
    <g transform="rotate(-6 200 318)">
      <rect x="150" y="262" width="100" height="150" rx="16" fill="#15151a"/>
      <rect x="157" y="270" width="86" height="134" rx="11" fill="#9fd4ff"/>
      <rect x="165" y="284" width="70" height="18" rx="6" fill="#fff" opacity=".9"/>
      <rect x="165" y="308" width="70" height="18" rx="6" fill="#fff" opacity=".75"/>
      <rect x="165" y="332" width="70" height="18" rx="6" fill="#fff" opacity=".6"/>
    </g>${arm(150, 338, 34, 30, 10)}${arm(250, 338, 34, 30, -10)}` : '';
  const mugSvg = mug ? `
    <g><path d="M126 286 h70 v62 a22 22 0 0 1 -22 22 h-26 a22 22 0 0 1 -22 -22 Z" fill="#f3efe9" stroke="#b9a99a" stroke-width="3"/>
    <path d="M196 300 q24 0 24 20 t-24 22" fill="none" stroke="#b9a99a" stroke-width="7"/>
    <text x="161" y="336" text-anchor="middle" font-family="Helvetica Neue,Arial" font-weight="800" font-size="20" fill="#c45a2b">MUSE</text></g>
    ${arm(118, 330, 32, 28, 20)}${arm(196, 352, 30, 26, -10)}` : '';
  const sweatSvg = sweat ? `<path d="M${fx + 108} ${fy - 62} q14 22 0 30 q-14 -8 0 -30 Z" fill="#8fd0ff" stroke="#4aa3e0" stroke-width="2"/>` : '';
  return `<svg class="muse" viewBox="-20 -10 440 440" style="left:${x}px;top:${y}px;width:${size}px;height:${size}px">
    <defs><clipPath id="bc${id}"><path d="${BODY}"/></clipPath><clipPath id="fc${id}"><ellipse cx="${fx}" cy="${fy}" rx="102" ry="82"/></clipPath></defs>
    ${shadow ? `<ellipse cx="200" cy="414" rx="170" ry="20" fill="#000" opacity=".22" filter="url(#drop)"/>` : ''}
    <g transform="rotate(${tilt} 200 380)">
      ${A.back}
      <path d="${BODY}" fill="url(#fur-g)" filter="url(#fur)"/>
      <g clip-path="url(#bc${id})">
        <rect x="0" y="0" width="400" height="420" filter="url(#grain)" opacity=".28"/>
        <ellipse cx="290" cy="380" rx="200" ry="150" fill="url(#shade-g)"/>
        <ellipse cx="150" cy="70" rx="90" ry="40" fill="#fff" opacity=".55" filter="url(#soft)"/>
      </g>
      <ellipse cx="${fx}" cy="${fy}" rx="102" ry="82" fill="url(#face-g)"/>
      <g clip-path="url(#fc${id})"><ellipse cx="${fx}" cy="${fy}" rx="102" ry="82" fill="none" stroke="#bfae9f" stroke-width="16" filter="url(#soft)"/></g>
      <ellipse cx="${fx}" cy="${fy}" rx="106" ry="86" fill="none" stroke="#fbf9f6" stroke-width="15" filter="url(#fur)"/>
      <ellipse cx="${fx - 54}" cy="${fy + 24}" rx="17" ry="10" fill="#f39aa6" opacity=".6" filter="url(#soft2)"/>
      <ellipse cx="${fx + 54}" cy="${fy + 24}" rx="17" ry="10" fill="#f39aa6" opacity=".6" filter="url(#soft2)"/>
      ${browSvg}${eyesSvg(eyes, fx, fy - 2, look)}${mouthSvg(mouth, fx, fy + 30)}
      ${A.front}${phoneSvg}${mugSvg}${sweatSvg}
    </g></svg>`;
}
const museIcon = (s) => `<div style="width:${s}px;height:${s}px;border-radius:${s * .24}px;background:linear-gradient(160deg,#ffd9c2,#f6a37f);position:relative;overflow:hidden;flex:none">${muse({ size: s * 1.25, x: -s * .12, y: -s * .02, shadow: false, eyes: 'dot' })}</div>`;
const badge = (x, y, txt, s = 1) => `<div class="abs" style="left:${x}px;top:${y}px;transform:scale(${s});transform-origin:center;min-width:64px;height:64px;padding:0 14px;box-sizing:border-box;border-radius:32px;background:#ff3b30;color:#fff;font:800 34px/64px 'Helvetica Neue',Arial;text-align:center;box-shadow:0 0 0 6px rgba(255,255,255,.9),0 10px 30px rgba(255,80,40,.6)">${txt}</div>`;

const MEMES = {
  // Ideogram pick: the two-row "nah / yeah" format
  'ide-hero': () => `
    <div class="abs" style="inset:0;background:#fff"></div>
    <div class="abs" style="left:0;top:0;width:512px;height:512px;background:radial-gradient(120% 90% at 30% 20%,#ffd38a,#f29a4a 60%,#d9702e)">${muse({ size: 440, x: 44, y: 70, arms: 'block', eyes: 'shut', mouth: 'frown', dx: 22, tilt: -7, brows: 'annoyed' })}</div>
    <div class="abs" style="left:0;top:512px;width:512px;height:512px;background:radial-gradient(120% 90% at 30% 20%,#ffd38a,#f29a4a 60%,#d9702e)">${muse({ size: 470, x: 6, y: 38, arms: 'point', eyes: 'wide', mouth: 'grin', dx: 14, tilt: 5 })}</div>
    <div class="abs" style="left:512px;top:0;width:512px;height:512px;display:flex;align-items:center;padding:0 52px;box-sizing:border-box;font:700 66px/1.08 'Helvetica Neue',Arial;color:#111;letter-spacing:-1px">Letting you sleep</div>
    <div class="abs" style="left:512px;top:512px;width:512px;height:512px;display:flex;align-items:center;padding:0 52px;box-sizing:border-box;font:700 62px/1.08 'Helvetica Neue',Arial;color:#111;letter-spacing:-1px">Sending you 40 notifications at 3&nbsp;AM</div>
    <div class="abs" style="left:512px;top:0;width:2px;height:1024px;background:#e6e6e6"></div>`,
  // lock-screen POV
  'ide-alt1': () => `
    <div class="abs" style="inset:0;background:radial-gradient(70% 60% at 20% 10%,#7b5cff,transparent 70%),radial-gradient(60% 60% at 90% 80%,#ff7aa8,transparent 70%),linear-gradient(180deg,#1c1846,#0d0b22)"></div>
    <div class="abs" style="left:0;right:0;top:70px;text-align:center;color:#fff;font:600 30px 'Helvetica Neue',Arial;opacity:.85">Tuesday, October 6</div>
    <div class="abs" style="left:0;right:0;top:100px;text-align:center;color:#fff;font:200 190px/1 'Helvetica Neue',Arial;letter-spacing:-6px">3:07</div>
    ${[['psst. you up?', 'now'], ['ok one more idea', 'now'], ['last one i promise', '1m ago']].map(([t, w], i) => `
      <div class="abs" style="left:${92 + i * 10}px;right:${92 + i * 10}px;top:${336 + i * 132}px;height:116px;border-radius:30px;background:rgba(255,255,255,${.24 - i * .04});backdrop-filter:blur(8px);display:flex;align-items:center;gap:22px;padding:0 26px;box-sizing:border-box;color:#fff">
        ${museIcon(72)}<div style="flex:1;min-width:0"><div style="display:flex;justify-content:space-between;font:700 26px 'Helvetica Neue',Arial;opacity:.9"><span>Muse</span><span style="font-weight:500;opacity:.75">${w}</span></div>
        <div style="font:500 34px/1.2 'Helvetica Neue',Arial;margin-top:4px">${t}</div></div></div>`).join('')}
    <div class="abs" style="left:150px;right:150px;top:736px;height:26px;border-radius:0 0 22px 22px;background:rgba(255,255,255,.12)"></div>
    <div class="abs" style="left:0;right:0;top:776px;text-align:center;color:#fff;font:600 26px 'Helvetica Neue',Arial;opacity:.8">+37 more from Muse</div>
    <div class="abs impact" style="left:30px;right:30px;bottom:44px;font-size:82px">POV: you muted Muse<br>for 5 minutes</div>`,
  // this-is-fine
  'ide-alt2': () => `
    <div class="abs" style="inset:0;background:linear-gradient(180deg,#f6c27a 0,#f0a457 58%,#b8642f 58.2%,#9c5428 100%)"></div>
    <div class="abs" style="left:640px;top:90px;width:250px;height:190px;border:12px solid #7d4a25;background:linear-gradient(160deg,#9fd3ff,#d6ecff);box-sizing:border-box"></div>
    ${[[60, 120, '40', 1.25], [300, 60, '99+', 1.1], [520, 300, '12', .95], [820, 360, '7', .9], [80, 420, '!', .85], [900, 180, '3', .8]].map(([x, y, t, s]) => badge(x, y, t, s)).join('')}
    ${[[150, 210], [760, 520], [420, 150]].map(([x, y]) => `<div class="abs" style="left:${x}px;top:${y}px;width:120px;height:140px;border-radius:50% 50% 45% 45%;background:radial-gradient(60% 60% at 50% 70%,#fff2a8,#ff9f2e 55%,rgba(255,90,20,0) 72%);filter:blur(3px)"></div>`).join('')}
    <div class="abs" style="left:520px;top:640px;width:340px;height:30px;border-radius:8px;background:#6b3a1c"></div>
    <div class="abs" style="left:560px;top:668px;width:20px;height:150px;background:#5a3017"></div><div class="abs" style="left:800px;top:668px;width:20px;height:150px;background:#5a3017"></div>
    ${muse({ size: 470, x: 150, y: 370, arms: 'mug', mug: true, eyes: 'happy', mouth: 'smile' })}
    <div class="abs impact" style="left:30px;right:30px;bottom:40px;font-size:96px">40 unread. this is fine.</div>`,
  // classic top/bottom
  'ide-alt3': () => `
    <div class="abs" style="inset:0;background:radial-gradient(80% 70% at 50% 60%,#3a6fd8,#1a2d6b 70%,#0d1638)"></div>
    ${Array.from({ length: 14 }, (_, i) => `<div class="abs" style="left:${(i * 173) % 980}px;top:${120 + (i * 97) % 700}px;width:${22 + (i % 4) * 14}px;height:${22 + (i % 4) * 14}px;border-radius:50%;background:#cfe3ff;opacity:${.08 + (i % 3) * .06};filter:blur(2px)"></div>`).join('')}
    ${muse({ size: 760, x: 132, y: 300, arms: 'hold', phone: true, eyes: 'wide', mouth: 'smirk', look: 1, shadow: false })}
    <div class="abs impact" style="left:24px;right:24px;top:30px;font-size:112px">One more notification</div>
    <div class="abs impact" style="left:24px;right:24px;bottom:34px;font-size:120px">won't hurt</div>`,
  // Reddit finds
  'rd-1': () => `
    <div class="abs" style="inset:0 0 auto 0;height:300px;background:#fff;padding:52px 60px;box-sizing:border-box;font:500 70px/1.25 'Helvetica Neue',Arial;color:#111">Nobody:<br>Muse at 3&nbsp;AM:</div>
    <div class="abs" style="left:0;right:0;top:300px;bottom:0;background:radial-gradient(60% 60% at 50% 55%,#1f2b52,#070a16)"></div>
    ${muse({ size: 700, x: 162, y: 330, arms: 'hold', phone: true, eyes: 'wide', mouth: 'grin', shadow: false })}`,
  'rd-2': () => `
    <div class="abs" style="inset:0;background:linear-gradient(180deg,#d9dde3 0,#c9ced6 52%,#fbe3cf 52%,#f3c8a6 100%)"></div>
    <div class="abs" style="left:140px;top:70px;width:744px;height:380px;border-radius:30px;background:#5c636e;box-shadow:inset 0 -18px 0 #474d56"></div>
    ${[[220, 'SLEEP'], [560, '40 MORE IDEAS']].map(([x, t]) => `
      <div class="abs" style="left:${x}px;top:150px;width:250px;height:150px;border-radius:50%;background:radial-gradient(60% 50% at 45% 35%,#ff8a7d,#e2251b 70%);box-shadow:0 22px 0 #8f150e"></div>
      <div class="abs" style="left:${x - 30}px;top:340px;width:310px;padding:12px 0;border-radius:12px;background:#fff;text-align:center;font:800 33px 'Helvetica Neue',Arial;color:#111">${t}</div>`).join('')}
    ${muse({ size: 560, x: 232, y: 470, eyes: 'tired', mouth: 'wobble', sweat: true, brows: 'worried', arms: 'up' })}`,
  'rd-3': () => `
    <div class="abs" style="inset:0;background:#f2f2f7"></div>
    <div class="abs impact" style="left:20px;right:20px;top:26px;font-size:84px">my weekly screen time</div>
    <div class="abs" style="left:70px;right:70px;top:150px;height:600px;border-radius:36px;background:#fff;box-shadow:0 10px 40px rgba(0,0,0,.08);padding:40px 48px;box-sizing:border-box">
      <div style="font:700 34px 'Helvetica Neue',Arial;color:#8e8e93">Daily average</div>
      <div style="font:800 96px/1.05 'Helvetica Neue',Arial;color:#111;letter-spacing:-2px">9h 41m</div>
      <div style="display:flex;align-items:flex-end;gap:26px;height:250px;margin-top:30px;border-bottom:3px solid #e5e5ea">
        ${[62, 74, 70, 88, 81, 96, 100].map((h) => `<div style="flex:1;height:${h}%;border-radius:12px 12px 0 0;background:linear-gradient(180deg,#ff9f6b,#ff6a3d)"></div>`).join('')}
      </div>
      <div style="display:flex;gap:30px;margin-top:22px;font:700 30px 'Helvetica Neue',Arial;color:#111">
        <span style="color:#ff6a3d">Muse 9h 12m</span><span style="color:#8e8e93">Everything else 29m</span></div></div>
    ${muse({ size: 300, x: 680, y: 664, eyes: 'happy', mouth: 'grin', arms: 'up' })}`,
  'rd-4': () => `
    <div class="abs" style="inset:0;background:linear-gradient(180deg,#8fb7a3,#5f8a77)"></div>
    <div class="abs" style="left:640px;top:170px;width:210px;height:210px;border-radius:50%;background:radial-gradient(circle,#fff5c4,rgba(255,240,180,0) 70%)"></div>
    <div class="abs" style="left:690px;top:215px;width:110px;height:110px;border-radius:30px;background:#ffcc00;display:grid;place-items:center;font:800 64px 'Helvetica Neue',Arial;color:#fff;box-shadow:0 12px 30px rgba(0,0,0,.25)">🔔</div>
    ${badge(780, 190, '1')}
    ${muse({ size: 600, x: 40, y: 330, arms: 'point', eyes: 'wide', mouth: 'o', look: 1, dx: 18 })}
    <div class="abs impact" style="left:200px;top:330px;font-size:66px;text-align:left">Muse</div>
    <div class="abs impact" style="left:560px;top:420px;width:420px;font-size:52px">you opening the app once</div>
