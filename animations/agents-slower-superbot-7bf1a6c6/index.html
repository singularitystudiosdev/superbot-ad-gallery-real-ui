<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>agents getting slower overtime? · superbot knows why · ad spot</title>
<link rel="icon" href="assets/mark-clean.svg" type="image/svg+xml"/>
<meta name="description" content="Two title cards and the end screen, each popping in the way the 'agents refusing?' card does: 'agents getting slower overtime?' with slower in storm blue for 1.9 seconds, then 'superbot knows why' with superbot on the storm-x wordmark gradient, then the superbot.gg end card. 6.5s looping ad spot, 1920x1080."/>
<script src="../../assets/ar.js"></script>
<link rel="stylesheet" href="../../assets/ar.css">
<!-- the end-card mascot: the real beta.superbot.gg mark (breath, glitch, ears, bob, blink, eyes) -->
<link rel="stylesheet" href="../../assets/sb-mark-live.css">
<script src="../../assets/sb-mark-live.js"></script>
<style>
/* ---------- tokens ---------- */
/* The type and colour are the house card's, not this file's invention: the same
   ladder the "agents refusing? superbot can do it!" title cards and posters use
   (SF Pro Rounded 800, -.035em, line-height 1; the pain word flat storm-1; superbot
   on storm-x), so the spot and that family read as one set. */
:root {
  --fg: #ffffff; --muted: #9a9a9a;
  --ui: "SF Pro Rounded", "SF Pro Display", -apple-system, system-ui, "Segoe UI", sans-serif;
  --storm-1: #2b6bff; --storm-2: #6a1fd8; --storm-3: #c026d3; --storm-4: #ff3d9a;
  --storm-x: linear-gradient(90deg, var(--storm-1) 0%, var(--storm-2) 45%, var(--storm-3) 75%, var(--storm-4) 100%);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
body { font-family: var(--ui); color: var(--fg); -webkit-font-smoothing: antialiased; }

/* ---------- the 1920x1080 stage, scaled to the viewport ---------- */
#stage { position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px; transform-origin: 50% 50%; background: #000; overflow: hidden; }
.scene { position: absolute; inset: 0; opacity: 0; visibility: hidden; }
.scene.on { visibility: visible; }

/* ---------- the title cards: flat type on black, no motion and no glow ---------- */
#card { display: grid; place-items: center; background: #000; }
#card .line { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%); text-align: center;
  font-size: 140px; font-weight: 800; letter-spacing: -.035em; line-height: 1; color: #fff; }
#card .line .row { display: block; }
#card .blue { color: var(--storm-1); }
#card .grad { background: var(--storm-x); -webkit-background-clip: text; background-clip: text; color: transparent; }

/* ---------- the end card (house lockup: face beside the words) ---------- */
#end { display: grid; place-items: center; background: #000; }
#end .lock { display: flex; align-items: center; gap: 44px; }
#end .face { flex: none; width: 220px; height: 220px; display: grid; place-items: center; } /* the host; sbMarkLive fills it at 220px */
#end .words { overflow: hidden; }
#end .words h1 { margin: 0; font-size: 128px; font-weight: 800; letter-spacing: -.03em; line-height: 1; color: #fff; }
#end .words p { margin: 12px 0 0 6px; font-size: 34px; color: var(--muted); font-weight: 500; }

/* reduced motion: the composed end card only, no clock */
@media (prefers-reduced-motion: reduce) {
  .scene { opacity: 0 !important; visibility: hidden !important; }
  #end { opacity: 1 !important; visibility: visible !important; }
  #end .lock > * { transform: none !important; opacity: 1 !important; }
}
</style>
</head>
<body>
<div id="stage">

  <!-- ============ the two title cards ============ -->
  <section class="scene" id="card" aria-label="agents getting slower overtime? superbot knows why">
    <div class="line" id="card-a">
      <span class="row">agents getting</span>
      <span class="row"><span class="blue">slower</span> overtime?</span>
    </div>
    <div class="line" id="card-b">
      <span class="row"><span class="grad">superbot</span></span>
      <span class="row">knows why</span>
    </div>
  </section>

  <!-- ============ the end card ============ -->
  <section class="scene" id="end" aria-label="superbot.gg">
    <div class="lock">
      <div class="face" id="end-face"></div>
      <div class="words" id="end-words"><div id="end-slide"><h1>superbot.gg</h1><p>the agent to manage your agents.</p></div></div>
    </div>
  </section>
</div>

<script>
// ---------- the clock: one render(t), a pure function of story time ----------
// Every visual is recomputed from t each frame, so seeking (`?t=4.2`) or capturing any
// frame yields the same picture. Frame-indexed at 30fps so preview and capture agree.
// The title cards use the house card entrance verbatim (gpt-refusal-superbot-824cef28
// renderCard): a 0.35s rise-and-settle, opacity with translateY 3% and scale .96 -> 1 on
// outQuint, and a 0.2s fall-out on the outgoing card. Nothing else moves.
const FPS = 30, LOOP = 6.5;
const $ = (id) => document.getElementById(id);
const clamp01 = (v) => Math.max(0, Math.min(1, v));
const seg = (t, a, b) => clamp01((t - a) / (b - a));
const outQuint = (p) => 1 - Math.pow(1 - p, 5);
const outBack = (p) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); };
const lerp = (a, b, p) => a + (b - a) * p;

// ---------- the beat sheet (story seconds) ----------
const B = {
  cardA: 0,            // "agents get slower overtime?" pops in and holds 1.9 seconds flat
  cardB: 1.9,          // it falls out and "superbot knows why" pops in
  end: 3.5, word: 3.85 // the end card, then the words slide out from behind the face
};

const stage = $('stage');
const card = $('card'), cardA = $('card-a'), cardB = $('card-b');
const end = $('end'), endFace = $('end-face'), endSlide = $('end-slide');
// the live mascot, the same 220px box the static face filled; render(t) still scales and fades the host
sbMarkLive(endFace, { size: 220 });

const op = (el, v) => { el.style.opacity = String(clamp01(v)); };
const scene = (el, on) => { el.classList.toggle('on', on); op(el, on ? 1 : 0); };

function render(t) {
  const inCard = t < B.end;
  scene(card, inCard); scene(end, !inCard);
  if (inCard) renderCard(t); else renderEnd(t);
}

// the "agents refusing?" card entrance, copied from the house spot
function renderCard(t) {
  const a = seg(t, B.cardA, B.cardA + 0.35), b = seg(t, B.cardB, B.cardB + 0.35);
  const out = seg(t, B.cardB - 0.2, B.cardB);
  op(cardA, a * (1 - out));
  cardA.style.transform = `translateY(${(-50 + (1 - outQuint(a)) * 3 - out * 3).toFixed(2)}%) scale(${lerp(0.96, 1, outQuint(a)).toFixed(3)})`;
  op(cardB, b);
  cardB.style.transform = `translateY(${(-50 + (1 - outQuint(b)) * 3).toFixed(2)}%) scale(${lerp(0.96, 1, outQuint(b)).toFixed(3)})`;
}

function renderEnd(t) {
  const f = seg(t, B.end, B.end + 0.5), w = seg(t, B.word, B.word + 0.7);
  op(endFace, f); endFace.style.transform = `scale(${lerp(0.5, 1, outBack(f)).toFixed(3)})`;
  endSlide.style.transform = `translateX(${((1 - outQuint(w)) * -110).toFixed(1)}%)`;
  op(endSlide, w);
}

// ---------- fit the stage to the viewport ----------
function fit() {
  const k = Math.min(innerWidth / AR.w, innerHeight / AR.h);
  stage.style.transform = `translate(-50%, -50%) scale(${k})`;
  stage.style.left = '50%'; stage.style.top = '50%';
}
addEventListener('resize', fit); fit();
addEventListener('archange', fit);

// ---------- the clock ----------
// `?t=<s>` seeks and holds (frame capture); `?t=<s>&play=1` seeks and runs on;
// otherwise it plays and loops.
const q = new URLSearchParams(location.search);
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const seekTo = q.has('t') ? parseFloat(q.get('t')) : null;
let t0 = performance.now() - (seekTo || 0) * 1000, last = -1;
function frame(now) {
  const t = ((now - t0) / 1000) % LOOP;
  const f = Math.floor(t * FPS);
  if (f !== last) { last = f; render(f / FPS); }
  requestAnimationFrame(frame);
}
if (reduced) { render(B.word + 1); }
else if (seekTo !== null && !q.has('play')) { render(Math.floor(seekTo * FPS) / FPS); }
else requestAnimationFrame(frame);
</script>
</body>
</html>
