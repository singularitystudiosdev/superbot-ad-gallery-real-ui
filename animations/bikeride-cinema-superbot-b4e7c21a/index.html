<body>
<div id="stage">
  <!-- timeline.js creates one <section class="scene" id="s-<id>"> per segment (cards, scenes, end) in order -->
  <div id="dip"></div>
  <!-- the film grade: vignette + grain over every scene (below #dip, above the scenes) -->
  <div id="cine" aria-hidden="true"><i class="cine-vig"></i><i class="cine-grain"></i></div>
</div>

<div class="hint" id="hint">space pause · ←/→ step · R restart</div>
<button class="rec-btn" id="recordBtn" type="button"><i class="rec-dot"></i><span id="recordLabel">Record</span></button>
<div class="rec-hud" id="recHud"><i class="rec-dot"></i><span id="recTime">0.0s</span></div>

<script src="../../assets/sb-mark-live.js"></script>
<script src="recorder.js"></script>
