<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your life, one command center: chaos to order</title>
<style>
/* Plays the rendered film (24 s, 1920x1080, 60 fps, with sound) on its own near-black canvas. */
:root { --canvas: #060607; }
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--canvas); }
body { display: grid; place-items: center; }
.frame { position: relative; width: min(100vw, calc(100vh * 16 / 9)); aspect-ratio: 16 / 9; background: var(--canvas); }
video { display: block; width: 100%; height: 100%; object-fit: contain; background: var(--canvas); }
</style>
</head>
<body>
<div class="frame">
  <video id="film" autoplay loop playsinline preload="auto" poster="poster.png" src="final.mp4"
    aria-label="Notifications from every part of a student's life pile up on a black stage: a Canvas midterm, a problem set due tonight, a LinkedIn coffee follow-up, 1,284 unread in Gmail, GitHub commits with no next step, a Handshake application opening friday and a 6:00 calendar collision. They all fly into the superbot phone, which opens one today overview with seven sections: school, networking, projects, applications, daily, email and calendar. Each row lights up in turn as the captions name it: nudges before exams, next steps synced, unfinished rolls over, work blocks from your tasks. Ends on superbot.gg, your life, one command center. 24 s, 1920x1080, 60 fps, with sound."></video>
</div>
<script>
  const video = document.getElementById("film");
  // Sound is always on: try unmuted autoplay, and if the browser refuses it, play muted and unmute on the
  // viewer's first click, key or touch.
  const unmute = () => {
    video.muted = false;
    video.play().catch(() => {});
  };
  const start = () => {
    video.muted = false;
    video.play().catch(() => {
      video.muted = true;
      video.play().catch(() => {});
    });
  };
  for (const type of ["pointerdown", "keydown", "touchstart"]) addEventListener(type, unmute, { once: true, capture: true });
  // the gallery lightbox posts { type: "unmute" } on the viewer's first click or key
  addEventListener("message", (e) => {
    if (e.data && e.data.type === "unmute") unmute();
  });
  if (video.readyState >= 2) start();
  else video.addEventListener("canplay", start, { once: true });
</script>
</body>
</html>
