<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your life, one command center: a day in the life</title>
<style>
/* Plays the rendered film (21.6 s, 1920x1080, 60 fps, with sound) on its own near-black canvas. */
:root { --canvas: #060607; }
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--canvas); }
body { display: grid; place-items: center; }
.frame { position: relative; width: min(100vw, calc(100vh * 16 / 9)); aspect-ratio: 16 / 9; background: var(--canvas); }
video { display: block; width: 100%; height: 100%; object-fit: contain; background: var(--canvas); }
</style>
</head>
<body>
<div class="frame">
  <video id="film" autoplay loop playsinline preload="auto" poster="poster.png" src="final.mp4"
    aria-label="A large time stamp walks one day in the superbot app. At 7:30 am the user asks what's on today and gets a brief across seven areas. At 9:00 the Gmail inbox is sorted, 1,284 messages with 3 that need you. At 1:00 pm yesterday's GitHub commits become the next step and a LinkedIn follow-up surfaces. At 4:00 a Canvas nudge blocks study time for a midterm 9 days out and a Handshake application opening friday gets a reminder. At 6:00 the calendar fills with work blocks from the task list, a call and gym. At 11:00 pm the recap reads said 4 blocks, did 3, with the unfinished reply moved to tomorrow. Ends on superbot.gg, your life, one command center. 21.6 s, 1920x1080, 60 fps, with sound."></video>
</div>
<script>
  const video = document.getElementById("film");
  // Sound is always on: try unmuted autoplay, and if the browser refuses it, play muted and unmute on the
  // viewer's first click, key or touch.
  const unmute = () => {
    video.muted = false;
    video.play().catch(() => {});
  };
  const start = () => {
    video.muted = false;
    video.play().catch(() => {
      video.muted = true;
      video.play().catch(() => {});
    });
  };
  for (const type of ["pointerdown", "keydown", "touchstart"]) addEventListener(type, unmute, { once: true, capture: true });
  // the gallery lightbox posts { type: "unmute" } on the viewer's first click or key
  addEventListener("message", (e) => {
    if (e.data && e.data.type === "unmute") unmute();
  });
  if (video.readyState >= 2) start();
  else video.addEventListener("canplay", start, { once: true });
</script>
</body>
</html>
