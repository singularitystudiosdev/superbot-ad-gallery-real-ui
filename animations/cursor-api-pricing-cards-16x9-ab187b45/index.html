<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>superbot: Cursor charges API pricing (cards, 16:9)</title>
<style>
/* Plays the rendered film (14.4 s, 60 fps, with sound) fitted whole at its native 1920x1080; any ?ar= the
   gallery passes keeps the film whole, the rest of the frame the film's own canvas colour. Seekable source:
   quick-chats/cursor-api-toggle.ab187b45/index.html?v=a (window.seek(t)). */
:root { --canvas: #000000; }
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--canvas); }
body { display: grid; place-items: center; }
.frame { position: relative; width: min(100vw, calc(100vh * 1920 / 1080)); aspect-ratio: 1920 / 1080; background: var(--canvas); }
video { display: block; width: 100%; height: 100%; object-fit: contain; background: var(--canvas); }
</style>
</head>
<body>
<div class="frame">
  <video id="film" src="final.mp4" poster="poster.png" autoplay loop playsinline preload="auto"
    aria-label="Cursor's agent chat runs and its On-Demand meter reads $4.82; Cursor charges API pricing; a Superbot toggle is switched on; Superbot makes it charge subscription; the meter strikes $4.82 and reads FREE; superbot.gg (14.4 s loop, with sound)."></video>
</div>
<script>
  const video = document.getElementById("film");
  // Sound is on: try unmuted autoplay; if the browser refuses, play muted and unmute on the first click, key or touch.
  const warn = (what) => (err) => console.warn("[film] " + what, err);
  const unmute = () => { video.muted = false; video.play().catch(warn("unmuted play refused")); };
  const start = () => {
    video.muted = false;
    video.play().catch((err) => { warn("autoplay with sound refused, playing muted")(err); video.muted = true; video.play().catch(warn("muted play refused")); });
  };
  for (const type of ["pointerdown", "keydown", "touchstart"]) addEventListener(type, unmute, { once: true, capture: true });
  // the gallery lightbox posts { type: "unmute" } on the viewer's first click or key
  addEventListener("message", (e) => { if (e.data && e.data.type === "unmute") unmute(); });
  if (video.readyState >= 2) start();
  else video.addEventListener("canplay", start, { once: true });
</script>
</body>
</html>
