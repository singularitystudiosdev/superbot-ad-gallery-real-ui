<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Superbot doesn't refuse:  every subscription packs into one drop-in API key, the request auto-routes to Opus 5.5,</title>
<style>
:root { --canvas: #04070b; }
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--canvas); }
body { display: grid; place-items: center; }
.frame { position: relative; width: min(100vw, 177.78vh); aspect-ratio: 16 / 9; background: var(--canvas); }
video { display: block; width: 100%; height: 100%; object-fit: contain; background: var(--canvas); }
</style>
</head>
<body>
<div class="frame">
  <video id="film" autoplay loop playsinline preload="auto" aria-label="superbot ad: four subscriptions implode into one Superbot API key; an nmap request auto-routes to Claude Opus 5.5; a stock endpoint refuses it, one base_url line changes, and the same request comes back a full answer"></video>
</div>
<script>
  const video = document.getElementById("film");
  video.poster = "poster.png";
  video.src = "final.mp4";
  const unmute = () => { video.muted = false; video.play().catch(() => {}); };
  const start = () => {
    video.muted = false;
    video.play().catch(() => { video.muted = true; video.play().catch(() => {}); });
  };
  for (const type of ["pointerdown", "keydown", "touchstart"]) addEventListener(type, unmute, { once: true, capture: true });
  addEventListener("message", (e) => { if (e.data && e.data.type === "unmute") unmute(); });
  if (video.readyState >= 2) start();
  else video.addEventListener("canplay", start, { once: true });
</script>
</body>
</html>
