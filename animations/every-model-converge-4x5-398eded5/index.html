<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Every model, one chat: twelve apps fuse into Superbot</title>
<style>
/* Plays the rendered film (21.6 s, 30 fps, with sound) on its own near-black canvas.
   ?ar=16x9 plays the native 1920x1080 recomposition (final-16x9.mp4); every other ?ar=
   plays the 1080x1350 film (final.mp4) fitted whole, the rest of the frame near-black. */
:root {
  --canvas: #070707;
  --surface: #ffffff;
  --ink: #14171c;
  --hairline: #d4d8de;
}

*, *::before, *::after { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  background: var(--canvas);
}

body {
  display: grid;
  place-items: center;
}

.frame {
  position: relative;
  width: min(100vw, 80vh);
  aspect-ratio: 4 / 5;
  background: var(--canvas);
}

.wide .frame {
  width: min(100vw, calc(100vh * 16 / 9));
  aspect-ratio: 16 / 9;
}

video {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
  background: var(--canvas);
}

</style>
</head>
<body>
<div class="frame">
  <video id="film" autoplay loop playsinline preload="auto"
    aria-label="Every model, one chat: twelve apps fuse into Superbot: twelve real app icons lift out of the phone, spiral and fuse into the Superbot tile, then the chat routes each ask to the right model, Gemini makes the meme, DeepSeek V4 Flash scrapes Reddit, and the DoorDash burger order lands in 24 min, with sound on (21.6s loop)."></video>
</div>
<script>
  const video = document.getElementById("film");
  const wide = new URLSearchParams(location.search).get("ar") === "16x9";
  document.documentElement.classList.toggle("wide", wide);
  video.poster = wide ? "poster-16x9.png" : "poster.png";
  video.src = wide ? "final-16x9.mp4" : "final.mp4";
  // Sound is always on: try unmuted autoplay, and if the browser refuses it, play muted and unmute on the
  // viewer's first click, key or touch.
  const unmute = () => {
    video.muted = false;
    video.play().catch(() => {});
  };
  const start = () => {
    video.muted = false;
    video.play().catch(() => {
      video.muted = true;
      video.play().catch(() => {});
    });
  };
  for (const type of ["pointerdown", "keydown", "touchstart"]) addEventListener(type, unmute, { once: true, capture: true });
  // the gallery lightbox posts { type: "unmute" } on the viewer's first click or key
  addEventListener("message", (e) => {
    if (e.data && e.data.type === "unmute") unmute();
  });
  if (video.readyState >= 2) start();
  else video.addEventListener("canplay", start, { once: true });
</script>
</body>
</html>
