<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Every model, one chat: all your apps merge into Superbot (4:5)</title>
<style>
/* Plays the rendered 1080x1350 film (final.mp4, 26 s, 30 fps, with sound) at 4:5 on
   the film's own near-black canvas. The gallery loads this page in a frame at any
   ?ar=; the 4:5 picture is fitted whole and the rest of the frame stays near-black. */
:root {
  --canvas: #070707;
  --surface: #ffffff;
  --ink: #14171c;
  --hairline: #d4d8de;
}

*, *::before, *::after { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  background: var(--canvas);
}

body {
  display: grid;
  place-items: center;
}

.frame {
  position: relative;
  width: min(100vw, 80vh);
  aspect-ratio: 4 / 5;
  background: var(--canvas);
}

video {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
  background: var(--canvas);
}

</style>
</head>
<body>
<div class="frame">
  <video id="film" src="final.mp4" poster="poster.png" autoplay loop playsinline preload="auto"
    aria-label="Every model, one chat: all your apps merge into Superbot (4:5): ChatGPT, Claude, Gemini, Grok, Copilot and Reddit land in one phone in one hand and merge into one app, then Gemini makes the meme, DeepSeek digs through Reddit and the burger is ordered on DoorDash, with sound on (26s loop)."></video>
</div>
<script>
  const video = document.getElementById("film");
  // Sound is always on: try unmuted autoplay, and if the browser refuses it, play muted and unmute on the
  // viewer's first click, key or touch.
  const unmute = () => {
    video.muted = false;
    video.play().catch(() => {});
  };
  const start = () => {
    video.muted = false;
    video.play().catch(() => {
      video.muted = true;
      video.play().catch(() => {});
    });
  };
  for (const type of ["pointerdown", "keydown", "touchstart"]) addEventListener(type, unmute, { once: true, capture: true });
  // the gallery lightbox posts { type: "unmute" } on the viewer's first click or key
  addEventListener("message", (e) => {
    if (e.data && e.data.type === "unmute") unmute();
  });
  if (video.readyState >= 2) start();
  else video.addEventListener("canplay", start, { once: true });
</script>
</body>
</html>
