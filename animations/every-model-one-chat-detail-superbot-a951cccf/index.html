<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920">
<title>Every model, one chat (detail cut) · superbot</title>
<link rel="stylesheet" href="film.css">
<style>
  html.fit, html.fit body { width: 100%; height: 100%; background: #000; }
  html.fit #stage { position: absolute; left: 50%; top: 50%; transform-origin: 0 0; }
</style>
</head>
<body>
<div id="stage"></div>
<script type="module">
import { init, seek, DUR } from './film.js'
const ready = init()
window.DUR = DUR
window.seek = async (t) => { await ready; seek(t) }
// live preview: plays on loop and scales to the window; the renderer drives seek() itself
if (!window.__RENDER__) {
  await ready
  const stage = document.getElementById('stage')
  const fit = new URLSearchParams(location.search).get('fit') !== '0'
  if (fit) document.documentElement.classList.add('fit')
  const resize = () => {
    if (!fit) return
    const s = Math.min(innerWidth / 1920, innerHeight / 1080)
    stage.style.transform = `scale(${s}) translate(-50%, -50%)`
  }
  addEventListener('resize', resize); resize()
  const q = new URLSearchParams(location.search)
  if (q.has('t')) { seek(+q.get('t')) } else {
    const t0 = performance.now()
    const loop = (now) => { seek(((now - t0) / 1000) % DUR); requestAnimationFrame(loop) }
    requestAnimationFrame(loop)
  }
}
</script>
</body>
</html>
