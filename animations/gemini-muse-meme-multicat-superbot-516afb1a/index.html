<script>
// Boot guard. The spot is ~230 files, and an ES module graph runs only if every one of them downloads: when GitHub
// Pages refuses some of a cold load's requests (it does, for an address that loads the page over and over), nothing
// runs and the page stays black. A failed graph fires `error` on its module script, so bootFailed() reloads instead,
// waiting longer each time; the HTTP cache keeps every file that did arrive, so each try refetches only what failed.
// The count of tries clears once both entry modules have loaded. After the last try the page says so, with a Retry
// button: never a silent black page.
(function () {
  var KEY = 'boot-tries:' + location.pathname, WAIT = [1500, 4000, 10000], ENTRIES = 2, loaded = 0, failed = false;
  function note(text, retry) {
    var el = document.getElementById('boot') || document.body.appendChild(Object.assign(document.createElement('div'), { id: 'boot', className: 'boot' }));
    el.textContent = text;
    if (retry) {
      var again = document.createElement('button');
      again.textContent = 'Retry';
      again.onclick = function () { location.reload(); };
      el.appendChild(again);
    }
  }
  window.bootLoaded = function () {
    if (++loaded === ENTRIES) sessionStorage.removeItem(KEY);
  };
  window.bootFailed = function () {
    if (failed) return;
    failed = true;
    var n = Number(sessionStorage.getItem(KEY) || 0);
    console.error(new Error('the spot\'s modules failed to download (try ' + (n + 1) + ' of ' + (WAIT.length + 1) + ')'));
    if (n < WAIT.length) {
      sessionStorage.setItem(KEY, String(n + 1));
      note('Loading…');
      setTimeout(function () { location.reload(); }, WAIT[n]);
    } else {
      sessionStorage.removeItem(KEY);
      note('The spot could not download all its files.', true);
    }
  };
})();
</script>
