<style>
/* ---------- tokens: the site's own ladder (site.css :root) ---------- */
:root {
  --bg: #000000; --card: #0d0d0d; --raised: #181818; --line: #262626;
  --fg: #ececec; --secondary: #cfcfcf; --muted: #9a9a9a;
  --storm-0: #00e5c3; --storm-1: #2b6bff; --storm-2: #6a1fd8; --storm-3: #c026d3; --storm-4: #ff3d9a;
  --storm: linear-gradient(135deg, var(--storm-0) 0%, var(--storm-1) 25%, var(--storm-2) 50%, var(--storm-3) 75%, var(--storm-4) 100%);
  --storm-x: linear-gradient(90deg, var(--storm-1) 0%, var(--storm-2) 45%, var(--storm-3) 75%, var(--storm-4) 100%);
  --ui: "SF Pro Rounded", "SF Pro Display", -apple-system, system-ui, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
body { font-family: var(--ui); color: var(--fg); -webkit-font-smoothing: antialiased; }

/* ---------- the 1920x1080 stage, scaled to the viewport ---------- */
#stage { position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px; transform-origin: 50% 50%; background: #000; overflow: hidden; }
.scene { position: absolute; inset: 0; opacity: 0; visibility: hidden; }
.scene.on { visibility: visible; }
#dip { position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; z-index: 50; }
#flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 40; }

/* ---------- scene 1: the chaos field, the slam, the lists ---------- */
#chaos { background: #000; }

/* the DVD-bounce icons: the real brand tiles — full-bleed artwork on black,
   border only (the grey card fill is gone). will-change only on the sprites. */
.app { position: absolute; left: 0; top: 0; display: grid; place-items: center;
  background: #000; border: 1px solid var(--line); border-radius: 24%;
  box-shadow: 0 10px 30px rgba(0,0,0,.55);
  will-change: transform, opacity; }
.app img { width: 100%; height: 100%; display: block; border-radius: 24%; }
.app svg { width: 62%; height: 62%; color: var(--secondary); fill: currentColor; }

/* the agent's skills: chips like the client's reference — dark pill, colored
   dot, white filename. dot hue follows the extension. width measured after
   insert (system font, so it's stable). */
.app.doc { display: flex; align-items: center; gap: .45em;
  background: #1d1d1f; border: 1px solid #2c2c2e; border-radius: 999px; padding: 0 .8em; }
.app.doc::before { content: ''; width: .3em; height: .3em; border-radius: 50%;
  background: var(--dot, var(--storm-0)); flex: none; }
.app.doc span { font-weight: 700; color: #fff; white-space: nowrap; }

/* the slam: the tile carries the flip; the flash carries the impact */
#tile { position: absolute; left: 50%; top: 50%; width: 260px; height: 260px; margin: -130px 0 0 -130px;
  will-change: transform, opacity, filter; opacity: 0; }
#tile img { width: 100%; height: 100%; display: block; filter: drop-shadow(0 30px 80px rgba(0,0,0,.8)); }

/* the organized lists, spit out into the quadrants (fixed tops: homes are
   geometry, so no font-load race in the measure pass) */
.card { position: absolute; width: 360px; background: var(--card); border: 1px solid var(--line);
  border-radius: 20px; padding: 14px 18px 10px; box-shadow: 0 30px 80px rgba(0,0,0,.6);
  will-change: transform, opacity; opacity: 0; }
.card h3 { margin: 2px 0 10px; font-size: 13px; font-weight: 700; letter-spacing: .18em;
  text-transform: uppercase; color: var(--muted); }
.card h3 b { background: var(--storm-x); -webkit-background-clip: text; background-clip: text; color: transparent; }
.row { display: flex; align-items: center; gap: 12px; height: 44px; opacity: 0; }
.row svg, .row img { width: 26px; height: 26px; color: var(--secondary); flex: none; }
.row img { border-radius: 6px; }
.row span { font-size: 19px; font-weight: 500; color: var(--secondary); }

/* ---------- scene 2: the tagline card (the reference ad's card scene) ---------- */
#tag { display: grid; place-items: center; background: #000; }
#tag .line { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%); text-align: center;
  font-size: 108px; font-weight: 800; letter-spacing: -.035em; line-height: 1.08; color: #fff; }
#tag .grad { background: var(--storm-x); -webkit-background-clip: text; background-clip: text; color: transparent; }

/* ---------- scene 3: the end card (the reference ad's, verbatim) ---------- */
#end { display: grid; place-items: center; background: #000; }
#end .lock { display: flex; align-items: center; gap: 44px; }
#end svg.face { width: 220px; height: 220px; overflow: visible; }
#end .words { overflow: hidden; }
#end .words h1 { margin: 0; font-size: 128px; font-weight: 800; letter-spacing: -.03em; line-height: 1; color: #fff; }
#end .words p { margin: 12px 0 0 6px; font-size: 34px; color: var(--muted); font-weight: 500; }

/* ---------- aspect ratios (assets/ar.css): the scenes reflow to the frame ---------- */
/* the physics scene is simulated at the stage width (W = AR.w); the tidy cards are placed inline for
   1920 (250px in from each edge), so narrower stages pull them in beside the 260px mascot tile */
html[data-ar="4x3"] #c-agents, html[data-ar="4x3"] #c-skills { left: 115px !important; }
html[data-ar="4x3"] #c-ides, html[data-ar="4x3"] #c-tools { right: 115px !important; }
html[data-ar="1x1"] .card { width: 330px; }
html[data-ar="1x1"] #c-agents, html[data-ar="1x1"] #c-skills { left: 40px !important; }
html[data-ar="1x1"] #c-ides, html[data-ar="1x1"] #c-tools { right: 40px !important; }
html[data-ar="4x5"] .card { width: 290px; }
html[data-ar="4x5"] #c-agents, html[data-ar="4x5"] #c-skills { left: 16px !important; }
html[data-ar="4x5"] #c-ides, html[data-ar="4x5"] #c-tools { right: 16px !important; }
html[data-ar="4x5"] #tile { width: 220px; height: 220px; margin: -110px 0 0 -110px; }
</style>

<script>
// ---------- the clock: one render(t), a pure function of story time ----------
// Every visual is recomputed from t each frame (Remotion's rule: a frame is a
// function of its number), so seeking (`?t=4.35`) or capturing any frame yields
// the same picture. The skeleton is the site's own hub-boot.js: seg() windows,
// pure tweens, no timers. Frame-indexed at 30fps so preview and capture agree.
const FPS = 30, LOOP = 13.4;
const $ = (id) => document.getElementById(id);
const clamp01 = (v) => Math.max(0, Math.min(1, v));
const seg = (t, a, b) => clamp01((t - a) / (b - a));
const outQuint = (p) => 1 - Math.pow(1 - p, 5);
const outCubic = (p) => 1 - Math.pow(1 - p, 3);
const outBack = (p) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); };
const lerp = (a, b, p) => a + (b - a) * p;
const pow = (p, e) => Math.pow(Math.max(0, p), e);

// the DVD bounce, analytic: position = spawn + v·e(t) folded into the frame by
// a triangle wave (reflect at the walls), so position at ANY t is one closed
// form — no integration, no state, and `?t=` seeks draw what playback drew.
// e(t) is a time-warp: a small sin on the clock that swings each icon's speed
// ±~70% without ever reversing it (de/dt stays in [0.28, 1.72]) — the cheapest
// pure-frame answer to the metronomic-motion tell of a fold field.
const fold = (v, lo, hi) => { const span = hi - lo; let x = (v - lo) % (2 * span); if (x < 0) x += 2 * span; return lo + (x <= span ? x : 2 * span - x); };

// ---------- the beat sheet (story seconds) ----------
const B = {
  first: 0.2, last: 3.2,                        // the chaos field ramps 0 → 120, mature by ~3.55
  slamIn: 4.0, slamLand: 4.3,                   // the superbot tile slams into center (the site's fv-flip-icon-grow)
  suck: 4.6,                                    // hold 0.3s after the land, then the field is sucked in (0.5s)
  spit: 5.8,                                    // 0.7s after the suck, the organized lists fly out
  tagDip: 8.22, tagIn: 8.55, tagOut: 10.22,     // dips complete one full frame BEFORE each cut
  end: 10.55, word: 11.25,                      // the end sequence (the reference ad's, verbatim)
  loopDip: 13.02,                               // the loop seam dips to black before LOOP
};
const W = AR.w, H = AR.h, CX = W / 2, CY = H / 2;

// ---------- the icon registry (the site's rail + the sibling ads' assets) ----------
// real brand artwork, straight from the site hero's own registry (sphere-intro's tiles)
const BRANDS = ['chatgpt.webp', 'claude.png', 'gemini-app-icon.png', 'cursor.png', 'copilot.svg',
  'devin.png', 'grok.png', 'hermes.png', 'kiro.ico', 'replit.png', 'lovable.png',
  'jetbrains.png', 'bolt.png', 'base44.png', 'v0.svg', 'vscode.png', 'warp.png'];
// the agent's own scattered skills — the mess the slam resolves
const FILES = ['SKILL.md', '.mcp.json', 'agents.md', 'rules.mdc', 'CLAUDE.md', 'subagent.md',
  'prompt.md', 'workflow.json', 'talent.ts', 'server.mcp', 'scraper.md', 'release-notes.md',
  'inbox-triage.md', 'deploy-approval.md'];
const N = 120;

// seeded RNG so the field is identical on every load (seek == playback)
function mulberry32(seed) { return function () { seed |= 0; seed = (seed + 0x6D2B79F5) | 0; let s = Math.imul(seed ^ (seed >>> 15), 1 | seed); s = (s + Math.imul(s ^ (s >>> 7), 61 | s)) ^ s; return ((s ^ (s >>> 14)) >>> 0) / 4294967296; }; }

// ---------- static builds ----------
const stage = $('stage');
const field = $('field'), tile = $('tile'), flash = $('flash');
const chaos = $('chaos'), dip = $('dip');
const tag = $('tag'), tagLine = $('tag-line');
const end = $('end'), endFace = $('end-face'), endSlide = $('end-slide');
const cards = ['c-agents', 'c-ides', 'c-skills', 'c-tools'].map((id) => { const el = $(id); return { el, rows: [...el.querySelectorAll('.row')], hx: el.offsetLeft, hy: el.offsetTop, hw: el.offsetWidth / 2, hh: el.offsetHeight / 2 }; });

const rng = mulberry32(0x544078ab);
const frac = (v) => v - Math.floor(v);
const icons = [];
for (let i = 0; i < N; i++) {
  const isFile = rng() < 0.55;                                     // half bubbles, half real apps
  const file = FILES[Math.floor(rng() * FILES.length)];
  const type = isFile ? file : BRANDS[Math.floor(rng() * BRANDS.length)];
  // depth tiers: big=near=fast is the parallax cue that turns 40 same sprites
  // into a pile; each tier bounces in its own fold box so tiers can't phase-lock
  const tier = rng() < 0.34 ? 0 : rng() < 0.5 ? 1 : 2;
  const s = [lerp(84, 96, rng()), lerp(64, 80, rng()), lerp(52, 62, rng())][tier];
  const speed = [lerp(300, 340, rng()), lerp(210, 260, rng()), lerp(140, 170, rng())][tier];
  const box = [[70, 1850, 110, 970], [110, 1810, 140, 940], [150, 1770, 170, 910]][tier];
  const fadeIn = lerp(1, 0.8, tier / 2);                       // the far tier sits back
  const spawnAt = B.first + (B.last - B.first) * pow(i / (N - 1), 1.35);
  // velocity mix: break the diagonal-grid read — a third of the icons run
  // near-horizontal or near-vertical, the rest free angles
  let ang;
  const ar = rng();
  if (ar < 0.18) ang = (rng() < 0.5 ? 0 : Math.PI) + lerp(-0.4, 0.4, rng());
  else if (ar < 0.33) ang = (rng() < 0.5 ? 0.5 : -0.5) * Math.PI + lerp(-0.4, 0.4, rng());
  else ang = rng() * Math.PI * 2;
  const x0 = lerp(box[0] + 40, box[1] - 40, rng()), y0 = lerp(box[2] + 40, box[3] - 40, rng());
  const el = document.createElement('div');
  el.className = 'app' + (isFile ? ' doc' : '');
  el.style.height = s + 'px';
  if (isFile) {
    el.style.fontSize = (s * 0.38).toFixed(1) + 'px';
    // dot hue follows the extension, so the bubbles read differentiated
    const ext = file.slice(file.lastIndexOf('.') + 1);
    el.style.setProperty('--dot', { md: 'var(--storm-0)', json: 'var(--storm-1)', mdc: 'var(--storm-3)', ts: 'var(--storm-4)', mcp: 'var(--storm-2)' }[ext] || 'var(--storm-0)');
  } else el.style.width = s + 'px';
  el.innerHTML = isFile ? `<span>${file}</span>` : `<img src="assets/${type}" alt="">`;
  field.appendChild(el);
  // bubbles size to their text: measure after insert (system font, stable);
  // tiles are square
  const iw = isFile ? Math.max(el.offsetWidth, s * 1.15) : s;
  icons.push({
    el, s, iw, box, fadeIn, spawnAt, x0, y0,
    vx: Math.cos(ang) * speed, vy: Math.sin(ang) * speed,
    // the time-warp clock and the rotation wobble: golden-ratio phases so no
    // two icons ever sync; 30% get a constant slow spin instead of pure wobble
    w: lerp(0.10, 0.16, rng()), wp: lerp(1.4, 2.8, rng()), wph: frac(i * 0.618034) * Math.PI * 2,
    amp: isFile ? lerp(3, 6, rng()) : lerp(4, 10, rng()),           // files wobble less: keep labels readable
    rp: lerp(1.7, 2.9, rng()), rph: frac(i * 0.618034 + 0.5) * Math.PI * 2,
    spin: rng() < 0.3 ? (rng() < 0.5 ? -1 : 1) * (rng() < 0.5 ? 9 : 16) : 0,
    popDur: lerp(0.30, 0.38, rng()),
  });
}
// frozen chaos positions at the suck moment (analytic, so any seek agrees) —
// the suck runs farthest-first in 4.5ms steps, one inhale rather than 40 straws
for (const ic of icons) {
  const e = (B.suck - ic.spawnAt) + ic.w * Math.sin((B.suck - ic.spawnAt) * Math.PI * 2 / ic.wp + ic.wph);
  const pad = Math.max(ic.iw, ic.s) / 2 + 8;
  ic.fx = fold(ic.x0 + ic.vx * e, pad, W - pad);
  ic.fy = fold(ic.y0 + ic.vy * e, pad, H - pad);
  ic.fd = Math.hypot(ic.fx - CX, ic.fy - CY);
}
const suckOrder = [...icons].sort((a, b) => b.fd - a.fd);
suckOrder.forEach((ic, k) => { ic.suckAt = B.suck + k * 0.0045; });

// ---------- style helpers (transform/opacity only) ----------
const op = (el, v) => { el.style.opacity = String(clamp01(v)); };
const scene = (el, on) => { el.classList.toggle('on', on); op(el, on ? 1 : 0); };
// the impact wave: the frozen field ripples outward in lockstep at the slam,
// one expression per icon per frame
const wave = (d, dt) => 42 * Math.exp(-Math.pow(d - 565 * dt, 2) / (2 * 70 * 70));

// ---------- the chaos field, the slam, the suck, the lists ----------
function renderChaos(t) {
  // the field: pop in, bounce, ripple at the slam, then get sucked into the icon
  const q = seg(t, B.suck, B.suck + 0.5);                        // the merge window
  for (const ic of icons) {
    const pn = seg(t, ic.spawnAt, ic.spawnAt + ic.popDur);
    const sq = seg(t, ic.suckAt, ic.suckAt + 0.32);              // this icon's own inhale
    if (pn <= 0 || sq >= 1) { op(ic.el, 0); continue; }
    const pad = Math.max(ic.iw, ic.s) / 2 + 8;
    const et = Math.max(0, t - ic.spawnAt);
    const e = et + ic.w * Math.sin(et * Math.PI * 2 / ic.wp + ic.wph);
    let x = fold(ic.x0 + ic.vx * e, pad, W - pad);
    let y = fold(ic.y0 + ic.vy * e, pad, H - pad);
    let sc = lerp(0.6, 1, outBack(pn));
    let vis = outCubic(pn) * ic.fadeIn;
    // the slam's traveling ripple on the frozen positions
    const dt = t - B.slamLand;
    if (dt > 0 && dt < 0.68) {
      const d = Math.hypot(x - CX, y - CY), disp = wave(d, dt) / Math.max(d, 1);
      x += (x - CX) * disp; y += (y - CY) * disp;
    }
    // the suck: converge to the center icon, shrink, vanish into it
    if (sq > 0) {
      const qq = pow(sq, 1.7);
      x = lerp(x, CX, qq); y = lerp(y, CY, qq);
      sc *= 1 - 0.85 * qq;
      vis *= 1 - seg(sq, 0.7, 1);
    }
    const rot = (ic.spin ? ic.spin * et : 0) + ic.amp * Math.sin(et * Math.PI * 2 / ic.rp + ic.rph) * (1 - sq);
    ic.el.style.transform = `translate(${(x - ic.iw / 2).toFixed(1)}px, ${(y - ic.s / 2).toFixed(1)}px) rotate(${rot.toFixed(2)}deg) scale(${sc.toFixed(3)})`;
    op(ic.el, vis);
  }
  // the tile: the site's fv-flip-icon-grow, compressed into a slam — it drops
  // in flipping (rotateY 180→0 on the same accelerating clock), brightens to
  // full at impact, squashes for 4 frames, settles 1.05→1, then breathes idly
  // through the spit so the center never sits dead.
  let tv = 0, ts = 1, ty = 0, bright = 1, flip = 0, sqx = 1, sqy = 1;
  if (t >= B.slamIn) {
    tv = 1;
    if (t < B.slamLand) {
      const p = pow(seg(t, B.slamIn, B.slamLand), 1.8);          // accelerating into impact
      ty = -560 * (1 - p); ts = lerp(1.9, 1.05, p); flip = 180 * (1 - p); bright = lerp(0.5, 1, p);
    } else {
      const sqF = Math.floor((t - B.slamLand) * FPS);            // the 4-frame squash
      if (sqF < 4) { sqy = [0.93, 0.97, 0.995, 1][sqF]; sqx = [1.055, 1.03, 1.008, 1][sqF]; }
      ts = lerp(1.05, 1, outCubic(seg(t, B.slamLand, B.slamLand + 0.2)));
      if (t >= B.suck && t < B.suck + 0.5) ts *= 1 + 0.1 * Math.sin(seg(t, B.suck, B.suck + 0.5) * Math.PI);
      if (t >= B.suck + 0.5) ts *= 1 + 0.015 * Math.sin((t - B.suck - 0.5) * Math.PI * 2 / 3);
    }
  }
  tile.style.opacity = String(tv);
  tile.style.transform = `translateY(${ty.toFixed(1)}px) perspective(900px) rotateY(${flip.toFixed(1)}deg) scale(${(ts * sqx).toFixed(3)}, ${(ts * sqy).toFixed(3)})`;
  tile.style.filter = `brightness(${bright.toFixed(2)})`;
  // the impact: white flash only (the ring blast is gone)
  op(flash, t < B.slamLand ? 0 : (1 - seg(t, B.slamLand, B.slamLand + 0.3)) * 0.25);
  // the lists: spit out of the icon (card center starts at screen center),
  // glide to their quadrant homes with a settling rotation, rows cascade under
  for (let k = 0; k < cards.length; k++) {
    const c = cards[k];
    const r0 = B.spit + k * 0.1, r = outQuint(seg(t, r0, r0 + 0.55));
    const dx = lerp(CX - (c.hx + c.hw), 0, r), dy = lerp(CY - (c.hy + c.hh), 0, r);
    const tilt = lerp(k % 2 ? 8 : -8, 0, r);
    c.el.style.transform = `translate(${dx.toFixed(1)}px, ${dy.toFixed(1)}px) rotate(${tilt.toFixed(2)}deg) scale(${lerp(0.2, 1, r).toFixed(3)})`;
    op(c.el, r);
    for (let j = 0; j < c.rows.length; j++) {
      const rn = seg(t, r0 + 0.2 + j * 0.067, r0 + 0.2 + j * 0.067 + 0.42);
      op(c.rows[j], Math.min(1, rn * 2));
      c.rows[j].style.transform = `translateX(${((1 - outCubic(rn)) * 24).toFixed(1)}px) scale(${lerp(0.7, 1, outBack(rn)).toFixed(3)})`;
    }
  }
}

// ---------- the tagline card and the end card ----------
function renderTag(t) {
  const a = seg(t, B.tagIn, B.tagIn + 0.35), out = seg(t, B.tagOut - 0.25, B.tagOut);
  op(tagLine, a * (1 - out));
  tagLine.style.transform = `translateY(-50%) translateY(${((1 - outQuint(a)) * 24 - out * 16).toFixed(1)}px) scale(${lerp(0.96, 1, outQuint(a)).toFixed(3)})`;
}
function renderEnd(t) {
  const f = seg(t, B.end, B.end + 0.5), w = seg(t, B.word, B.word + 0.7);
  op(endFace, f); endFace.style.transform = `scale(${lerp(0.5, 1, outBack(f)).toFixed(3)})`;
  endSlide.style.transform = `translateX(${((1 - outQuint(w)) * -110).toFixed(1)}%)`;
  op(endSlide, w);
}

// ---------- render ----------
function render(t) {
  // ----- scene routing -----
  const inChaos = t < B.tagIn, inTag = t >= B.tagIn && t < B.end, inEnd = t >= B.end;
  scene(chaos, inChaos); scene(tag, inTag); scene(end, inEnd);
  // the dips to black: each completes one full frame BEFORE the cut it covers,
  // and lifts over 0.35s after it — the house convention
  op(dip, t < B.tagDip ? 0
    : t < B.tagIn ? seg(t, B.tagDip, B.tagDip + 0.3)
    : t < B.tagOut ? 1 - seg(t, B.tagIn, B.tagIn + 0.35)
    : t < B.end ? seg(t, B.tagOut, B.tagOut + 0.3)
    : t < B.loopDip ? 1 - seg(t, B.end, B.end + 0.35)
    : 1);
  if (inChaos) renderChaos(t);
  if (inTag) renderTag(t);
  if (inEnd) renderEnd(t);
}

// ---------- fit the stage to the viewport ----------
function fit() {
  const k = Math.min(innerWidth / AR.w, innerHeight / AR.h);
  stage.style.transform = `translate(-50%, -50%) scale(${k})`;
  stage.style.left = '50%'; stage.style.top = '50%';
}
addEventListener('resize', fit); fit();

// ---------- the clock ----------
// `?t=<s>` seeks and holds (frame capture); `?t=<s>&play=1` seeks and runs on;
// otherwise it plays and loops. Time is quantised to whole frames so a preview
// and a capture at the same t draw the same picture.
const q = new URLSearchParams(location.search);
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const seekTo = q.has('t') ? parseFloat(q.get('t')) : null;
let t0 = performance.now() - (seekTo || 0) * 1000, last = -1;
function frame(now) {
  const t = ((now - t0) / 1000) % LOOP;
  const f = Math.floor(t * FPS);
  if (f !== last) { last = f; render(f / FPS); }
  requestAnimationFrame(frame);
}
if (reduced) { render(B.word + 1); }
else if (seekTo !== null && !q.has('play')) { render(Math.floor(seekTo * FPS) / FPS); }
else requestAnimationFrame(frame);
</script>
</body>
</html>
