<script src="../../assets/ar.js"></script>
<script>
// 9:16 is not in the shared ar.js ratio list, so this spot adds it for itself: ?ar=9x16 gives a 608 x 1080 stage
// (the same contract ar.js writes for its own ratios: window.AR, data-ar and the --ar-* vars). Re-applied on resize
// because ar.js, unlocked, re-picks the nearest of its four ratios on every resize.
(function () {
  var q = (new URLSearchParams(location.search).get('ar') || '').replace(':', 'x').replace('-', 'x');
  if (q !== '9x16') return;
  var doc = document.documentElement;
  function apply() {
    var w = 608;
    var prev = window.AR && window.AR.key;
    window.AR = { key: '9x16', w: w, h: 1080, crop: (1920 - w) / 2, ratio: 9 / 16, a: 9, b: 16 };
    doc.dataset.ar = '9x16';
    doc.style.setProperty('--ar-w', w + 'px');
    doc.style.setProperty('--ar-crop', ((1920 - w) / 2) + 'px');
    doc.style.setProperty('--ar-ratio', '9 / 16');
    doc.style.setProperty('--ar-f', String(9 / 16));
    if (prev && prev !== '9x16') dispatchEvent(new CustomEvent('archange', { detail: window.AR }));
  }
  apply();
  addEventListener('resize', apply);
})();
</script>
