<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>superbot: make me relaxing Japan bikeride</title>
<script src="../../assets/ar.js"></script>
<link rel="stylesheet" href="../../assets/ar.css">
<link rel="stylesheet" href="style.css?v=2">
<link rel="preload" as="image" href="media/bikeride-poster.jpg">
</head>
<body>
<div id="stage">

  <!-- the chat: header, thread (bubble, switch pill, clip slot), composer. Every moving value is written by
       timeline.js from t alone; nothing here transitions on its own. -->
  <section id="chat">
    <header class="top">
      <span class="sb-tile"><i class="cat cat-c"></i><i class="cat cat-m"></i><i class="cat cat-w"></i></span>
      <b>superbot</b>
    </header>

    <div class="col" id="col">
      <div class="thread" id="thread">
        <div class="row row-u"><p class="bubble" id="bubble">Make me relaxing Japan bikeride</p></div>
        <div class="row row-m">
          <div class="sw" id="sw">
            <span class="sw-tile" id="swTile"></span>
            <span class="sw-lab" id="swLab"><span class="sw-fix">Switching to</span><span class="sw-win" id="swWin"></span></span>
            <span class="sw-st">
              <i class="sw-spin" id="swSpin"></i>
              <svg class="sw-ok" viewBox="0 0 24 24" aria-hidden="true"><path id="swOk" pathLength="1" d="M5 12.5l4.5 4.5L19 7.5"/></svg>
            </span>
          </div>
        </div>
        <div class="row row-m"><div class="slot" id="slot"></div></div>
      </div>

      <div class="composer" id="composer">
        <span class="field"><span class="typed" id="typed"></span><i class="caret" id="caret"></i><span class="ph" id="ph">Ask superbot anything</span></span>
        <span class="send" id="send"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5.5 11.5L12 5l6.5 6.5"/></svg></span>
      </div>
    </div>
  </section>

  <!-- the clip: one layer that sits on the thread's slot as a card, then grows to the full frame (FLIP) -->
  <div id="clip">
    <img class="poster" src="media/bikeride-poster.jpg" alt="">
    <video id="vid" src="media/bikeride.mp4" poster="media/bikeride-poster.jpg" muted playsinline preload="auto"></video>
  </div>

  <!-- the end card: hard cut to black, the wordmark, then the mark. No motion. -->
  <section id="endcard">
    <div class="lock">
      <h1 id="word">superbot</h1>
      <span class="mark" id="mark"><i class="cat cat-c"></i><i class="cat cat-m"></i><i class="cat cat-w"></i></span>
    </div>
  </section>

</div>
<script src="timeline.js?v=2"></script>
</body>
</html>
