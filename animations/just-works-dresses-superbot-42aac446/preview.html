<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>preview: 10 Dresses on Amazon</title>
<link rel="stylesheet" href="./site.css">
<style>
  /* preview page chrome only, never used by the ad */
  html, body { margin: 0; background: #e9e1d4; }
  .pvw-bar {
    margin: 0;
    padding: 12px 16px;
    border-bottom: 1px solid #d5c9b6;
    font: 10px/1.4 'Helvetica Neue', Helvetica, Arial, sans-serif;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: #6f6455;
  }
  .pvw-frame {
    width: 100%;
    max-width: 1560px;
    margin: 0 auto;
    background: #f6f1e8;
    box-shadow: 0 22px 60px rgba(26, 23, 20, .14);
  }
</style>
</head>
<body>
<p class="pvw-bar">preview · dresses lookbook · standalone dev page, not the ad timeline</p>
<div class="pvw-frame"><div id="pv-root" class="site site-dresses"></div></div>
<script type="module">
  import * as data from './data.js';
  import * as site from './site.js';

  const root = document.getElementById('pv-root');
  site.default(root, { data, cfg: {} });

  // dev only. In the ad the kit toggles these same classes from the scroll, hover and click plan.
  root.addEventListener('click', (e) => {
    const heart = e.target.closest && e.target.closest('.heart');
    if (heart) heart.classList.toggle('is-active');
  });
  root.addEventListener('mouseover', (e) => {
    const look = e.target.closest && e.target.closest('.look');
    root.querySelectorAll('.look.is-hover').forEach((l) => { if (l !== look) l.classList.remove('is-hover'); });
    if (look) look.classList.add('is-hover');
  });
  root.addEventListener('mouseout', (e) => {
    const look = e.target.closest && e.target.closest('.look');
    if (look) look.classList.remove('is-hover');
  });
</script>
</body>
</html>
