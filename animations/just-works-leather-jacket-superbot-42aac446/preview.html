<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>preview: Vintage leather jacket, size M</title>
<link rel="stylesheet" href="./site.css">
<style>
  /* preview page chrome only, never used by the ad */
  html, body { margin: 0; background: #d9d3c6; }
  .pvw-bar {
    margin: 0;
    padding: 12px 16px;
    border-bottom: 1px solid #b9b1a1;
    font: 10px/1.4 ui-monospace, 'SF Mono', Menlo, monospace;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: #6a6255;
  }
  .pvw-frame {
    width: 100%;
    max-width: 1600px;
    margin: 0 auto;
    background: #f4efe5;
    box-shadow: 0 22px 60px rgba(20, 18, 14, .16);
  }
</style>
</head>
<body>
<p class="pvw-bar">preview &middot; leather, size M &middot; standalone dev page, not the ad timeline</p>
<div class="pvw-frame"><div id="pv-root" class="site site-leather-jacket"></div></div>
<script type="module">
  import cfg from './ad.js';
  import * as data from './data.js';
  import * as site from './site.js';

  const root = document.getElementById('pv-root');
  site.default(root, { data, cfg });

  // dev only. In the ad the kit toggles these same classes from the scroll, hover and click plan.
  root.addEventListener('click', (e) => {
    const save = e.target.closest && e.target.closest('.ljm-save');
    if (save) save.classList.toggle('is-active');
  });
  root.addEventListener('mouseover', (e) => {
    const card = e.target.closest && e.target.closest('.ljm-card');
    root.querySelectorAll('.ljm-card.is-hover').forEach((c) => { if (c !== card) c.classList.remove('is-hover'); });
    if (card) card.classList.add('is-hover');
  });
  root.addEventListener('mouseout', (e) => {
    const card = e.target.closest && e.target.closest('.ljm-card');
    if (card) card.classList.remove('is-hover');
  });
</script>
</body>
</html>
