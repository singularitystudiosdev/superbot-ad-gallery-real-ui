<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Friday, 2 seats - preview</title>
<link rel="stylesheet" href="./site.css">
<style>
  html, body { margin: 0; background: #070b12; }
  #preview-root { width: 100%; }
</style>
</head>
<body>
<div id="preview-root" class="site site-tickets"></div>
<script type="module">
  import cfg from './ad.js';
  import * as data from './data.js';
  import * as site from './site.js';

  const root = document.getElementById('preview-root');
  const draw = () => site.default(root, { data, cfg });
  draw();

  // dev page only: mirrors the kit's hover plan on the lower bowl section the ad hovers, and makes a real
  // pointer work here the same way the kit's cursor does: the hotspot only reports, site.render() lights
  // the section's own svg wedge. The class order matters, so the hover goes on before render() runs.
  const hover = (el, on) => {
    if (!el) return;
    el.classList.toggle('is-hover', on);
    if (site.render) site.render(root, 0.62);
  };
  const sec = root.querySelector('.tix-hb__w[data-sec="112"]');
  root.querySelectorAll('.tix-hb__w').forEach((w) => {
    w.addEventListener('pointerover', () => hover(w, true));
    w.addEventListener('pointerout', () => hover(w, false));
  });
  hover(sec, true);
  // dev page only: mirrors the kit's click plan on the Checkout button.
  const go = root.querySelector('.tix-best .tix-go');
  if (go) go.classList.add('is-active');
  if (site.render) site.render(root, 0.62);

  // dev page only: re-draw button, proves build() is idempotent on the same root.
  const bar = document.createElement('div');
  bar.style.cssText = 'position:fixed;right:12px;bottom:12px;z-index:99;display:flex;gap:8px;font:600 12px/1 -apple-system,system-ui,sans-serif';
  const again = document.createElement('button');
  again.textContent = 'build() again';
  again.style.cssText = 'padding:9px 12px;border-radius:8px;border:1px solid rgba(255,255,255,.2);background:#1a222c;color:#e9eef4;cursor:pointer';
  again.onclick = () => {
    draw();
    root.querySelectorAll('.tix-hb__w').forEach((w) => {
      w.addEventListener('pointerover', () => hover(w, true));
      w.addEventListener('pointerout', () => hover(w, false));
    });
    hover(root.querySelector('.tix-hb__w[data-sec="112"]'), true);
    const g = root.querySelector('.tix-best .tix-go');
    if (g) g.classList.add('is-active');
  };
  bar.appendChild(again);
  document.body.appendChild(bar);
</script>
</body>
</html>
