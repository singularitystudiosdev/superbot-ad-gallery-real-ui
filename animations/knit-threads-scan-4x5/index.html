<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Knit, Threads-style: your Mac, read into a thread (4:5)</title>
<style>
/* Plays the rendered 1080x1350 film (final.mp4, 18 s, 30 fps, with sound) at 4:5 on
   the film's own grey canvas. The gallery loads this page in a frame at any
   ?ar=; the 4:5 picture is fitted whole and the rest of the frame stays grey. */
:root {
  --canvas: #f2f2f2;
  --surface: #ffffff;
  --ink: #000000;
  --hairline: #e5e5e5;
}

*, *::before, *::after { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  background: var(--canvas);
}

body {
  display: grid;
  place-items: center;
}

.frame {
  position: relative;
  width: min(100vw, 80vh);
  aspect-ratio: 4 / 5;
  background: var(--canvas);
}

video {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
  background: var(--canvas);
}

</style>
</head>
<body>
<div class="frame">
  <video id="film" src="final.mp4" poster="poster.png" autoplay loop playsinline preload="auto"
    aria-label="Knit, Threads-style: your Mac, read into a thread (4:5): Knit scans your Mac and posts each find as a reply in a thread, the reply line doubling as the progress bar, gathers interests and traits into topic tags, suggests groups in a card carousel, you join and reply in the group thread with a custom like, ending on the knit card, with sound on (18s loop)."></video>
</div>
<script>
  const video = document.getElementById("film");
  // Sound is always on: try unmuted autoplay, and if the browser refuses it, play muted and unmute on the
  // viewer's first click, key or touch.
  const unmute = () => {
    video.muted = false;
    video.play().catch(() => {});
  };
  const start = () => {
    video.muted = false;
    video.play().catch(() => {
      video.muted = true;
      video.play().catch(() => {});
    });
  };
  for (const type of ["pointerdown", "keydown", "touchstart"]) addEventListener(type, unmute, { once: true, capture: true });
  // the gallery lightbox posts { type: "unmute" } on the viewer's first click or key
  addEventListener("message", (e) => {
    if (e.data && e.data.type === "unmute") unmute();
  });
  if (video.readyState >= 2) start();
  else video.addEventListener("canplay", start, { once: true });
</script>
</body>
</html>
