<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>100 CODES · silhouette · superbot ad spot</title>
<script src="../../assets/ar.js"></script>
<link rel="stylesheet" href="../../assets/ar.css">
<link rel="stylesheet" href="kit/mascot.css">
<link rel="stylesheet" href="kit/stage.css">
<script src="kit/mascot.js"></script>
<script src="kit/codes.js"></script>
<script src="kit/stage.js"></script>
<style>
  .fx { position: absolute; left: 0; top: 0; }
  .copy { display: flex; flex-direction: column; align-items: flex-start; }
  .copy .mc-type { white-space: nowrap; }
  .copy .l2 { margin-top: 18px; }
</style>
</head>
<body>
<script>
/* 100 CODES. ONE FACE. A hundred invite codes drift loose across the frame, then fly into formation
   inside the real mark's silhouette (its mask rect and ear paths, hit-tested with isPointInPath), the
   edges and eye holes cut crisp, and the codes dissolve into the solid mark, which blinks and smiles.
   Then the face breaks back into codes and they drift apart for the loop. */
var L = 9, N = 100;
var MK, LY, lg, OX, OY, PAD, W, cv, g, mark, l2, codes, items, slots = null, box = null, geo = null, F = 12;
var FONT = '"SF Mono", ui-monospace, Menlo, Consolas, monospace';
var IN0 = 0.9, IN1 = 1.9, FLY = 1.35, CRISP0 = 3.3, CRISP1 = 3.7, MASC0 = 3.95, MASC1 = 4.55, BACK0 = 6.95, BACK1 = 7.35, OUT0 = 7.25, OUT1 = 7.6;

// the real mark's mask geometry, read from its own svg (viewBox units 0..100): the white parts are
// separate shapes (unioned, like the svg mask paints them), the eyes are the black holes.
function markGeometry(svg) {
  var r = svg.querySelector('mask rect');
  var body = new Path2D();
  body.roundRect(+r.getAttribute('x'), +r.getAttribute('y'), +r.getAttribute('width'), +r.getAttribute('height'), +r.getAttribute('rx'));
  var parts = [body];
  svg.querySelectorAll('mask .mark-ear').forEach(function (p) { parts.push(new Path2D(p.getAttribute('d'))); });
  var eyes = new Path2D();
  svg.querySelectorAll('mask .mark-eye').forEach(function (e) {
    eyes.ellipse(+e.getAttribute('cx'), +e.getAttribute('cy'), +e.getAttribute('rx'), +e.getAttribute('ry'), 0, 0, Math.PI * 2);
  });
  return { parts: parts, eyes: eyes };
}

function layout() {
  box = SB.box(mark.svg);
  geo = markGeometry(mark.svg);
  var probe = document.createElement('canvas').getContext('2d');
  var s = box.width / 100;
  function inside(x, y) { // stage px -> unit space hit test on the real mask shape
    var u = (x - box.left) / s, v = (y - box.top) / s;
    for (var i = 0; i < geo.parts.length; i++) if (probe.isPointInPath(geo.parts[i], u, v)) return true;
    return false;
  }
  function build(f) {
    probe.font = '600 ' + f + 'px ' + FONT;
    var cw = probe.measureText('XXXXXXXXXXXXXXXX').width, gap = f * 0.9, rh = f * 1.34;
    var out = [], row = 0;
    for (var y = box.top + 20.5 * s + rh * 0.35; y < box.top + 86 * s + rh * 0.3; y += rh, row++) {
      var off = (row % 2) * (cw + gap) * 0.5;
      for (var x = box.left + 14 * s - off; x < box.left + 86 * s; x += cw + gap) {
        var hit = 0;
        for (var k = 0; k < 9; k++) {
          if (inside(x + cw * k / 8, y)) hit++;
          if (inside(x + cw * k / 8, y - rh * 0.4)) hit++;
          if (inside(x + cw * k / 8, y + rh * 0.4)) hit++;
        }
        if (hit >= 1) out.push({ x: x + cw / 2, y: y, cover: hit });
      }
    }
    return { list: out, cw: cw };
  }
  // pick the font size that lands closest to N slots, then trim the thinnest edge slots
  var best = null;
  for (var f = 6; f <= 24; f += 0.05) {
    var b = build(f);
    // Never fewer than N: every code needs a slot; surplus slots are trimmed below.
    var err = b.list.length < N ? 1000 + N - b.list.length : b.list.length - N;
    if (!best || err < best.err || (err === best.err && f > best.f)) best = { f: f, b: b, err: err };
  }
  F = best.f;
  var list = best.b.list.slice().sort(function (a, c) { return c.cover - a.cover; }).slice(0, N);
  // pair slots to scatter positions by angle around the face so the flight reads as a swirl, not a tangle
  var cx = box.x, cy = box.y;
  list.sort(function (a, c) { return Math.atan2(a.y - cy, a.x - cx) - Math.atan2(c.y - cy, c.x - cx); });
  var order = items.slice().sort(function (a, c) { return Math.atan2(a.sy - cy, a.sx - cx) - Math.atan2(c.sy - cy, c.sx - cx); });
  order.forEach(function (it, i) { it.tx = list[i].x; it.ty = list[i].y; });
  slots = list;
  // silhouette mask + a scratch layer the size of the face
  PAD = Math.ceil(4 * s);
  var mw = Math.ceil(box.width + PAD * 2), mh = Math.ceil(box.height + PAD * 2);
  MK = document.createElement('canvas'); MK.width = mw; MK.height = mh;
  var m = MK.getContext('2d');
  m.setTransform(s, 0, 0, s, box.left - Math.floor(box.left - PAD), box.top - Math.floor(box.top - PAD));
  m.fillStyle = '#fff';
  geo.parts.forEach(function (pt) { m.fill(pt); });
  m.globalCompositeOperation = 'destination-out';
  m.fill(geo.eyes);
  LY = document.createElement('canvas'); LY.width = mw; LY.height = mh;
  lg = LY.getContext('2d');
  OX = Math.floor(box.left - PAD); OY = Math.floor(box.top - PAD);
}

function scatterAt(it, t) {
  var a = 2 * Math.PI * t / L;
  return { x: it.sx + Math.sin(a + it.ph) * it.amp, y: it.sy + Math.cos(a * 1 + it.ph * 1.7) * it.amp * 0.6 };
}

function flight(it, t) { // 0 = loose, 1 = in formation
  var a = SB.seg(t, it.t0, it.t0 + FLY);
  var b = SB.seg(t, it.t1, it.t1 + FLY);
  return SB.easeInOut(a) * (1 - SB.easeInOut(b));
}

SB.ad({
  loop: L,
  thumbAt: 3.8,
  build: function (frame, ctx) {
    W = ctx.w;
    slots = null; box = null;
    cv = SB.el('canvas', 'fx', frame);
    cv.width = W; cv.height = 1080;
    g = cv.getContext('2d');
    var n = ctx.narrow;
    var row = SB.el('div', 'mc-lockup', SB.el('div', 'mc-center', frame));
    row.style.gap = n ? '20px' : '40px';
    mark = SB.mascot(row, { size: n ? 420 : 660, blinks: [{ t: 4.95 }, { t: 6.2, right: true }], happy: [[5.35, 1.45]] });
    var copy = SB.el('div', 'copy', row);
    var fs = n ? 104 : 150;
    var l1 = SB.el('div', 'mc-type', copy);
    l1.innerHTML = n ? '100<br>CODES.' : '100 CODES.';
    l2 = SB.el('div', 'mc-type l2', copy);
    l2.innerHTML = n ? 'ONE<br>FACE.' : 'ONE FACE.';
    l1.style.fontSize = l2.style.fontSize = fs + 'px';
    SB.fit(row, W * (n ? 0.92 : 0.9), 900);

    var rnd = SB.rng(4242);
    codes = SB.codes(N, 100);
    items = codes.map(function (c, i) {
      var sx, sy;
      // scatter over the whole frame, biased away from dead center
      sx = 40 + rnd() * (W - 80);
      sy = 40 + rnd() * 1000;
      return {
        code: c, sx: sx, sy: sy, rot: (rnd() - 0.5) * 0.9, z: 0.7 + rnd() * 1.1, amp: 12 + rnd() * 34, ph: rnd() * 6.283,
        a: 0.18 + rnd() * 0.32, bulge: (rnd() - 0.5) * 260,
        t0: IN0 + rnd() * (IN1 - IN0), t1: OUT0 + rnd() * (OUT1 - OUT0)
      };
    });
  },
  frame: function (t, ctx) {
    if (!slots) layout();
    var s = box.width / 100;
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.clearRect(0, 0, W, 1080);
    g.font = '600 ' + F + 'px ' + FONT;
    g.textAlign = 'center';
    g.textBaseline = 'middle';

    var solid = SB.easeInOut(SB.seg(t, MASC0, MASC1)) * (1 - SB.easeInOut(SB.seg(t, BACK0, BACK1)));
    mark.el.style.opacity = solid.toFixed(3);
    l2.style.opacity = (SB.seg(t, MASC1 - 0.1, MASC1 + 0.35) * (1 - SB.seg(t, OUT0, OUT0 + 0.4))).toFixed(3);
    l2.style.transform = 'translateY(' + ((1 - SB.easeOut(SB.seg(t, MASC1 - 0.1, MASC1 + 0.45))) * 26).toFixed(1) + 'px)';

    var K = new Array(items.length), any = false;
    for (var i = 0; i < items.length; i++) { K[i] = flight(items[i], t); if (K[i] > 0.9) any = true; }

    // landed codes are drawn through the real silhouette mask (edges and eye holes cut), with the mark's
    // own cyan / magenta split; they dissolve into the solid mark and back
    var fa = 1 - solid * 0.96;
    if (any && fa > 0.002) {
      var passes = [[-1.2, 'rgba(0,229,195,', 0.5], [1.2, 'rgba(192,38,211,', 0.5], [0, 'rgba(236,236,236,', 1]];
      lg.font = g.font; lg.textAlign = 'center'; lg.textBaseline = 'middle';
      for (var p = 0; p < 3; p++) {
        var d = passes[p][0] * s;
        lg.globalCompositeOperation = 'source-over';
        lg.clearRect(0, 0, LY.width, LY.height);
        for (var i2 = 0; i2 < items.length; i2++) {
          var w = SB.seg(K[i2], 0.9, 1);
          if (w <= 0) continue;
          lg.fillStyle = passes[p][1] + (w * passes[p][2]).toFixed(3) + ')';
          lg.fillText(items[i2].code, items[i2].tx - OX + d, items[i2].ty - OY + d);
        }
        lg.globalCompositeOperation = 'destination-in';
        lg.drawImage(MK, d, d);
        g.globalAlpha = fa;
        g.drawImage(LY, OX, OY);
        g.globalAlpha = 1;
      }
    }

    // loose and flying codes
    for (var j = 0; j < items.length; j++) {
      var q = items[j];
      var k = K[j];
      var al0 = 1 - SB.seg(k, 0.9, 1);
      if (al0 <= 0) continue;
      var sc = scatterAt(q, t);
      var x = SB.lerp(sc.x, q.tx, k), y = SB.lerp(sc.y, q.ty, k);
      // curved path: bulge perpendicular to the travel line
      var dx = q.tx - sc.x, dy = q.ty - sc.y, len = Math.hypot(dx, dy) || 1, b = Math.sin(k * Math.PI) * q.bulge;
      x += -dy / len * b; y += dx / len * b;
      var z = SB.lerp(q.z, 1, k), al = SB.lerp(q.a, 0.95, k) * al0;
      if (al < 0.004) continue;
      var rot = q.rot * (1 - k);
      var c = Math.cos(rot) * z, sn = Math.sin(rot) * z;
      g.setTransform(c, sn, -sn, c, x, y);
      g.fillStyle = 'rgba(236,236,236,' + al.toFixed(3) + ')';
      g.fillText(q.code, 0, 0);
    }
    g.setTransform(1, 0, 0, 1, 0, 0);
  }
});
</script>
</body>
</html>
