<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>COMMENT 'SUPERBOT' · reply bot · superbot ad spot</title>
<script src="../../assets/ar.js"></script>
<link rel="stylesheet" href="../../assets/ar.css">
<link rel="stylesheet" href="kit/mascot.css">
<link rel="stylesheet" href="kit/stage.css">
<script src="kit/mascot.js"></script>
<script src="kit/codes.js"></script>
<script src="kit/stage.js"></script>
<style>
  .grp { position: absolute; left: 0; top: 0; display: flex; align-items: center; gap: 52px; transform-origin: 0 0; white-space: nowrap; }
  .holder { transform-origin: 50% 80%; }
  .copy { display: grid; }
  .line { grid-area: 1 / 1; font-size: 124px; line-height: 0.92; text-transform: uppercase; transform-origin: 0 50%; }
  .q { text-shadow: -2.4px 0 var(--storm-0), 2.4px 0 var(--storm-3); }
  .feed { position: absolute; overflow: hidden;
    -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 26%, #000 100%);
    mask-image: linear-gradient(to bottom, transparent 0, #000 26%, #000 100%); }
  .bub { position: absolute; left: 0; top: 0; display: flex; gap: 26px; align-items: center; padding: 0 40px 0 26px;
    background: #0e0e0e; border: 2px solid rgba(255,255,255,0.14); border-radius: 38px; letter-spacing: 0; white-space: nowrap;
    transform-origin: 0 100%; }
  .av { width: 84px; height: 84px; border-radius: 50%; flex: none; display: flex; align-items: center; justify-content: center;
    font-size: 36px; font-weight: 800; color: #0b0b0b; }
  .meta { font-size: 29px; font-weight: 600; color: rgba(255,255,255,0.46); }
  .meta b { color: rgba(255,255,255,0.78); font-weight: 700; }
  .txt { font-size: 50px; font-weight: 700; color: #fff; margin-top: 3px; }
  .reply { border-color: rgba(255,255,255,0.34); background: #121212; }
  .reply .av { background: none; width: 92px; height: 92px; }
  .reply .txt { font-size: 40px; font-weight: 600; color: rgba(255,255,255,0.86); }
  .code { font-size: 46px; color: var(--storm-0); margin-top: 6px; }
  .code span { display: inline-block; }
  .heart { width: 34px; height: 34px; margin-left: 24px; flex: none; opacity: 0.45; }
</style>
</head>
<body>
<script>
/* COMMENT 'SUPERBOT', replied: comments reading "superbot" rise and stack in a feed beside the lockup, the
   mark nods at each one as it lands, then its own reply slides in from its side with a code that decodes
   in place. The feed clears, the lockup glides to centre and the payoff lands: WE REPLY WITH A CODE. */
var LOOP = 9;
var HEAD = 0.12, ARR = [0.8, 1.32, 1.8, 2.22, 2.6, 2.95], REPLY = 3.55, CODE_A = 3.95, CODE_PER = 0.028;
var CODE_DONE = CODE_A + 19 * CODE_PER;
var FEED_OUT = 5.55, GLIDE = 5.65, END_IN = 6.15, OUT = 8.15;
var H = 158, HR = 250, G = 20, PAD = 20;
var COMMENTS = [
  ['@nightowl', 'superbot', '#d9d9d9'], ['@pixelmaya', 'SUPERBOT', '#9a9a9a'], ['@lofi.leo', 'superbot pls', '#c4c4c4'],
  ['@jkim_dev', 'superbot!!', '#7e7e7e'], ['@tessarine', 'superbot', '#b0b0b0'], ['@moonbyte', 'superbot please', '#e6e6e6']
];
var grp, holder, mark, avMark, head, endl, feed, items, codeSpans, code, F, A, B;
var HEART = '<svg class="heart" viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.8 4.5c2.2 0 3.6 1.2 5.2 3.1 1.6-1.9 3-3.1 5.2-3.1 3.8 0 5.9 3.9 4.4 7.3C19.5 16.4 12 21 12 21z" fill="none" stroke="#fff" stroke-width="2"/></svg>';

function hash(a, b) {
  var h = Math.imul(a + 0x9e3779b9, 0x85ebca6b) ^ Math.imul(b + 0x632be5ab, 0xc2b2ae35);
  h ^= h >>> 13; h = Math.imul(h, 0x27d4eb2f); h ^= h >>> 15;
  return h >>> 0;
}
function arrive(t, at) { return SB.easeOut(SB.seg(t, at, at + 0.45)); }
function pushed(i, t) {
  var s = 0;
  for (var j = i + 1; j < items.length; j++) s += (items[j].h + G) * arrive(t, items[j].at);
  return s;
}
function itemTop(i, t) { return F.h - PAD - items[i].h - pushed(i, t) + (1 - arrive(t, items[i].at)) * 90; }
function newest(t) { var n = -1; for (var i = 0; i < items.length; i++) if (t >= items[i].at) n = i; return n; }

SB.ad({
  loop: LOOP,
  thumbAt: 4.75,
  build: function (frame, ctx) {
    var W = ctx.w, stacked = W < 1600;
    grp = SB.el('div', 'grp', frame);
    holder = SB.el('div', 'holder', grp);
    mark = SB.mascot(holder, { size: 300, happy: [[CODE_DONE + 0.04, 1.0], [END_IN + 0.35, 1.5]] });
    var copy = SB.el('div', 'copy', grp);
    head = SB.el('div', 'line', copy);
    head.innerHTML = 'COMMENT<br><span class="q">‘SUPERBOT’</span>';
    endl = SB.el('div', 'line', copy);
    endl.innerHTML = 'WE REPLY<br>WITH <span class="q">A CODE.</span>';
    var gw = grp.offsetWidth, gh = grp.offsetHeight;
    if (!stacked) {
      var fw = Math.min(680, W * 0.37);
      F = { x: W - fw - W * 0.05, y: 80, w: fw, h: 920 };
      var rw = F.x - W * 0.05 - 70, sA = Math.min(1, rw / gw, 620 / gh);
      A = { x: W * 0.05, y: 540 - gh * sA / 2, s: sA };
    } else {
      var fw2 = Math.min(W * 0.86, 760);
      F = { x: (W - fw2) / 2, y: 380, w: fw2, h: 1080 - 400 - 24 };
      var sA2 = Math.min(1, W * 0.86 / gw, 300 / gh);
      A = { x: (W - gw * sA2) / 2, y: 60 + (300 - gh * sA2) / 2, s: sA2 };
    }
    var sB = Math.min(1.08, W * 0.84 / gw, 640 / gh);
    B = { x: (W - gw * sB) / 2, y: 540 - gh * sB / 2, s: sB };

    feed = SB.el('div', 'feed', frame);
    feed.style.left = F.x + 'px'; feed.style.top = F.y + 'px';
    feed.style.width = F.w + 'px'; feed.style.height = F.h + 'px';
    items = COMMENTS.map(function (c, i) {
      var b = SB.el('div', 'bub', feed);
      b.style.height = H + 'px';
      var av = SB.el('div', 'av', b, c[0].charAt(1).toUpperCase());
      av.style.background = c[2];
      var col = SB.el('div', '', b);
      SB.el('div', 'meta', col).innerHTML = '<b>' + c[0] + '</b> · now';
      SB.el('div', 'txt', col, c[1]);
      b.insertAdjacentHTML('beforeend', HEART);
      return { el: b, h: H, at: ARR[i], x: 0 };
    });
    var r = SB.el('div', 'bub reply', feed);
    r.style.height = HR + 'px';
    var rav = SB.el('div', 'av', r);
    avMark = SB.mascot(rav, { size: 92, happy: [[CODE_DONE + 0.04, 1.0]], seed: 77 });
    var rcol = SB.el('div', '', r);
    SB.el('div', 'meta', rcol).innerHTML = '<b style="color:#fff">@superbot</b> · replied';
    SB.el('div', 'txt', rcol, 'here’s your code:');
    var cl = SB.el('div', 'code mc-mono', rcol);
    code = SB.codes(1, 91)[0];
    codeSpans = Array.prototype.map.call(code, function (ch) { return SB.el('span', '', cl, ch); });
    items.push({ el: r, h: HR, at: REPLY, x: stacked ? 48 : 64 });
    var avail = F.w - 8;
    items.forEach(function (it) {
      var s = Math.min(1, (avail - it.x) / it.el.offsetWidth);
      it.fit = s;
    });

    mark.look = function (t) {
      if (t < ARR[0] || t >= FEED_OUT) return null;
      var n = newest(t), it = items[n];
      return { x: F.x + it.x + 140, y: F.y + itemTop(n, t) + it.h * (n === items.length - 1 ? 0.72 : 0.5) };
    };
  },
  frame: function (t) {
    // lockup: slam the headline, glide to centre for the payoff, glide home under the fade
    var g = SB.easeInOut(SB.seg(t, GLIDE, GLIDE + 0.75)) - SB.easeInOut(SB.seg(t, OUT + 0.15, OUT + 0.8));
    var x = SB.lerp(A.x, B.x, g), y = SB.lerp(A.y, B.y, g), s = SB.lerp(A.s, B.s, g);
    grp.style.transform = 'translate(' + x.toFixed(2) + 'px,' + y.toFixed(2) + 'px) scale(' + s.toFixed(4) + ')';

    var hp = SB.seg(t, HEAD, HEAD + 0.34);
    var hOut = 1 - SB.easeOut(SB.seg(t, GLIDE - 0.05, GLIDE + 0.22));
    head.style.opacity = String((t >= HEAD ? Math.min(1, hp * 3) : 0) * hOut);
    head.style.transform = 'scale(' + (t < HEAD ? 1.3 : SB.lerp(1.3, 1, SB.backOut(hp))).toFixed(4) + ') translateY(' + (-(1 - hOut) * 30).toFixed(1) + 'px)';
    var ew = SB.easeOut(SB.seg(t, END_IN, END_IN + 0.5));
    endl.style.clipPath = 'inset(-12% ' + (100 - ew * 100).toFixed(2) + '% -12% 0)';
    endl.style.opacity = String(1 - SB.seg(t, OUT, OUT + 0.4));

    // the mark nods at each comment as it lands
    var nod = 0;
    items.forEach(function (it) { var d = SB.seg(t, it.at + 0.05, it.at + 0.5); nod += Math.sin(d * Math.PI) * (1 - d * 0.3); });
    holder.style.transform = 'rotate(' + (nod * 4).toFixed(2) + 'deg) translateY(' + (nod * 7).toFixed(1) + 'px)';

    var fo = SB.easeInOut(SB.seg(t, FEED_OUT, FEED_OUT + 0.45));
    feed.style.opacity = String(1 - fo);
    feed.style.transform = 'translateY(' + (-fo * 40).toFixed(1) + 'px)';
    for (var i = 0; i < items.length; i++) {
      var it = items[i], e = arrive(t, it.at);
      var dx = i === items.length - 1 ? -(1 - e) * 160 : 0;
      var sc = it.fit * (i === items.length - 1 ? 1 : SB.lerp(0.9, 1, e));
      it.el.style.opacity = t < it.at ? '0' : String(Math.min(1, SB.seg(t, it.at, it.at + 0.18)));
      it.el.style.transform = 'translate(' + (it.x + dx).toFixed(1) + 'px,' + itemTop(i, t).toFixed(1) + 'px) scale(' + sc.toFixed(4) + ')';
      it.el.style.transformOrigin = '0 0';
    }

    // the code decodes left to right
    var f = Math.floor(t * 30 + 1e-6);
    for (var k = 0; k < codeSpans.length; k++) {
      var ch = code.charAt(k);
      if (ch === '-') continue;
      var done = t >= CODE_A + k * CODE_PER;
      codeSpans[k].textContent = done ? ch : SB.ALPHA.charAt(hash(k, f) % SB.ALPHA.length);
      codeSpans[k].style.opacity = done ? '1' : '0.38';
    }
  }
});
</script>
</body>
</html>
