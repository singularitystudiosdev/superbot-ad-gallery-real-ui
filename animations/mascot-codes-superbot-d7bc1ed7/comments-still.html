<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FIRST 100 COMMENTS = EARLY ACCESS · still · superbot ad spot</title>
<script src="../../assets/ar.js"></script>
<link rel="stylesheet" href="../../assets/ar.css">
<link rel="stylesheet" href="kit/mascot.css">
<link rel="stylesheet" href="kit/stage.css">
<script src="kit/mascot.js"></script>
<script src="kit/codes.js"></script>
<script src="kit/stage.js"></script>
</head>
<body>
<script>
/* FIRST 100 COMMENTS = EARLY ACCESS, the plain one: the mark reads the offer top line then bottom line,
   and smiles at the payoff. */
var mark, lines = [];
SB.ad({
  loop: 6,
  thumbAt: 4.3,
  build: function (frame, ctx) {
    var center = SB.el('div', 'mc-center', frame);
    var lockup = SB.el('div', 'mc-lockup', center);
    mark = SB.mascot(lockup, { size: 300, happy: [[3.9, 1.2]] });
    var type = SB.el('div', 'mc-type', lockup);
    type.style.fontSize = '150px';
    var rows = ctx.narrow ? ['FIRST 100', 'COMMENTS', '= EARLY', 'ACCESS'] : ['FIRST 100 COMMENTS', '= EARLY ACCESS'];
    lines = rows.map(function (r) { return SB.el('div', '', type, r); });
    SB.fit(lockup, ctx.w * 0.88, 1080 * 0.76);
    mark.look = function (t) {
      var i = t < 0.4 || t > 5.4 ? -1 : Math.min(lines.length - 1, Math.floor((t - 0.4) / (3.4 / lines.length)));
      if (i < 0) return null;
      var b = SB.box(lines[i]);
      return { x: b.x, y: b.y };
    };
  }
});
</script>
</body>
</html>
