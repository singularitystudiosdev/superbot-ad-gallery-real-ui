<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drop timer · 0.1 s drop · superbot ad spot</title>
<script src="../../assets/ar.js"></script>
<link rel="stylesheet" href="../../assets/ar.css">
<link rel="stylesheet" href="kit/mascot.css">
<link rel="stylesheet" href="kit/stage.css">
<script src="kit/mascot.js"></script>
<script src="kit/codes.js"></script>
<script src="kit/stage.js"></script>
<style>
  .col { position: relative; }
  .layer { display: flex; flex-direction: column; align-items: flex-start; }
  .layer.b { position: absolute; left: 0; top: 50%; }
  .lbl { display: block; width: max-content; line-height: 0.95; text-transform: uppercase; }
  .timer { display: flex; align-items: baseline; font-size: 400px; line-height: 0.84; font-variant-numeric: tabular-nums;
           margin-top: 18px; transform-origin: 0% 55%; }
  .dwin { position: relative; display: inline-block; overflow: hidden; height: 0.9em; }
  .dwin span { display: block; }
  .dwin .nx { position: absolute; left: 0; top: 0; }
  .colon { display: inline-block; transform: translateY(-0.06em); padding: 0 0.02em; }
  .big { display: block; width: max-content; line-height: 0.9; text-transform: uppercase; transform-origin: 0% 60%; }
  .handle { display: block; margin-top: 34px; color: #9a9a9a; letter-spacing: .06em; }
  .wall { position: absolute; inset: 0; display: grid; align-content: stretch; justify-content: stretch; visibility: hidden;
          background: #000; }
  .wall div { display: flex; align-items: center; justify-content: center; color: #fff; white-space: nowrap; }
</style>
</head>
<body>
<script>
/* Drop timer: "CODES DROP IN 00:05" counts down, each second's last digit rolls in; the final second
   beats four times with the mark's cyan/magenta split. At zero, 100 codes fill the whole frame for
   exactly three frames (0.1 s at 30 fps, frames 150 to 152) while the mark squeezes its eyes shut.
   Then "MISSED IT?" and "FOLLOW." slam in, the mark smiles, and the timer slides back in at 00:05. */
var LOOP = 9, ZERO = 5, FLASH0 = 150, FLASH1 = 152, B0 = 5.5, B1 = 5.85, OUT0 = 8.2, IN0 = 8.4, IN1 = 8.85;
var WALL = SB.codes(100, 500);
var mark, layA, layB, lbl, timer, dA, dB, missed, follow, handle, wall, cells = [], B = null;

function secAt(t) { return t >= ZERO ? 0 : 5 - Math.floor(t); }

SB.ad({
  loop: LOOP,
  thumbAt: 4.27,
  build: function (frame, ctx) {
    var center = SB.el('div', 'mc-center', frame);
    var lockup = SB.el('div', 'mc-lockup', center);
    lockup.style.gap = '90px';
    mark = SB.mascot(lockup, {
      size: ctx.narrow ? 360 : 400,
      happy: [[B1 + 0.05, 1.5]],
      closed: function (t) { return t >= ZERO && t < ZERO + 0.3; }
    });
    var col = SB.el('div', 'col', lockup);
    layA = SB.el('div', 'layer a', col);
    lbl = SB.el('div', 'lbl mc-type', layA, 'CODES DROP IN');
    timer = SB.el('div', 'timer mc-type', layA);
    if (ctx.narrow) timer.style.fontSize = '300px';
    SB.el('span', '', timer, '00');
    SB.el('span', 'colon', timer, ':');
    SB.el('span', '', timer, '0');
    var win = SB.el('span', 'dwin', timer);
    dA = SB.el('span', 'cur', win, '5');
    dB = SB.el('span', 'nx', win, '4');
    layB = SB.el('div', 'layer b', col);
    missed = SB.el('div', 'big mc-type', layB, 'MISSED IT?');
    follow = SB.el('div', 'big mc-type', layB, 'FOLLOW.');
    handle = SB.el('div', 'handle mc-mono', layB, '');
    var tw = timer.offsetWidth;
    lbl.style.fontSize = '140px'; lbl.style.fontSize = (140 * tw / lbl.offsetWidth) + 'px';
    missed.style.fontSize = '200px'; missed.style.fontSize = (200 * tw / missed.offsetWidth) + 'px';
    follow.style.fontSize = missed.style.fontSize;
    handle.style.fontSize = (parseFloat(missed.style.fontSize) * 0.26) + 'px';
    layB.style.marginTop = (-layB.offsetHeight / 2) + 'px';
    col.style.width = tw + 'px';
    SB.fit(lockup, ctx.w * 0.86, 1080 * 0.8);
    // the 0.1 s wall: 100 codes edge to edge
    wall = SB.el('div', 'wall mc-mono', frame);
    var cols = ctx.w >= 1400 ? 5 : 4, rows = 100 / cols;
    wall.style.gridTemplateColumns = 'repeat(' + cols + ', minmax(0, 1fr))';
    wall.style.gridTemplateRows = 'repeat(' + rows + ', minmax(0, 1fr))';
    var fs = Math.min(ctx.w / cols / 19 / 0.62, 1080 / rows * 0.62);
    wall.style.fontSize = fs.toFixed(1) + 'px';
    var r = SB.rng(9);
    cells = WALL.map(function (c) {
      var d = SB.el('div', '', wall, c);
      var x = r();
      if (x < 0.06) d.style.color = 'var(--storm-0)'; else if (x < 0.12) d.style.color = 'var(--storm-3)';
      return d;
    });
    // measure the real mono advance and shrink the wall until every code sits inside its cell
    wall.style.visibility = 'visible';
    var c0 = cells[0], span = document.createElement('span');
    span.textContent = WALL[0]; c0.textContent = ''; c0.appendChild(span);
    var cellW = c0.getBoundingClientRect().width, txtW = span.getBoundingClientRect().width;
    if (txtW > cellW * 0.86) wall.style.fontSize = (fs * cellW * 0.86 / txtW).toFixed(2) + 'px';
    c0.textContent = WALL[0];
    wall.style.visibility = 'hidden';
    B = null;
    mark.look = function (t) {
      if (!B) B = { win: SB.box(win), timer: SB.box(timer), missed: SB.box(missed), follow: SB.box(follow), handle: SB.box(handle) };
      if (t < B0 || t >= OUT0) return { x: B.win.x, y: B.win.y };
      if (t < B1) return { x: B.missed.x, y: B.missed.y };
      if (t < B1 + 0.9) return { x: B.follow.x, y: B.follow.y };
      if (t < B1 + 1.9) {
        var p = SB.easeInOut(SB.seg(t, B1 + 0.9, B1 + 1.7));
        return { x: SB.lerp(B.follow.left, B.follow.right, p), y: B.follow.y };
      }
      return null;
    };
  },
  frame: function (t) {
    var fi = Math.round(t * 30);
    var flash = fi >= FLASH0 && fi <= FLASH1;
    wall.style.visibility = flash ? 'visible' : 'hidden';
    // countdown with a rolling last digit
    var s = secAt(t);
    var k = t < ZERO + 0.5 ? Math.floor(t) : -1;         // second boundary we are past
    var roll = k >= 1 && k <= 5 ? SB.easeOut(SB.seg(t, k, k + 0.2)) : 1;
    var prev = Math.min(5, s + 1);
    if (roll < 1) {
      dA.textContent = String(prev); dB.textContent = String(s);
      dA.style.transform = 'translateY(' + (roll * 100).toFixed(2) + '%)';
      dB.style.transform = 'translateY(' + ((roll - 1) * 100).toFixed(2) + '%)';
      dB.style.visibility = 'visible';
    } else {
      dA.textContent = String(s); dA.style.transform = ''; dB.style.visibility = 'hidden';
    }
    // last second: four beats
    var sc = 1, sp = 0;
    if (t >= 4 && t < ZERO) {
      var ph = ((t - 4) * 4) % 1;
      var e = Math.exp(-ph * 7);
      sc = 1 + 0.07 * e; sp = 1.5 + 12 * e;
    } else if (t >= ZERO && t < B0) {
      sp = 2;
    }
    timer.style.transform = 'scale(' + sc.toFixed(4) + ')';
    timer.style.textShadow = sp ? (-sp).toFixed(2) + 'px 0 var(--storm-0),' + sp.toFixed(2) + 'px 0 var(--storm-3)' : 'none';
    // layer A: live until the drop, dims after it, gone at B0, back in before the seam
    var aOp = 1;
    if (t >= ZERO && t < B0) aOp = SB.lerp(1, 0.28, SB.easeOut(SB.seg(t, ZERO + 0.1, ZERO + 0.35)));
    if (t >= B0) aOp = 0;
    if (t >= IN0) aOp = SB.easeOut(SB.seg(t, IN0, IN1));
    layA.style.opacity = String(flash ? 0 : aOp);
    layA.style.transform = t >= IN0 ? 'translateY(' + SB.lerp(60, 0, SB.easeOut(SB.seg(t, IN0, IN1))) + 'px)' : '';
    // layer B
    var bo = SB.seg(t, OUT0, OUT0 + 0.3);
    layB.style.visibility = t >= B0 && t < OUT0 + 0.3 ? 'visible' : 'hidden';
    layB.style.opacity = String(1 - bo);
    layB.style.transform = 'translateY(' + SB.lerp(0, -50, SB.easeInOut(bo)) + 'px)';
    [[missed, B0], [follow, B1]].forEach(function (p) {
      var g = SB.seg(t, p[1], p[1] + 0.32);
      p[0].style.opacity = String(t >= p[1] ? 1 : 0);
      p[0].style.transform = 'scale(' + SB.lerp(1.6, 1, SB.backOut(g)) + ')';
      var gs = t >= p[1] ? SB.lerp(18, 2.4, SB.easeOut(SB.seg(t, p[1], p[1] + 0.55))) : 0;
      p[0].style.textShadow = (-gs).toFixed(2) + 'px 0 var(--storm-0),' + gs.toFixed(2) + 'px 0 var(--storm-3)';
    });
    handle.style.opacity = String(SB.easeOut(SB.seg(t, B1 + 0.45, B1 + 0.8)));
    // the mark is hidden by the wall for its three frames
    mark.el.style.visibility = flash ? 'hidden' : 'visible';
  }
});
</script>
</body>
</html>
