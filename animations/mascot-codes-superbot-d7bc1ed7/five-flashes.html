<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>5 FLASHES · 20 codes on every beat · superbot ad spot</title>
<script src="../../assets/ar.js"></script>
<link rel="stylesheet" href="../../assets/ar.css">
<link rel="stylesheet" href="kit/mascot.css">
<link rel="stylesheet" href="kit/stage.css">
<script src="kit/mascot.js"></script>
<script src="kit/codes.js"></script>
<script src="kit/stage.js"></script>
<style>
  .wall { position: absolute; inset: 0; background: #000; }
  .wall-grid { position: absolute; display: grid; justify-content: space-between; align-items: center; color: #fff; }
  .wall-grid > div { white-space: nowrap; text-align: center; }
  .wall-grid .d { opacity: 0.42; }
  .slot { position: relative; }
  .it { position: absolute; left: 0; top: 50%; transform: translateY(-50%); }
  .row { display: flex; gap: 0.16em; font-size: 290px; line-height: 0.9; font-variant-numeric: tabular-nums; }
  .dig { display: inline-block; transform-origin: 50% 70%; }
  .end { font-size: 175px; line-height: 0.96; }
  .ln { display: block; transform-origin: 0% 60%; }
  .hop { will-change: transform; }
</style>
</head>
<body>
<script>
/* A strobe on a steady beat: five flashes, three frames each, 20 fresh codes per flash (100 in all).
   Between beats the mark hops and smiles, and one outlined digit fills per flash while its eyes
   move on to the next. End card: 5 FLASHES. 100 CODES. PAUSE IT. */
var FPS = 30, LOOP = 8;
var IN = 0.2, K0 = 30, BEAT = 24, END = 4.6, L2 = 4.92, L3 = 5.24, OUT = 7.35;
var KS = [0, 1, 2, 3, 4].map(function (i) { return K0 + BEAT * i; });
var DONE = KS.map(function (k) { return (k + 3) / FPS; });
var lockHold, hop, rowEl, digs, endEl, lines, walls, mark, boxes;

function fi(t) { return Math.floor(t * FPS + 1e-4); }
function flashOn(t, k) { var f = fi(t); return f >= k && f < k + 3; }
function split(node, px) { node.style.textShadow = (-px).toFixed(2) + 'px 0 var(--storm-0), ' + px.toFixed(2) + 'px 0 var(--storm-3)'; }

// 100 codes laid out edge to edge: pick the column count that gives the biggest legible type.
function codeWall(parent, ctx, list, opts) {
  opts = opts || {};
  var W = ctx.w, H = 1080, n = list.length;
  var pad = Math.round(Math.min(W, H) * (opts.padK || 0.045)), top = opts.label ? 84 : 0;
  var aw = W - 2 * pad, ah = H - 2 * pad - top, GAP = 1.2, LH = 1.28, CH = 10.0, best = null;
  for (var c = 1; c <= 8; c++) {
    var r = Math.ceil(n / c);
    var f = Math.min(aw / (c * CH + (c - 1) * GAP), ah / (r * LH), opts.maxFont || 999);
    var score = f * (n % c === 0 ? 1.12 : 1);
    if (!best || score > best.score) best = { c: c, r: r, f: f, score: score };
  }
  var wallEl = SB.el('div', 'wall', parent);
  var grid = SB.el('div', 'wall-grid mc-mono', wallEl);
  grid.style.left = pad + 'px'; grid.style.top = (pad + top) + 'px';
  grid.style.width = aw + 'px'; grid.style.height = ah + 'px';
  grid.style.gridTemplateColumns = 'repeat(' + best.c + ', auto)';
  grid.style.gridTemplateRows = 'repeat(' + best.r + ', 1fr)';
  grid.style.fontSize = best.f + 'px';
  list.forEach(function (code) {
    var cell = SB.el('div', '', grid);
    code.split('-').forEach(function (part, i) {
      if (i) SB.el('span', 'd', cell, '-');
      SB.el('span', '', cell, part);
    });
  });
  if (n % best.c) { grid.lastChild.style.gridColumn = '1 / -1'; }
  if (best.c === 1) grid.style.justifyContent = 'center';
  var cw = grid.firstChild.offsetWidth, need = cw * best.c + GAP * best.f * (best.c - 1);
  if (need > aw) grid.style.fontSize = (best.f * aw / need * 0.99) + 'px';
  if (best.f >= 24) split(grid, 1);
  var label = null;
  if (opts.label) {
    label = SB.el('div', 'mc-mono mc-cyan', wallEl, opts.label);
    var lx = best.c === 1 ? pad + (aw - grid.firstChild.offsetWidth) / 2 : pad;
    label.style.cssText += 'position:absolute;left:' + lx + 'px;top:' + pad + 'px;font-size:40px;';
  }
  return { el: wallEl, label: label };
}

// A hit: scale from `from` to 1 with a little overshoot, over dur seconds from `at`.
function hit(t, at, from, dur) { return SB.lerp(from, 1, SB.backOut(SB.seg(t, at, at + (dur || 0.3)))); }
// A slot holds absolutely placed copy that swaps on cuts; size it to its biggest child so the lockup never shifts.
function sizeSlot(slot) {
  var w = 0, h = 0;
  for (var i = 0; i < slot.children.length; i++) { w = Math.max(w, slot.children[i].offsetWidth); h = Math.max(h, slot.children[i].offsetHeight); }
  slot.style.width = w + 'px'; slot.style.height = h + 'px';
  return { w: w, h: h };
}
function show(node, on) { node.style.visibility = on ? 'visible' : 'hidden'; }


SB.ad({
  loop: LOOP,
  thumbAt: 2.75,
  build: function (frame, ctx) {
    boxes = null;
    var c = SB.el('div', 'mc-center', frame);
    lockHold = SB.el('div', '', c);
    var lock = SB.el('div', 'mc-lockup', lockHold);
    lock.style.gap = (ctx.narrow ? 44 : 76) + 'px';
    hop = SB.el('div', 'hop', lock);
    mark = SB.mascot(hop, {
      size: ctx.narrow ? 460 : 420,
      blinks: [{ t: 0.62 }, { t: 6.9, right: true }],
      happy: DONE.map(function (d) { return [d, 0.3]; }).concat([[L3, 1.3]]),
      look: function (t) {
        if (!boxes) boxes = digs.map(function (d) { return SB.box(d); });
        if (t < IN || t >= END) return null;
        var n = 0;
        DONE.forEach(function (d) { if (t >= d + 0.2) n++; });
        var b = boxes[Math.min(4, n)];
        return { x: b.x, y: b.y };
      }
    });
    var slot = SB.el('div', 'slot', lock);
    rowEl = SB.el('div', 'mc-type it row', slot);
    digs = [1, 2, 3, 4, 5].map(function (n) { return SB.el('span', 'dig', rowEl, String(n)); });
    if (ctx.narrow) rowEl.style.fontSize = '210px';
    endEl = SB.el('div', 'mc-type it end', slot);
    lines = ['5 FLASHES.', '100 CODES.', 'PAUSE IT.'].map(function (s) { return SB.el('span', 'ln', endEl, s); });
    sizeSlot(slot);
    SB.fit(lock, ctx.w * 0.86, 1080 * 0.66);
    var all = SB.codes(100, 505);
    walls = KS.map(function (k, i) {
      return codeWall(frame, ctx, all.slice(i * 20, i * 20 + 20), { label: 'FLASH 0' + (i + 1) + '/05', maxFont: 64 });
    });
  },
  frame: function (t) {
    var f = fi(t), anyFlash = false;
    walls.forEach(function (w, i) { var on = flashOn(t, KS[i]); anyFlash = anyFlash || on; show(w.el, on); });
    var pout = SB.easeInOut(SB.seg(t, OUT, OUT + 0.4));
    show(lockHold, t >= IN && !anyFlash && t < OUT + 0.4);
    lockHold.style.opacity = String(SB.seg(t, IN, IN + 0.12) * (1 - pout));
    // The whole lockup lands on each beat as it comes back from a flash.
    var thump = 0, air = 0;
    DONE.forEach(function (d) {
      if (t >= d) thump = Math.max(thump, 1 - SB.easeOut(SB.seg(t, d, d + 0.3)));
      var p = SB.seg(t, d, d + 0.36);
      if (p > 0 && p < 1) air = Math.sin(Math.PI * p);
    });
    lockHold.style.transform = 'scale(' + ((1 + 0.035 * thump) * SB.lerp(1, 0.95, pout)).toFixed(4) + ')';
    hop.style.transform = 'translateY(' + (-58 * air).toFixed(2) + 'px) scale(' + (1 + 0.05 * air).toFixed(4) + ')';

    var isEnd = t >= END;
    show(rowEl, !isEnd); show(endEl, isEnd);
    var n = 0;
    DONE.forEach(function (d) { if (t >= d) n++; });
    digs.forEach(function (d, i) {
      var filled = i < n;
      if (filled) {
        d.style.color = '#fff';
        d.style.webkitTextStroke = '0px transparent';
        d.style.transform = 'scale(' + hit(t, DONE[i], 1.45, 0.3).toFixed(4) + ')';
        split(d, SB.lerp(26, 3, SB.easeOut(SB.seg(t, DONE[i], DONE[i] + 0.3))));
      } else {
        var next = i === n;
        d.style.color = 'transparent';
        d.style.webkitTextStroke = (next ? 6 : 4) + 'px rgba(255,255,255,' + (next ? 0.95 : 0.3) + ')';
        d.style.transform = 'scale(1)';
        d.style.textShadow = 'none';
      }
    });
    [END, L2, L3].forEach(function (at, i) {
      var ln = lines[i];
      show(ln, isEnd && t >= at);
      ln.style.transform = 'scale(' + hit(t, at, 1.2, 0.3).toFixed(4) + ')';
      var pulse = i === 2 && t >= L3 + 0.4 ? Math.pow(Math.max(0, Math.sin(Math.PI * ((t - L3 - 0.4) % 0.8) / 0.8)), 6) : 0;
      split(ln, SB.lerp(22, 3, SB.easeOut(SB.seg(t, at, at + 0.3))) + 7 * pulse);
    });
  }
});
</script>
</body>
</html>
