<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FREE TOKENS · typed · superbot ad spot</title>
<script src="../../assets/ar.js"></script>
<link rel="stylesheet" href="../../assets/ar.css">
<link rel="stylesheet" href="kit/mascot.css">
<link rel="stylesheet" href="kit/stage.css">
<script src="kit/mascot.js"></script>
<script src="kit/codes.js"></script>
<script src="kit/stage.js"></script>
<style>
  .caret { position: absolute; width: 14px; background: #fff; }
  .typed { position: relative; }
</style>
</head>
<body>
<script>
/* FREE TOKENS, typed: the words type themselves in, the mark's eyes ride the caret, it smiles when the
   last letter lands, then the line backspaces out and the loop starts on an empty caret. */
var TEXT = 'FREE TOKENS', TYPE_AT = 0.5, PER = 0.085, DEL_AT = 4.7, DEL_PER = 0.045;
var typed, chars = [], caret, mark, lockup, boxes = null;

function shown(t) {
  if (t < TYPE_AT) return 0;
  if (t < DEL_AT) return Math.min(TEXT.length, Math.floor((t - TYPE_AT) / PER) + 1);
  return Math.max(0, TEXT.length - Math.floor((t - DEL_AT) / DEL_PER) - 1);
}

function caretX(n) {
  if (!n) return chars[0].offsetLeft;
  var c = chars[n - 1];
  return c.offsetLeft + c.offsetWidth + 6;
}

SB.ad({
  loop: 6,
  thumbAt: 2.3,
  build: function (frame, ctx) {
    var center = SB.el('div', 'mc-center', frame);
    lockup = SB.el('div', 'mc-lockup', center);
    mark = SB.mascot(lockup, { size: 300, happy: [[TYPE_AT + PER * TEXT.length + 0.05, 1.2]] });
    typed = SB.el('div', 'mc-type typed', lockup);
    typed.style.fontSize = '190px';
    chars = SB.letters(typed, TEXT);
    if (ctx.narrow) typed.style.fontSize = '150px';
    caret = SB.el('div', 'caret', typed);
    caret.style.top = '8px';
    caret.style.height = (parseFloat(typed.style.fontSize) * 0.8) + 'px';
    SB.fit(lockup, ctx.w * 0.88, 1080 * 0.7);
    boxes = null;
    mark.look = function (t) {
      if (!boxes) boxes = chars.map(function (c) { return SB.box(c); });
      var n = shown(t);
      var b = n ? boxes[n - 1] : boxes[0];
      return { x: n ? b.right : b.left, y: b.y };
    };
  },
  frame: function (t) {
    var n = shown(t);
    for (var i = 0; i < chars.length; i++) chars[i].style.visibility = i < n ? 'visible' : 'hidden';
    caret.style.left = caretX(n) + 'px';
    var typing = (t >= TYPE_AT && t < TYPE_AT + PER * TEXT.length) || t >= DEL_AT;
    caret.style.opacity = typing || Math.floor(t * 2.2) % 2 === 0 ? '1' : '0';
  }
});
</script>
</body>
</html>
