<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Invite field · types itself · superbot ad spot</title>
<script src="../../assets/ar.js"></script>
<link rel="stylesheet" href="../../assets/ar.css">
<link rel="stylesheet" href="kit/mascot.css">
<link rel="stylesheet" href="kit/stage.css">
<script src="kit/mascot.js"></script>
<script src="kit/codes.js"></script>
<script src="kit/stage.js"></script>
<style>
  .col { display: flex; flex-direction: column; align-items: flex-start; gap: 34px; }
  .label { font-size: 30px; letter-spacing: 0.14em; color: #8a8a8a; text-transform: uppercase; }
  .field { display: grid; grid-template-columns: repeat(4, auto); gap: 24px; }
  .field.two { grid-template-columns: repeat(2, auto); }
  .grp { display: flex; align-items: center; justify-content: center; gap: 6px; height: 150px; padding: 0 28px;
         background: #0d0d0d; border: 3px solid #2a2a2a; border-radius: 22px; }
  .slot { position: relative; width: 60px; height: 104px; }
  .slot .ch { position: absolute; left: 0; right: 0; bottom: 8px; text-align: center; font-size: 84px; line-height: 1;
              color: #fff; transform-origin: 50% 80%; }
  .slot .ul { position: absolute; left: 4px; right: 4px; bottom: 0; height: 6px; border-radius: 3px; background: #333; }
  .cap { display: block; width: max-content; text-transform: uppercase; line-height: 0.98; }
</style>
</head>
<body>
<script>
/* Invite field, typing itself: the real beta.superbot.gg/invite segmented field (16 slots in four groups
   of four, the page's own alphabet), redrawn in white on black. A code types in char by char, the mark's
   eyes ride the active slot exactly like the page's paint() -> look(slot centre, slot top), and on the
   16th char the mark smiles the page's own 600ms smile. The caption wipes in, the mark reads it and then
   looks at you; the code backspaces out and the caret waits in slot one, which is where the loop began. */
var LOOP = 7, TYPE_AT = 0.55, CLEAR_AT = 5.95, DEL_PER = 0.03;
var CODE = SB.codes(1, 2026)[0].replace(/-/g, '');
var TIMES = (function () {
  var r = SB.rng(11), out = [], at = TYPE_AT;
  for (var i = 0; i < 16; i++) {
    if (i && i % 4 === 0) at += 0.13;
    out.push(at);
    at += 0.066 + r() * 0.05;
  }
  return out;
})();
var T16 = TIMES[15];
var mark, field, cap, grps = [], slots = [], chs = [], uls = [], B = null;

function typed(t) {
  if (t < CLEAR_AT) {
    var n = 0;
    while (n < 16 && TIMES[n] <= t) n++;
    return n;
  }
  return Math.max(0, 16 - Math.floor((t - CLEAR_AT) / DEL_PER) - 1);
}
function grey(v) { v = Math.round(v); return 'rgb(' + v + ',' + v + ',' + v + ')'; }

SB.ad({
  loop: LOOP,
  thumbAt: Math.round((T16 + 0.5) * 30) / 30,
  build: function (frame, ctx) {
    var center = SB.el('div', 'mc-center', frame);
    var lockup = SB.el('div', 'mc-lockup', center);
    lockup.style.gap = '72px';
    mark = SB.mascot(lockup, { size: ctx.narrow ? 270 : 340, happy: [[T16, 0.6]] });
    var col = SB.el('div', 'col', lockup);
    SB.el('div', 'label', col, 'Invite code');
    field = SB.el('div', 'field mc-mono' + (ctx.w < 1600 ? ' two' : ''), col);
    grps = []; slots = []; chs = []; uls = [];
    for (var g = 0; g < 4; g++) {
      var grp = SB.el('div', 'grp', field);
      grps.push(grp);
      for (var s = 0; s < 4; s++) {
        var slot = SB.el('div', 'slot', grp);
        slots.push(slot);
        chs.push(SB.el('div', 'ch', slot, CODE[g * 4 + s]));
        uls.push(SB.el('div', 'ul', slot));
      }
    }
    cap = SB.el('div', 'cap mc-type', col);
    cap.innerHTML = ctx.w < 1600 ? "COMMENT 'CODE'.<br>ONE IS YOURS." : "COMMENT 'CODE'. ONE IS YOURS.";
    cap.style.fontSize = '92px';
    var fw = field.offsetWidth;
    if (cap.offsetWidth > fw) cap.style.fontSize = (92 * fw / cap.offsetWidth) + 'px';
    SB.fit(lockup, ctx.w * 0.88, 1080 * 0.8);
    B = null;
    mark.look = function (t) {
      if (!B) B = { slots: slots.map(function (n) { return SB.box(n); }), cap: SB.box(cap) };
      var n = typed(t);
      if (t >= T16 && t < CLEAR_AT) {
        if (t > T16 + 2.1) return null;                 // done reading: looks at you
        var p = SB.easeInOut(SB.seg(t, T16 + 0.35, T16 + 1.6));
        return { x: SB.lerp(B.cap.left, B.cap.right, p), y: B.cap.y };
      }
      var sb = B.slots[Math.min(n, 15)];
      return { x: sb.x, y: sb.top };
    };
  },
  frame: function (t) {
    var n = typed(t);
    var done = t >= T16 && t < CLEAR_AT;
    var cur = n < 16 ? n : -1;
    var busy = (t >= TYPE_AT - 0.05 && t < T16) || (t >= CLEAR_AT && n > 0);
    var caretOn = busy || Math.floor(t * 2) % 2 === 0;
    for (var i = 0; i < 16; i++) {
      var on = i < n;
      chs[i].style.visibility = on ? 'visible' : 'hidden';
      if (on && t < CLEAR_AT) {
        var p = SB.seg(t, TIMES[i], TIMES[i] + 0.16);
        chs[i].style.transform = 'translateY(' + SB.lerp(-14, 0, SB.easeOut(p)) + 'px) scale(' + SB.lerp(1.3, 1, SB.backOut(p)) + ')';
      } else chs[i].style.transform = '';
      uls[i].style.visibility = on ? 'hidden' : 'visible';
      uls[i].style.background = i === cur && caretOn ? '#fff' : '#333';
    }
    // completion: every group flashes white and settles, the chars take the mark's own cyan/magenta split
    var flash = t >= T16 ? 1 - SB.easeOut(SB.seg(t, T16, T16 + 0.7)) : 0;
    for (var g = 0; g < 4; g++) {
      var active = cur >= 0 && Math.floor(cur / 4) === g;
      grps[g].style.borderColor = active ? '#fff' : grey(SB.lerp(42, 255, flash));
    }
    var split = t >= T16 ? SB.lerp(12, 2.2, SB.easeOut(SB.seg(t, T16, T16 + 0.5))) : 0;
    field.style.textShadow = split ? (-split) + 'px 0 var(--storm-0), ' + split + 'px 0 var(--storm-3)' : 'none';
    var w = SB.easeOut(SB.seg(t, T16 + 0.02, T16 + 0.42));
    cap.style.clipPath = 'inset(-12% ' + (100 - w * 100) + '% -12% 0)';
    cap.style.opacity = String(done || t >= CLEAR_AT ? 1 - SB.seg(t, CLEAR_AT - 0.3, CLEAR_AT + 0.05) : 0);
  }
});
</script>
</body>
</html>
