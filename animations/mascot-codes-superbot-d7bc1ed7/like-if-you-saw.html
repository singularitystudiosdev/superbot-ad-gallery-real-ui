<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LIKE IF YOU SAW IT · one frame · superbot ad spot</title>
<script src="../../assets/ar.js"></script>
<link rel="stylesheet" href="../../assets/ar.css">
<link rel="stylesheet" href="kit/mascot.css">
<link rel="stylesheet" href="kit/stage.css">
<script src="kit/mascot.js"></script>
<script src="kit/codes.js"></script>
<script src="kit/stage.js"></script>
<style>
  .lock { display: flex; align-items: center; gap: 64px; transform-origin: 50% 50%; white-space: nowrap; }
  .slot { position: relative; display: grid; align-items: center; justify-items: start; }
  .slot > * { grid-area: 1 / 1; }
  .big { font-size: 150px; line-height: 0.92; text-transform: uppercase; transform-origin: 0 50%; }
  .q { text-shadow: -2.4px 0 var(--storm-0), 2.4px 0 var(--storm-3); }
  .code { font-size: 92px; color: #fff; text-shadow: -3px 0 var(--storm-0), 3px 0 var(--storm-3); }
  .vf { position: absolute; grid-area: auto; }
  .corner { position: absolute; width: 46px; height: 46px; border-color: rgba(255,255,255,0.3); border-style: solid; border-width: 0; }
</style>
</head>
<body>
<script>
/* LIKE IF YOU SAW IT, one frame: the mark says DON'T BLINK, then stares at an empty, faintly bracketed
   slot. At a moment that sits on no beat a single code flashes for exactly one frame (1/30 s) and is
   gone. Then: LIKE IF YOU SAW IT. The mark winks with its right eye (it saw it) and smiles. */
var LOOP = 7, FLASH_F = 58; // frame 58 = 1.9333 s
var DB_IN = 0.2, DB_OUT = 1.2, BR_IN = 1.3, BR_OUT = 2.25, LIKE_IN = 2.6, WINK = 3.35, SMILE = 3.9, OUT = 6.2;
var mark, dontB, codeEl, like, corners = [];

SB.ad({
  loop: LOOP,
  thumbAt: 4.3,
  build: function (frame, ctx) {
    var center = SB.el('div', 'mc-center', frame);
    var lock = SB.el('div', 'lock', center);
    mark = SB.mascot(lock, {
      size: 320,
      happy: [[SMILE, 1.7]],
      // one ordinary blink right after DON'T BLINK, then the wink: right eye only, held ~0.36 s
      blinks: [{ t: 0.9 }, { t: WINK, right: true }, { t: WINK + 0.12, right: true }, { t: WINK + 0.24, right: true }, { t: 5.9 }]
    });
    var slot = SB.el('div', 'slot', lock);
    dontB = SB.el('div', 'big', slot);
    dontB.innerHTML = 'DON’T<br><span class="q">BLINK.</span>';
    codeEl = SB.el('div', 'code mc-mono', slot, SB.codes(1, 30)[0]);
    like = SB.el('div', 'big', slot);
    like.innerHTML = 'LIKE IF<br>YOU <span class="q">SAW IT.</span>';
    // viewfinder corners around the code's footprint
    var vf = SB.el('div', 'vf', slot);
    vf.style.left = (codeEl.offsetLeft - 40) + 'px'; vf.style.top = (codeEl.offsetTop - 34) + 'px';
    vf.style.width = (codeEl.offsetWidth + 80) + 'px'; vf.style.height = (codeEl.offsetHeight + 68) + 'px';
    corners = [];
    [['top', 'left'], ['top', 'right'], ['bottom', 'left'], ['bottom', 'right']].forEach(function (k) {
      var c = SB.el('div', 'corner', vf);
      c.style[k[0]] = '0'; c.style[k[1]] = '0';
      c.style['border' + k[0].charAt(0).toUpperCase() + k[0].slice(1) + 'Width'] = '4px';
      c.style['border' + k[1].charAt(0).toUpperCase() + k[1].slice(1) + 'Width'] = '4px';
      corners.push(c);
    });
    var s = Math.min(1.12, ctx.w * 0.88 / (lock.offsetWidth + 100), 1080 * 0.8 / lock.offsetHeight);
    lock.style.transform = 'scale(' + s + ')';
    var slotBox = null;
    mark.look = function (t) {
      if (!slotBox) slotBox = SB.box(codeEl);
      if (t >= BR_IN - 0.1 && t < LIKE_IN - 0.1) return { x: slotBox.x, y: slotBox.y };
      return null;
    };
  },
  frame: function (t) {
    var f = Math.floor(t * 30 + 1e-6);
    // DON'T BLINK.
    var dp = SB.seg(t, DB_IN, DB_IN + 0.34), dout = SB.seg(t, DB_OUT, DB_OUT + 0.2);
    dontB.style.opacity = String((t >= DB_IN ? Math.min(1, dp * 3) : 0) * (1 - dout));
    dontB.style.transform = 'scale(' + (t < DB_IN ? 1.3 : SB.lerp(1.3, 1, SB.backOut(dp))).toFixed(4) + ')';
    // the brackets: the only thing on screen while the slot waits
    var bo = SB.seg(t, BR_IN, BR_IN + 0.25) * (1 - SB.seg(t, BR_OUT, BR_OUT + 0.25));
    for (var i = 0; i < corners.length; i++) corners[i].style.opacity = String(bo);
    // the code: exactly one frame
    codeEl.style.opacity = f === FLASH_F ? '1' : '0';
    // LIKE IF YOU SAW IT.
    var lp = SB.seg(t, LIKE_IN, LIKE_IN + 0.34), lo = 1 - SB.seg(t, OUT, OUT + 0.4);
    like.style.opacity = String((t >= LIKE_IN ? Math.min(1, lp * 3) : 0) * lo);
    like.style.transform = 'scale(' + (t < LIKE_IN ? 1.3 : SB.lerp(1.3, 1, SB.backOut(lp))).toFixed(4) + ')';
  }
});
</script>
</body>
</html>
