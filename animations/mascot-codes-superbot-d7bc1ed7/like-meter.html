<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LIKES UNLOCK CODES · like meter · superbot ad spot</title>
<script src="../../assets/ar.js"></script>
<link rel="stylesheet" href="../../assets/ar.css">
<link rel="stylesheet" href="kit/mascot.css">
<link rel="stylesheet" href="kit/stage.css">
<script src="kit/mascot.js"></script>
<script src="kit/codes.js"></script>
<script src="kit/stage.js"></script>
<style>
  .lock { display: flex; align-items: center; gap: 60px; transform-origin: 50% 50%; white-space: nowrap; }
  .col { display: flex; flex-direction: column; gap: 46px; }
  .label { font-size: 118px; line-height: 0.92; text-transform: uppercase; }
  .q { text-shadow: -2.4px 0 var(--storm-0), 2.4px 0 var(--storm-3); }
  .meter { position: relative; display: flex; align-items: center; gap: 30px; }
  .hwrap { position: relative; width: 96px; height: 96px; flex: none; }
  .hwrap svg { position: absolute; left: 0; top: 0; width: 96px; height: 96px; overflow: visible; }
  .floaty { position: absolute; left: 0; top: 0; width: 96px; height: 96px; overflow: visible; }
  .track { position: relative; width: 780px; height: 112px; border: 4px solid #fff; border-radius: 56px; flex: none; }
  .notch { position: absolute; top: 26px; bottom: 26px; width: 3px; background: rgba(255,255,255,0.16); border-radius: 2px; }
  .fill { position: absolute; left: 8px; top: 8px; right: 8px; bottom: 8px; background: #fff; border-radius: 44px;
    display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .code { font-size: 48px; color: #000; font-weight: 700; letter-spacing: 0.04em; }
  .code span { display: inline-block; }
  .pct { font-size: 78px; width: 230px; text-align: left; font-variant-numeric: tabular-nums; flex: none; }
</style>
</head>
<body>
<script>
/* LIKES UNLOCK CODES, metered: every like is a tick on the bar, the heart fills with it and rings out
   on every tick; the mark's eyes ride the fill edge. At 100% the bar flares in the mark's split, a
   code decodes inside the full bar and the mark smiles, then the bar drains back to zero for the loop. */
var LOOP = 8, N = 22, T0 = 0.55, T1 = 3.75, FULL = T1 + 0.12, CODE_A = FULL + 0.18, CODE_PER = 0.026;
var DRAIN_A = 6.35, DRAIN_B = 7.25;
var ticks = [], mark, track, fill, heartFill, hwrap, pct, codeSpans, code, floaters = [], drift = [], tb = null;
var HEART = 'M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.8 4.5c2.2 0 3.6 1.2 5.2 3.1 1.6-1.9 3-3.1 5.2-3.1 3.8 0 5.9 3.9 4.4 7.3C19.5 16.4 12 21 12 21z';

function hash(a, b) {
  var h = Math.imul(a + 0x9e3779b9, 0x85ebca6b) ^ Math.imul(b + 0x632be5ab, 0xc2b2ae35);
  h ^= h >>> 13; h = Math.imul(h, 0x27d4eb2f); h ^= h >>> 15;
  return h >>> 0;
}
for (var k = 0; k < N; k++) ticks.push(T0 + (T1 - T0) * (1 - Math.pow(1 - (k + 1) / N, 1.55)));

function level(t) {
  if (t >= DRAIN_A) return 1 - SB.easeInOut(SB.seg(t, DRAIN_A, DRAIN_B));
  var L = 0;
  for (var i = 0; i < N; i++) L += SB.easeOut(SB.seg(t, ticks[i], ticks[i] + 0.13)) / N;
  return L;
}
function lastTick(t) { var n = -1; for (var i = 0; i < N; i++) if (t >= ticks[i]) n = i; return n; }

function fitUp(node, maxW, maxH, cap) {
  node.style.transform = '';
  var s = Math.min(cap, maxW / Math.max(1, node.offsetWidth), maxH / Math.max(1, node.offsetHeight));
  node.style.transform = 'scale(' + s + ')';
  return s;
}
SB.ad({
  loop: LOOP,
  thumbAt: 4.9,
  build: function (frame, ctx) {
    var center = SB.el('div', 'mc-center', frame);
    var lock = SB.el('div', 'lock', center);
    var meterParent;
    var label;
    if (!ctx.narrow) {
      mark = SB.mascot(lock, { size: 320, happy: [[FULL + 0.08, 1.9]] });
      var col = SB.el('div', 'col', lock);
      label = SB.el('div', 'label', col);
      label.innerHTML = 'LIKES UNLOCK<br><span class="q">CODES.</span>';
      meterParent = col;
    } else {
      lock.style.flexDirection = 'column';
      lock.style.alignItems = 'flex-start';
      lock.style.gap = '70px';
      var row = SB.el('div', 'lock', lock);
      row.style.gap = '48px';
      mark = SB.mascot(row, { size: 300, happy: [[FULL + 0.08, 1.9]] });
      label = SB.el('div', 'label', row);
      label.innerHTML = 'LIKES<br>UNLOCK<br><span class="q">CODES.</span>';
      meterParent = lock;
    }
    var meter = SB.el('div', 'meter', meterParent);
    hwrap = SB.el('div', 'hwrap', meter);
    hwrap.innerHTML = '<svg viewBox="0 0 24 24"><path d="' + HEART + '" fill="none" stroke="#fff" stroke-width="1.9" stroke-linejoin="round"/></svg>' +
      '<svg viewBox="0 0 24 24" class="hf"><path d="' + HEART + '" fill="#fff"/></svg>';
    heartFill = hwrap.querySelector('.hf');
    var rand = SB.rng(314);
    floaters = []; drift = [];
    for (var i = 0; i < N; i++) {
      var f = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      f.setAttribute('viewBox', '0 0 24 24');
      f.setAttribute('class', 'floaty');
      f.innerHTML = '<path d="' + HEART + '" fill="none" stroke="#fff" stroke-width="1.2" stroke-linejoin="round"/>';
      hwrap.appendChild(f);
      floaters.push(f);
      drift.push({ x: (rand() - 0.5) * 90, r: (rand() - 0.5) * 50, s: 0.45 + rand() * 0.4, up: 170 + rand() * 90 });
    }
    track = SB.el('div', 'track', meter);
    if (ctx.narrow) track.style.width = '560px';
    for (var n = 1; n < 10; n++) {
      var no = SB.el('div', 'notch', track);
      no.style.left = (n * 10) + '%';
    }
    fill = SB.el('div', 'fill', track);
    var cl = SB.el('div', 'code mc-mono', fill);
    if (ctx.narrow) cl.style.fontSize = '34px';
    code = SB.codes(1, 2024)[0];
    codeSpans = Array.prototype.map.call(code, function (ch) { return SB.el('span', '', cl, ch); });
    pct = SB.el('div', 'pct', meter, '0%');
    if (ctx.narrow) { pct.style.fontSize = '64px'; pct.style.width = '170px'; }
    fitUp(lock, ctx.w * 0.88, 1080 * 0.82, 1.15);
    tb = null;
    mark.look = function (t) {
      if (!tb) tb = SB.box(track);
      if (t < T0 - 0.25 || t > DRAIN_B + 0.2) return null;
      var L = level(t);
      if (t > CODE_A && t < DRAIN_A) return { x: tb.x, y: tb.y };
      return { x: tb.left + 12 + L * (tb.width - 24), y: tb.y };
    };
  },
  frame: function (t) {
    var L = level(t);
    fill.style.clipPath = 'inset(0 ' + ((1 - L) * 100).toFixed(3) + '% 0 0 round 44px)';
    pct.textContent = Math.round(L * 100) + '%';

    // heart: fills bottom up with the level, pulses on every tick, and flares at 100%
    heartFill.style.clipPath = 'inset(' + ((1 - (0.12 + L * 0.8)) * 100).toFixed(2) + '% 0 0 0)';
    var lt = lastTick(t), pulse = 0;
    if (lt >= 0 && t < DRAIN_A) {
      var a = t - ticks[lt];
      pulse = a < 0.28 ? Math.pow(1 - a / 0.28, 2) : 0;
    }
    var big = t >= FULL && t < DRAIN_A ? Math.sin(SB.seg(t, FULL, FULL + 0.5) * Math.PI) * 0.35 : 0;
    hwrap.style.transform = 'scale(' + (1 + pulse * 0.22 + big).toFixed(4) + ')';

    for (var i = 0; i < N; i++) {
      var fl = floaters[i], d = drift[i], age = t - ticks[i];
      var dur = i === N - 1 ? 0.8 : 0.5;
      if (age < 0 || age > dur || t >= DRAIN_A) { fl.style.opacity = '0'; continue; }
      var p = age / dur, e = SB.easeOut(p);
      fl.style.opacity = String((1 - p) * 0.7);
      fl.style.transform = 'scale(' + (1 + e * (i === N - 1 ? 1.4 : 0.75)).toFixed(3) + ')';
    }

    // the unlock flare, in the mark's own split
    var fl2 = t >= FULL && t < DRAIN_A ? 1 - SB.easeOut(SB.seg(t, FULL, FULL + 0.6)) : 0;
    var sp = (2 + fl2 * 16).toFixed(1);
    track.style.boxShadow = t >= FULL && t < DRAIN_B ? (-sp + 'px 0 0 0 var(--storm-0), ' + sp + 'px 0 0 0 var(--storm-3)') : 'none';
    track.style.transform = 'scale(' + (1 + fl2 * 0.035).toFixed(4) + ')';
    pct.style.transform = 'scale(' + (1 + fl2 * 0.12).toFixed(4) + ')';
    pct.style.transformOrigin = '0 50%';
    pct.style.textShadow = t >= FULL && t < DRAIN_A ? (-sp * 0.6).toFixed(1) + 'px 0 var(--storm-0), ' + (sp * 0.6).toFixed(1) + 'px 0 var(--storm-3)' : 'none';

    var f = Math.floor(t * 30 + 1e-6), show = t >= CODE_A - 0.12 && t < DRAIN_B;
    for (var k = 0; k < codeSpans.length; k++) {
      var ch = code.charAt(k), done = t >= CODE_A + k * CODE_PER;
      codeSpans[k].style.visibility = show ? 'visible' : 'hidden';
      if (ch === '-') continue;
      codeSpans[k].textContent = done ? ch : SB.ALPHA.charAt(hash(k, f) % SB.ALPHA.length);
      codeSpans[k].style.opacity = done ? '1' : '0.3';
    }
  }
});
</script>
</body>
</html>
