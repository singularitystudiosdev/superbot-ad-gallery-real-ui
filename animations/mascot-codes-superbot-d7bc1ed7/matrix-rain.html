<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CATCH ONE · code rain · superbot ad spot</title>
<script src="../../assets/ar.js"></script>
<link rel="stylesheet" href="../../assets/ar.css">
<link rel="stylesheet" href="kit/mascot.css">
<link rel="stylesheet" href="kit/stage.css">
<script src="kit/mascot.js"></script>
<script src="kit/codes.js"></script>
<script src="kit/stage.js"></script>
<style>
  .rain { position: absolute; left: 0; top: 0; }
  .place { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  .plate { background: #000; padding: 40px 56px 40px 44px; box-shadow: 0 0 44px 26px #000; }
  .col { display: flex; flex-direction: column; align-items: flex-start; }
  .slot { font-size: 52px; margin-top: 30px; color: rgba(255,255,255,0.2); white-space: nowrap; }
  .grab { position: absolute; left: 0; top: 0; font-size: 52px; white-space: nowrap; transform-origin: 50% 50%;
          padding: 6px 18px; background: rgba(0,0,0,0.82); box-shadow: 0 0 36px 26px rgba(0,0,0,0.82); }
  .grab span { display: inline-block; }
</style>
</head>
<body>
<script>
/* CATCH ONE, in the rain: two parallax layers of code glyphs fall on a loop-exact period, one full invite
   code condenses out of the rain in cyan, drifts while the mark's eyes follow it, then drops into the empty
   slot under the headline; the mark smiles at the catch and the code melts back into the rain. */
var L = 8, EMERGE = 0.8, CATCH = 3.85, LAND = 4.5, MELT = 6.75;
var cv, g, R, layers, W, fi = 0;
var mark, plate, slot, grab, chars = [], CODE, fitS = 1, slotB = null, A, B;
var FONT = '"SF Mono", ui-monospace, Menlo, Consolas, monospace';

function rt(i) { return R[i & 65535]; }

function codeAt(t) {
  if (!slotB) slotB = SB.box(slot);
  var S = { x: slotB.x, y: slotB.y };
  if (t < CATCH) {
    var p = SB.seg(t, EMERGE - 0.3, CATCH);
    return { x: SB.lerp(A.x, B.x, p), y: SB.lerp(A.y, B.y, p), s: SB.lerp(0.78, 0.96, p) };
  }
  if (t < LAND) {
    var q = SB.easeInOut(SB.seg(t, CATCH, LAND));
    return { x: SB.lerp(B.x, S.x, q), y: SB.lerp(B.y, S.y, q) - Math.sin(q * Math.PI) * 70, s: SB.lerp(0.96, fitS, q) };
  }
  return { x: S.x, y: S.y, s: fitS };
}

SB.ad({
  loop: L,
  thumbAt: 3.2,
  build: function (frame, ctx) {
    W = ctx.w;
    var rnd = SB.rng(1207);
    R = new Uint16Array(65536);
    for (var i = 0; i < R.length; i++) R[i] = Math.floor(rnd() * 65536);
    cv = SB.el('canvas', 'rain', frame);
    cv.width = W; cv.height = 1080;
    g = cv.getContext('2d');
    // far layer: small, dim, slow; near layer: bigger, brighter, some columns empty for air.
    layers = [
      { font: 16, cw: 21, ch: 21, P: 72, a: 0.5, ks: [1, 1, 2], empty: 0.05, cols: [] },
      { font: 26, cw: 38, ch: 32, P: 48, a: 1, ks: [1, 2, 2, 3], empty: 0.18, cols: [] }
    ];
    layers.forEach(function (Ly, li) {
      Ly.rows = Math.ceil(1080 / Ly.ch) + 1;
      var n = Math.ceil(W / Ly.cw) + 1;
      for (var c = 0; c < n; c++) {
        if (rnd() < Ly.empty) continue;
        var drops = [], nd = rnd() < 0.35 ? 1 : 2;
        for (var d = 0; d < nd; d++) drops.push({ h0: Math.floor(d * Ly.P / 2 + rnd() * Ly.P / 2), len: 9 + Math.floor(rnd() * (li ? 14 : 22)) });
        Ly.cols.push({ id: c + li * 997, x: c * Ly.cw + (li ? Ly.cw * 0.5 : 0), k: Ly.ks[Math.floor(rnd() * Ly.ks.length)],
          a: Ly.a * (0.55 + rnd() * 0.45), drops: drops });
      }
    });

    var place = SB.el('div', 'place', frame);
    plate = SB.el('div', 'mc-lockup plate', place);
    mark = SB.mascot(plate, { size: 290, blinks: [{ t: 0.35 }, { t: 2.3, right: true }, { t: 6.4 }, { t: 7.55 }],
      happy: [[LAND + 0.04, 1.7]] });
    var col = SB.el('div', 'col', plate);
    var hl = SB.el('div', 'mc-type', col);
    hl.style.fontSize = ctx.narrow ? '176px' : '168px';
    hl.innerHTML = ctx.narrow ? 'CATCH<br>ONE.' : 'CATCH ONE.';
    CODE = SB.codes(1, 71)[0];
    slot = SB.el('div', 'mc-mono slot', col, 'XXXXXXXXXXXXXXXX');
    place.style.paddingTop = ctx.narrow ? '250px' : '220px';
    fitS = SB.fit(plate, ctx.w * (ctx.narrow ? 0.9 : 0.84), 700);

    grab = SB.el('div', 'mc-mono grab', frame);
    chars = SB.letters(grab, CODE);
    slotB = null;
    A = ctx.narrow ? { x: W * 0.46, y: 170 } : { x: W * 0.62, y: 170 };
    B = ctx.narrow ? { x: W * 0.56, y: 250 } : { x: W * 0.69, y: 262 };
    mark.look = function (t) {
      if (t < EMERGE - 0.1 || t > MELT + 0.2) return null;
      return codeAt(t);
    };
  },
  frame: function (t, ctx) {
    fi = Math.round(t * 30);
    var ep = Math.floor(t * 6);
    g.fillStyle = '#000';
    g.fillRect(0, 0, W, 1080);
    g.textAlign = 'center';
    g.textBaseline = 'top';
    for (var li = 0; li < layers.length; li++) {
      var Ly = layers[li];
      g.font = '600 ' + Ly.font + 'px ' + FONT;
      for (var ci = 0; ci < Ly.cols.length; ci++) {
        var c = Ly.cols[ci];
        for (var di = 0; di < c.drops.length; di++) {
          var d = c.drops[di];
          var head = Math.floor((d.h0 + c.k * Ly.P * t / L) % Ly.P);
          for (var j = 0; j < d.len; j++) {
            var r = ((head - j) % Ly.P + Ly.P) % Ly.P;
            if (r >= Ly.rows) continue;
            var ch, a = c.a * Math.pow(1 - j / d.len, 1.4);
            if (j === 0) {
              ch = SB.ALPHA[rt(c.id * 31 + r * 7 + fi * 131) & 31];
              g.fillStyle = 'rgba(255,255,255,' + Math.min(1, c.a + 0.25).toFixed(2) + ')';
            } else {
              var e = (ep + (rt(c.id * 13 + r * 101) & 7)) % (L * 6);
              ch = SB.ALPHA[rt(c.id * 131 + r * 977 + e * 7919) & 31];
              g.fillStyle = j === 1 && li === 1 ? 'rgba(0,229,195,' + (a * 0.95).toFixed(2) + ')'
                : 'rgba(236,236,236,' + (a * 0.72).toFixed(3) + ')';
            }
            g.fillText(ch, c.x, r * Ly.ch);
          }
        }
      }
    }

    // the caught code
    var P = codeAt(t);
    var vis = SB.seg(t, EMERGE - 0.35, EMERGE + 0.1) * (1 - SB.seg(t, MELT + 0.55, MELT + 0.85));
    grab.style.opacity = String(vis);
    grab.style.transform = 'translate(' + P.x.toFixed(1) + 'px,' + P.y.toFixed(1) + 'px) translate(-50%,-50%) scale(' + P.s.toFixed(4) + ')';
    var landed = SB.seg(t, LAND - 0.05, LAND + 0.5);
    grab.style.background = 'rgba(0,0,0,' + (0.82 * (1 - landed)).toFixed(3) + ')';
    grab.style.boxShadow = '0 0 36px 26px rgba(0,0,0,' + (0.82 * (1 - landed)).toFixed(3) + ')';
    // All 16 glyphs hold their places the whole time the code is on screen, so it never reads short:
    // a glyph not yet locked (or already melting) is a dim scrambled rain character.
    var first = EMERGE - 0.3, last = MELT + (chars.length - 1) * 0.03 + 0.25;
    for (var i = 0; i < chars.length; i++) {
      var on = EMERGE + i * 0.055, off = MELT + (chars.length - 1 - i) * 0.03;
      var s = chars[i];
      if (t < first || t >= last) { s.style.visibility = 'hidden'; continue; }
      s.style.visibility = 'visible';
      var scram = t < on || t >= off;
      s.textContent = scram ? SB.ALPHA[rt(i * 577 + fi * 37) & 31] : CODE[i];
      if (scram) {
        var ramp = t < on ? SB.seg(t, first, on) : 1 - SB.seg(t, off, last);
        s.style.color = 'rgba(0,229,195,' + (0.16 + 0.39 * ramp).toFixed(3) + ')';
        s.style.textShadow = 'none';
      } else {
        var glow = 1 - landed * 0.7;
        s.style.color = landed > 0.5 ? '#fff' : '#dffcf7';
        s.style.textShadow = '0 0 ' + (14 * glow).toFixed(1) + 'px rgba(0,229,195,' + (0.95 * glow).toFixed(2) + '), -2px 0 rgba(0,229,195,0.7), 2px 0 rgba(192,38,211,0.7)';
      }
    }
    slot.style.opacity = String(1 - SB.seg(t, LAND - 0.1, LAND + 0.1) + SB.seg(t, MELT + 0.6, MELT + 0.9));
  }
});
</script>
</body>
</html>
