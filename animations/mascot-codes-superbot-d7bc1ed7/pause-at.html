<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PAUSE AT 0:03 · a timecode that tells the truth · superbot ad spot</title>
<script src="../../assets/ar.js"></script>
<link rel="stylesheet" href="../../assets/ar.css">
<link rel="stylesheet" href="kit/mascot.css">
<link rel="stylesheet" href="kit/stage.css">
<script src="kit/mascot.js"></script>
<script src="kit/codes.js"></script>
<script src="kit/stage.js"></script>
<style>
  .wall { position: absolute; inset: 0; background: #000; }
  .wall-grid { position: absolute; display: grid; justify-content: space-between; align-items: center; color: #fff; }
  .wall-grid > div { white-space: nowrap; text-align: center; }
  .wall-grid .d { opacity: 0.42; }
  .slot { position: relative; }
  .it { position: absolute; left: 0; top: 50%; transform: translateY(-50%); }
  .cap { font-size: 86px; letter-spacing: 0.05em; display: block; margin-bottom: 18px; margin-left: 0.04em; }
  .tc { font-size: 340px; line-height: 0.86; display: block; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
  .big { font-size: 250px; line-height: 0.9; transform-origin: 0% 60%; }
  .cap .hl { display: inline-block; }
</style>
</head>
<body>
<script>
/* The timecode is the ad's own clock: it reads 0:00.0 on frame 0 and counts in real tenths.
   PAUSE AT 0:03, it says, and at exactly 3.0 s (frames 90 to 92) the screen is 100 codes, stamped
   0:03.0 in the corner. The clock keeps running, then the mark asks DID YOU? with a grin. */
var FPS = 30, LOOP = 6;
var FLASH = 90, END = 3.6, OUT = 5.4;
var lockHold, textA, cap, hl, tc, textB, wall, mark, boxes;

function fi(t) { return Math.floor(t * FPS + 1e-4); }
function flashOn(t, k) { var f = fi(t); return f >= k && f < k + 3; }
function split(node, px) { node.style.textShadow = (-px).toFixed(2) + 'px 0 var(--storm-0), ' + px.toFixed(2) + 'px 0 var(--storm-3)'; }

// 100 codes laid out edge to edge: pick the column count that gives the biggest legible type.
function codeWall(parent, ctx, list, opts) {
  opts = opts || {};
  var W = ctx.w, H = 1080, n = list.length;
  var pad = Math.round(Math.min(W, H) * (opts.padK || 0.045)), top = opts.label ? 84 : 0;
  var aw = W - 2 * pad, ah = H - 2 * pad - top, GAP = 1.2, LH = 1.28, CH = 10.0, best = null;
  for (var c = 1; c <= 8; c++) {
    var r = Math.ceil(n / c);
    var f = Math.min(aw / (c * CH + (c - 1) * GAP), ah / (r * LH), opts.maxFont || 999);
    var score = f * (n % c === 0 ? 1.12 : 1);
    if (!best || score > best.score) best = { c: c, r: r, f: f, score: score };
  }
  var wallEl = SB.el('div', 'wall', parent);
  var grid = SB.el('div', 'wall-grid mc-mono', wallEl);
  grid.style.left = pad + 'px'; grid.style.top = (pad + top) + 'px';
  grid.style.width = aw + 'px'; grid.style.height = ah + 'px';
  grid.style.gridTemplateColumns = 'repeat(' + best.c + ', auto)';
  grid.style.gridTemplateRows = 'repeat(' + best.r + ', 1fr)';
  grid.style.fontSize = best.f + 'px';
  list.forEach(function (code) {
    var cell = SB.el('div', '', grid);
    code.split('-').forEach(function (part, i) {
      if (i) SB.el('span', 'd', cell, '-');
      SB.el('span', '', cell, part);
    });
  });
  if (n % best.c) { grid.lastChild.style.gridColumn = '1 / -1'; }
  if (best.c === 1) grid.style.justifyContent = 'center';
  var cw = grid.firstChild.offsetWidth, need = cw * best.c + GAP * best.f * (best.c - 1);
  if (need > aw) grid.style.fontSize = (best.f * aw / need * 0.99) + 'px';
  if (best.f >= 24) split(grid, 1);
  var label = null;
  if (opts.label) {
    label = SB.el('div', 'mc-mono mc-cyan', wallEl, opts.label);
    var lx = best.c === 1 ? pad + (aw - grid.firstChild.offsetWidth) / 2 : pad;
    label.style.cssText += 'position:absolute;left:' + lx + 'px;top:' + pad + 'px;font-size:40px;';
  }
  return { el: wallEl, label: label };
}

// A hit: scale from `from` to 1 with a little overshoot, over dur seconds from `at`.
function hit(t, at, from, dur) { return SB.lerp(from, 1, SB.backOut(SB.seg(t, at, at + (dur || 0.3)))); }
// A slot holds absolutely placed copy that swaps on cuts; size it to its biggest child so the lockup never shifts.
function sizeSlot(slot) {
  var w = 0, h = 0;
  for (var i = 0; i < slot.children.length; i++) { w = Math.max(w, slot.children[i].offsetWidth); h = Math.max(h, slot.children[i].offsetHeight); }
  slot.style.width = w + 'px'; slot.style.height = h + 'px';
  return { w: w, h: h };
}
function show(node, on) { node.style.visibility = on ? 'visible' : 'hidden'; }


function stamp(t) {
  var d = Math.floor(t * 10 + 1e-6), s = Math.floor(d / 10), m = Math.floor(s / 60);
  return m + ':' + ('0' + (s % 60)).slice(-2) + '.' + (d % 10);
}

SB.ad({
  loop: LOOP,
  thumbAt: 2.9,
  build: function (frame, ctx) {
    boxes = null;
    var c = SB.el('div', 'mc-center', frame);
    lockHold = SB.el('div', '', c);
    var lock = SB.el('div', 'mc-lockup', lockHold);
    lock.style.gap = (ctx.narrow ? 44 : 76) + 'px';
    var markBox = SB.el('div', '', lock);
    mark = SB.mascot(markBox, {
      size: 440,
      blinks: [{ t: 1.35 }, { t: 5.2, right: true }],
      happy: [[3.86, 1.3]],
      look: function (t) {
        if (!boxes) boxes = { tc: SB.box(tc), cap: SB.box(hl) };
        if (t >= 0.25 && t < 0.9) return { x: boxes.cap.x, y: boxes.cap.y };
        if (t >= 0.9 && t < FLASH / FPS) return { x: boxes.tc.right - boxes.tc.width * 0.12, y: boxes.tc.y };
        return null;
      }
    });
    var slot = SB.el('div', 'slot', lock);
    textA = SB.el('div', 'mc-type it', slot);
    cap = SB.el('span', 'mc-type cap', textA, 'PAUSE AT ');
    hl = SB.el('span', 'hl', cap, '0:03');
    tc = SB.el('span', 'mc-type tc', textA, '0:00.0');
    textB = SB.el('div', 'mc-type it big', slot);
    textB.innerHTML = ctx.narrow ? 'DID<br>YOU?' : 'DID YOU?';
    sizeSlot(slot);
    SB.fit(lock, ctx.w * 0.86, 1080 * 0.66);
    wall = codeWall(frame, ctx, SB.codes(100, 606), { label: '0:03.0' });
  },
  frame: function (t) {
    var f = fi(t), fl = flashOn(t, FLASH);
    var sceneA = t < END && !fl, sceneB = t >= END && t < OUT + 0.4;
    var pout = SB.easeInOut(SB.seg(t, OUT, OUT + 0.4));
    show(lockHold, sceneA || sceneB);
    show(wall.el, fl);
    wall.label.textContent = stamp(t);
    lockHold.style.opacity = String(SB.seg(t, 0, 0.12) * (1 - pout));
    lockHold.style.transform = 'scale(' + SB.lerp(1, 0.95, pout).toFixed(4) + ')';
    show(textA, sceneA); show(textB, sceneB);

    tc.textContent = stamp(t);
    // Tension: the split on the clock and on 0:03 widens as the moment closes in.
    var near = t < FLASH / FPS ? Math.pow(SB.seg(t, 1.8, FLASH / FPS), 2) : 0;
    split(tc, 3 + 9 * near);
    split(cap, 2);
    var tick = t >= 2 && t < FLASH / FPS ? 1 - SB.seg((t - 2) % 0.5, 0, 0.18) : 0;
    split(hl, 2 + 8 * near * tick);
    hl.style.color = t >= 2 && t < FLASH / FPS && tick > 0.5 ? 'var(--storm-0)' : '#fff';
    // After the flash the clock simply ticks on, honest to the end.

    textB.style.transform = 'translateY(-50%) scale(' + hit(t, END, 1.2, 0.32).toFixed(4) + ')';
    split(textB, SB.lerp(24, 3, SB.easeOut(SB.seg(t, END, END + 0.3))));
  }
});
</script>
</body>
</html>
