<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TAG A FRIEND · two for one · superbot ad spot</title>
<script src="../../assets/ar.js"></script>
<link rel="stylesheet" href="../../assets/ar.css">
<link rel="stylesheet" href="kit/mascot.css">
<link rel="stylesheet" href="kit/stage.css">
<script src="kit/mascot.js"></script>
<script src="kit/codes.js"></script>
<script src="kit/stage.js"></script>
<style>
  .abs { position: absolute; left: 0; top: 0; }
  .holder { position: absolute; transform-origin: 50% 100%; }
  .copy { position: absolute; display: grid; transform-origin: 0 50%; white-space: nowrap; }
  .line { grid-area: 1 / 1; font-size: 156px; line-height: 0.92; text-transform: uppercase; }
  .q { text-shadow: -2.4px 0 var(--storm-0), 2.4px 0 var(--storm-3); }
  .at { position: absolute; left: 0; top: 0; font-size: 170px; line-height: 1; font-weight: 900; transform-origin: 50% 50%; }
  .at.ghost { font-size: 170px; }
  .tag { position: absolute; left: 0; top: 0; padding: 12px 30px 14px; border: 3px solid #fff; border-radius: 999px;
    font-size: 40px; font-weight: 800; letter-spacing: 0; background: #000; white-space: nowrap; }
  .chip { position: absolute; left: 0; top: 0; padding: 12px 24px; border: 2px solid rgba(255,255,255,0.35); border-radius: 16px;
    font-size: 28px; color: #fff; white-space: nowrap; background: #0c0c0c; }
  .chip span { display: inline-block; }
</style>
</head>
<body>
<script>
/* TAG A FRIEND, delivered: the big mark reads the line, eyes its friend (who is busy looking elsewhere),
   and throws an @ across the frame. It lands, spins into an @bestie tag, the friend jolts and turns to
   look at the big one, they smile together and the copy pays off: YOU BOTH GET ONE, a code under each. */
var LOOP = 8;
var COPY_IN = 0.2, AIM = 1.05, LAUNCH = 1.6, LAND = 2.45, TURN = 2.75, SMILE = 3.25, SWAP = 3.3, CHIP_A = 3.75, OUT = 6.9;
var big, fr, bigH, frH, copy, tagL, endL, atEl, ghosts = [], tagEl, chips = [], codes, codeSpans = [], L;

function hash(a, b) {
  var h = Math.imul(a + 0x9e3779b9, 0x85ebca6b) ^ Math.imul(b + 0x632be5ab, 0xc2b2ae35);
  h ^= h >>> 13; h = Math.imul(h, 0x27d4eb2f); h ^= h >>> 15;
  return h >>> 0;
}
function bez(p0, c, p1, u) {
  var a = (1 - u) * (1 - u), b = 2 * (1 - u) * u, d = u * u;
  return { x: a * p0.x + b * c.x + d * p1.x, y: a * p0.y + b * c.y + d * p1.y };
}
function flightU(t) { return SB.easeInOut(SB.seg(t, LAUNCH, LAND)); }

SB.ad({
  loop: LOOP,
  thumbAt: 4.8,
  build: function (frame, ctx) {
    var W = ctx.w, nar = ctx.narrow;
    L = {};
    if (!nar) {
      L.bs = W >= 1800 ? 340 : 290; L.fs = W >= 1800 ? 250 : 210;
      L.b = { x: W * 0.06 + L.bs / 2, y: 580 };
      L.f = { x: W - W * 0.07 - L.fs / 2, y: 720 };
      L.copyX = L.b.x + L.bs / 2 + 64; L.copyY = 570; L.copyW = L.f.x - L.fs / 2 - 120 - L.copyX; L.copyH = 330;
    } else {
      L.bs = 240; L.fs = 190;
      L.b = { x: W * 0.07 + L.bs / 2, y: 330 };
      L.f = { x: W - W * 0.1 - L.fs / 2, y: 790 };
      L.copyX = L.b.x + L.bs / 2 + 44; L.copyY = 330; L.copyW = W * 0.94 - L.copyX; L.copyH = 260;
    }
    bigH = SB.el('div', 'holder', frame);
    big = SB.mascot(bigH, { size: L.bs, happy: [[SMILE, 1.9]], seed: 3 });
    frH = SB.el('div', 'holder', frame);
    fr = SB.mascot(frH, { size: L.fs, happy: [[SMILE, 1.9]], seed: 11, phase: 0.45 });
    [[bigH, L.b, L.bs], [frH, L.f, L.fs]].forEach(function (a) {
      a[0].style.left = (a[1].x - a[2] / 2) + 'px';
      a[0].style.top = (a[1].y - a[2] / 2) + 'px';
    });

    copy = SB.el('div', 'copy', frame);
    tagL = SB.el('div', 'line', copy);
    tagL.innerHTML = 'TAG A<br><span class="q">FRIEND.</span>';
    endL = SB.el('div', 'line', copy);
    endL.innerHTML = 'YOU BOTH<br><span class="q">GET ONE.</span>';
    var cs = Math.min(1, L.copyW / copy.offsetWidth, L.copyH / copy.offsetHeight);
    L.cs = cs;
    copy.style.left = L.copyX + 'px';
    copy.style.top = (L.copyY - copy.offsetHeight / 2) + 'px';

    // the @, its motion trail, and the name tag it becomes
    for (var g = 0; g < 4; g++) {
      var gh = SB.el('div', 'at ghost', frame, '@');
      gh.style.color = g % 2 ? 'var(--storm-3)' : 'var(--storm-0)';
      ghosts.push(gh);
    }
    atEl = SB.el('div', 'at q', frame, '@');
    L.atW = atEl.offsetWidth; L.atH = atEl.offsetHeight;
    tagEl = SB.el('div', 'tag', frame, '@bestie');
    L.tagW = tagEl.offsetWidth; L.tagH = tagEl.offsetHeight;
    L.tag = { x: L.f.x, y: L.f.y - L.fs / 2 - 20 - L.tagH / 2 };
    L.p0 = { x: L.b.x + L.bs * 0.42, y: L.b.y - L.bs * 0.1 };
    L.p1 = { x: L.tag.x, y: L.tag.y };
    L.c = nar ? { x: L.p0.x + 40, y: L.p1.y + 200 } : { x: (L.p0.x + L.p1.x) / 2, y: -40 };

    // one code under each mark
    codes = SB.codes(2, 58);
    [[L.b, L.bs], [L.f, L.fs]].forEach(function (a, i) {
      var c = SB.el('div', 'chip mc-mono', frame);
      c.style.fontSize = nar ? '22px' : (W >= 1800 ? '34px' : '28px');
      codeSpans[i] = Array.prototype.map.call(codes[i], function (ch) { return SB.el('span', '', c, ch); });
      var w = c.offsetWidth, h = c.offsetHeight;
      var cx = Math.max(w / 2 + W * 0.03, Math.min(W - W * 0.03 - w / 2, a[0].x));
      chips.push({ el: c, x: cx - w / 2, y: a[0].y + a[1] / 2 + 34, w: w, h: h });
    });

    var fb = null, bb = null;
    big.look = function (t) {
      if (!fb) fb = SB.box(frH);
      if (t < AIM) return null;
      if (t < LAUNCH) return { x: fb.x, y: fb.y };
      if (t < LAND + 0.3) { var p = bez(L.p0, L.c, L.p1, flightU(t)); return p; }
      if (t < SMILE + 0.2) return { x: fb.x, y: fb.y };
      return null;
    };
    fr.look = function (t) {
      if (!bb) bb = SB.box(bigH);
      if (t >= TURN && t < OUT + 0.3) return { x: bb.x, y: bb.y };
      // busy looking the other way, up at nothing in particular
      return { x: L.f.x + 900, y: L.f.y - 700 };
    };
  },
  frame: function (t) {
    var W = 0;
    // copy: wipe in, swap, fade out
    var wi = SB.easeOut(SB.seg(t, COPY_IN, COPY_IN + 0.5));
    var so = SB.easeInOut(SB.seg(t, SWAP - 0.15, SWAP + 0.12));
    tagL.style.clipPath = 'inset(-12% ' + (100 - wi * 100).toFixed(2) + '% -12% 0)';
    tagL.style.opacity = String(1 - so);
    tagL.style.transform = 'translateY(' + (-so * 40).toFixed(1) + 'px)';
    var sp = SB.seg(t, SWAP + 0.05, SWAP + 0.4);
    var fo = 1 - SB.seg(t, OUT, OUT + 0.4);
    endL.style.opacity = String((t >= SWAP + 0.05 ? Math.min(1, sp * 3) : 0) * fo);
    endL.style.transform = 'scale(' + (t < SWAP + 0.05 ? 1.25 : SB.lerp(1.25, 1, SB.backOut(sp))).toFixed(4) + ')';
    endL.style.transformOrigin = '0 50%';
    copy.style.transform = 'scale(' + L.cs.toFixed(4) + ')';

    // big mark winds up before the throw
    var wind = Math.sin(SB.seg(t, LAUNCH - 0.3, LAUNCH + 0.12) * Math.PI);
    var hopB = Math.sin(SB.seg(t, SMILE, SMILE + 0.45) * Math.PI);
    bigH.style.transform = 'rotate(' + (-wind * 6).toFixed(2) + 'deg) translateY(' + (-hopB * 26).toFixed(1) + 'px)';

    // friend: jolts when tagged (damped squash), hops on the shared smile
    var j = t - LAND, sq = 0;
    if (j > 0 && j < 0.9) sq = Math.exp(-j * 6) * Math.cos(j * 26);
    var hopF = Math.sin(SB.seg(t, SMILE + 0.06, SMILE + 0.51) * Math.PI);
    frH.style.transform = 'translateY(' + (-hopF * 30).toFixed(1) + 'px) scale(' + (1 + sq * 0.1).toFixed(4) + ',' + (1 - sq * 0.12).toFixed(4) + ')';

    // the @ in flight, spinning, with a split-color trail
    var fly = t >= LAUNCH && t < LAND + 0.12;
    var u = flightU(t);
    function placeAt(el, uu, op, sc) {
      var p = bez(L.p0, L.c, L.p1, uu);
      el.style.opacity = String(op);
      el.style.transform = 'translate(' + (p.x - L.atW / 2).toFixed(1) + 'px,' + (p.y - L.atH / 2).toFixed(1) + 'px) rotate(' + (uu * 720).toFixed(1) + 'deg) scale(' + sc.toFixed(3) + ')';
    }
    if (fly) {
      var sc = SB.lerp(0.5, 1.0, Math.sin(Math.min(1, u) * Math.PI) * 0.6 + u * 0.4);
      var land = SB.seg(t, LAND, LAND + 0.12);
      placeAt(atEl, u, 1 - land, sc * (1 - land * 0.5));
      for (var g = 0; g < ghosts.length; g++) {
        var ug = flightU(t - (g + 1) * 0.035);
        placeAt(ghosts[g], ug, (t - (g + 1) * 0.035 >= LAUNCH && u < 1 ? 0.75 / (g + 1) : 0), sc * 0.95);
      }
    } else {
      atEl.style.opacity = '0';
      for (var g2 = 0; g2 < ghosts.length; g2++) ghosts[g2].style.opacity = '0';
    }

    // the tag pops where the @ landed and stays until the fade
    var tp = SB.seg(t, LAND, LAND + 0.4);
    var tOut = 1 - SB.seg(t, OUT, OUT + 0.4);
    tagEl.style.opacity = String((t >= LAND ? Math.min(1, tp * 4) : 0) * tOut);
    tagEl.style.transform = 'translate(' + (L.tag.x - L.tagW / 2).toFixed(1) + 'px,' + (L.tag.y - L.tagH / 2 - hopF * 30).toFixed(1) + 'px) scale(' + (t < LAND ? 0 : SB.backOut(tp)).toFixed(4) + ') rotate(' + ((1 - SB.easeOut(tp)) * -14).toFixed(2) + 'deg)';

    // codes: pop and decode under both marks
    var f = Math.floor(t * 30 + 1e-6);
    chips.forEach(function (c, i) {
      var a = CHIP_A + i * 0.16, p = SB.seg(t, a, a + 0.4);
      var hop = i === 0 ? hopB * 26 : hopF * 30;
      c.el.style.opacity = String((t >= a ? Math.min(1, p * 3) : 0) * fo);
      c.el.style.transform = 'translate(' + c.x.toFixed(1) + 'px,' + (c.y + (1 - SB.easeOut(p)) * 30).toFixed(1) + 'px) scale(' + SB.lerp(0.85, 1, SB.backOut(p)).toFixed(4) + ')';
      var spans = codeSpans[i], code = codes[i];
      for (var k = 0; k < spans.length; k++) {
        var ch = code.charAt(k);
        if (ch === '-') continue;
        var done = t >= a + 0.1 + k * 0.022;
        spans[k].textContent = done ? ch : SB.ALPHA.charAt(hash(k + i * 40, f) % SB.ALPHA.length);
        spans[k].style.opacity = done ? '1' : '0.35';
      }
    });
  }
});
</script>
</body>
</html>
