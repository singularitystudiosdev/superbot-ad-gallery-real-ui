<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FREE TOKENS · ticker · superbot ad spot</title>
<script src="../../assets/ar.js"></script>
<link rel="stylesheet" href="../../assets/ar.css">
<link rel="stylesheet" href="kit/mascot.css">
<link rel="stylesheet" href="kit/stage.css">
<script src="kit/mascot.js"></script>
<script src="kit/codes.js"></script>
<script src="kit/stage.js"></script>
<style>
  .band { position: absolute; left: 0; right: 0; overflow: hidden;
          border-top: 1px solid rgba(255,255,255,0.1); border-bottom: 1px solid rgba(255,255,255,0.1);
          -webkit-mask-image: linear-gradient(90deg, transparent 0%, #000 14%, #000 86%, transparent 100%);
                  mask-image: linear-gradient(90deg, transparent 0%, #000 14%, #000 86%, transparent 100%); }
  .band + .band { border-top: 0; }
  .strip { position: absolute; left: 0; top: 0; height: 100%; white-space: nowrap; will-change: transform; }
  .cell { display: inline-block; position: relative; height: 100%; vertical-align: top; }
  .cell b { position: absolute; left: 0; top: 50%; transform: translateY(-50%); font-weight: 600; letter-spacing: 0.04em; }
  .cell i { position: absolute; right: 1.05em; top: 50%; width: 0.24em; height: 0.24em; margin-top: -0.12em;
            background: rgba(255,255,255,0.28); }
  .lock { position: absolute; left: 0; right: 0; top: 0; bottom: 0; display: flex; align-items: center; justify-content: center; }
</style>
</head>
<body>
<script>
/* FREE TOKENS, broadcast ticker: four hairline bands of invite codes marquee in alternating directions,
   each band's period divides the loop so the wrap is invisible. Twice per loop a code lights cyan as it
   passes the mark, which clocks it, follows it and smiles. */
var L = 8, rows, W, mark;
var SPOTS = [
  { row: 1, t0: 1.9, half: 0.95, fx: 0.38 },
  { row: 2, t0: 5.5, half: 0.95, fx: 0.40 }
];

function rowTx(R, t) {
  var u = ((t / L) * R.n) % 1;
  var off = u * R.S;
  return R.dir < 0 ? -off : off - R.S;
}
function spotX(sp, t) {
  var R = rows[sp.row];
  if (sp.c0 == null) {
    // lock onto the real cell nearest the aim point at t0, then ride with the band
    var tx0 = rowTx(R, sp.t0);
    var j0 = Math.round((sp.fx * W - tx0 - R.cw * 0.42) / R.cw);
    sp.c0 = tx0 + j0 * R.cw + R.cw * 0.42;
  }
  return sp.c0 + R.dir * R.n * R.S / L * (t - sp.t0);
}
function spotAmt(sp, t) {
  var d = Math.abs(t - sp.t0) / sp.half;
  return d >= 1 ? 0 : SB.easeInOut(Math.min(1, (1 - d) * 2.2));
}

SB.ad({
  loop: L,
  thumbAt: 1.9,
  build: function (frame, ctx) {
    W = ctx.w;
    var n = ctx.narrow;
    SPOTS.forEach(function (sp) { sp.c0 = null; sp.fx = n ? 0.56 : 0.46; });
    var defs = n ? [
      { font: 22, y: 170, M: 3, n: 1, dir: -1, a: 0.3, seed: 11 },
      { font: 30, y: 212, M: 2, n: 2, dir: 1, a: 0.46, seed: 12 },
      { font: 30, y: 812, M: 2, n: 1, dir: -1, a: 0.46, seed: 13 },
      { font: 22, y: 869, M: 4, n: 2, dir: 1, a: 0.3, seed: 14 }
    ] : [
      { font: 26, y: 168, M: 3, n: 1, dir: -1, a: 0.3, seed: 11 },
      { font: 36, y: 217, M: 3, n: 2, dir: 1, a: 0.46, seed: 12 },
      { font: 36, y: 795, M: 3, n: 1, dir: -1, a: 0.46, seed: 13 },
      { font: 26, y: 863, M: 4, n: 2, dir: 1, a: 0.3, seed: 14 }
    ];
    rows = defs.map(function (d) {
      var h = Math.round(d.font * 1.9);
      var band = SB.el('div', 'band', frame);
      band.style.top = d.y + 'px';
      band.style.height = h + 'px';
      band.style.fontSize = d.font + 'px';
      var strip = SB.el('div', 'mc-mono strip', band);
      var cw = Math.round(d.font * 14.6);
      var S = cw * d.M;
      var codes = SB.codes(d.M, d.seed);
      var count = d.M * (Math.ceil(W / S) + 2);
      var cells = [];
      for (var j = 0; j < count; j++) {
        var c = SB.el('span', 'cell', strip);
        c.style.width = cw + 'px';
        var b = SB.el('b', null, c, codes[j % d.M]);
        b.style.color = 'rgba(236,236,236,' + d.a + ')';
        SB.el('i', null, c);
        cells.push({ el: c, b: b, lit: 0 });
      }
      return { band: band, strip: strip, cw: cw, S: S, n: d.n, dir: d.dir, a: d.a, cells: cells, y: d.y, h: h };
    });

    var lock = SB.el('div', 'lock', frame);
    var row = SB.el('div', 'mc-lockup', lock);
    mark = SB.mascot(row, {
      size: 300,
      blinks: [{ t: 0.7 }, { t: 4.3 }, { t: 7.1, right: true }],
      happy: [[2.75, 1.25], [6.35, 0.95]],
      look: function (t) {
        for (var s = 0; s < SPOTS.length; s++) {
          var sp = SPOTS[s];
          if (Math.abs(t - sp.t0) < sp.half * 0.9) {
            var R = rows[sp.row];
            return { x: spotX(sp, t), y: R.y + R.h / 2 };
          }
        }
        return null;
      }
    });
    var hl = SB.el('div', 'mc-type', row);
    hl.style.fontSize = n ? '196px' : '178px';
    hl.innerHTML = n ? 'FREE<br>TOKENS' : 'FREE TOKENS';
    SB.fit(row, W * (n ? 0.86 : 0.84), n ? 520 : 440);
  },
  frame: function (t) {
    for (var r = 0; r < rows.length; r++) {
      var R = rows[r];
      var tx = rowTx(R, t);
      R.strip.style.transform = 'translateX(' + tx.toFixed(2) + 'px)';
      var hot = -1, amt = 0;
      for (var s = 0; s < SPOTS.length; s++) {
        var sp = SPOTS[s];
        if (sp.row !== r) continue;
        var a = spotAmt(sp, t);
        if (a > 0) { amt = a; hot = Math.round((spotX(sp, t) - tx - R.cw * 0.42) / R.cw); }
      }
      for (var j = 0; j < R.cells.length; j++) {
        var C = R.cells[j];
        var want = j === hot ? amt : 0;
        if (want === C.lit) continue;
        C.lit = want;
        if (want > 0) {
          var al = R.a + (1 - R.a) * want;
          C.b.style.color = 'rgba(' + Math.round(236 - 236 * want * 0.2) + ',' + Math.round(236 - 7 * want) + ',' + Math.round(236 - 41 * want) + ',' + al.toFixed(3) + ')';
          C.b.style.textShadow = '0 0 ' + (18 * want).toFixed(1) + 'px rgba(0,229,195,' + (0.7 * want).toFixed(2) + ')';
        } else {
          C.b.style.color = 'rgba(236,236,236,' + R.a + ')';
          C.b.style.textShadow = 'none';
        }
      }
    }
  }
});
</script>
</body>
</html>
