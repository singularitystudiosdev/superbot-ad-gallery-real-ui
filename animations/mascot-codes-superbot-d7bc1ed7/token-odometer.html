<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FREE TOKENS · 1,000,000 odometer · superbot ad spot</title>
<script src="../../assets/ar.js"></script>
<link rel="stylesheet" href="../../assets/ar.css">
<link rel="stylesheet" href="kit/mascot.css">
<link rel="stylesheet" href="kit/stage.css">
<script src="kit/mascot.js"></script>
<script src="kit/codes.js"></script>
<script src="kit/stage.js"></script>
<style>
  .od-col { display: flex; flex-direction: column; align-items: flex-start; }
  .od-label { font-size: 0.44em; line-height: 0.95; letter-spacing: -0.01em; margin: 0 0 -0.02em 0.04em; white-space: nowrap; }
  .od-num { display: flex; align-items: flex-start; font-variant-numeric: tabular-nums; line-height: 1.3; }
  .wheel {
    display: block; position: relative; height: 1.3em; overflow: hidden;
    -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 20%, #000 80%, transparent 100%);
            mask-image: linear-gradient(to bottom, transparent 0, #000 20%, #000 80%, transparent 100%);
  }
  .strip { display: block; will-change: transform; }
  .strip span { display: block; height: 1.3em; line-height: 1.3em; text-align: center; }
  .comma { display: block; height: 1.3em; line-height: 1.3em; width: 0.26em; text-align: left; }
  .od-rule { height: 6px; width: 100%; margin-top: -0.12em; background: linear-gradient(90deg, var(--storm-0), var(--storm-3)); transform-origin: 0 50%; }
</style>
</head>
<body>
<script>
/* FREE TOKENS, on an odometer: seven digit wheels spin up together and settle one by one, right to left,
   each landing with a mechanical wobble and the mark's cyan/magenta split flaring off the digit. The mark
   watches the next wheel due to land and smiles as the leading 1 clicks home on 1,000,000; then every
   wheel spins back to zero, left to right, and the counter rests where the loop began. */
var LOOP = 7, START = 0.35, FIRST = 1.5, STEP = 0.29, RESET = 5.75, RESET_DUR = 0.8;
var TARGET = [1, 0, 0, 0, 0, 0, 0];
var F = 250;
var wheels = [], commas = [], mark, num, rule, label, boxes = null;
var spinEase = SB.bezier(0.33, 0, 0.1, 1);
var LAST = FIRST + STEP * 6;

function landAt(i) { return FIRST + STEP * (6 - i); }

function roll(i, t) {
  var w = wheels[i], land = w.land;
  if (t < START) return 0;
  var r;
  if (t < land) r = w.final * spinEase(SB.seg(t, START, land));
  else {
    var q = SB.seg(t, land, land + 0.4);
    r = w.final + 0.16 * Math.sin(q * Math.PI * 2) * (1 - q) * (1 - q);
  }
  var rs = RESET + 0.06 * i;
  if (t > rs) r -= (w.target + 20) * SB.easeInOut(SB.seg(t, rs, rs + RESET_DUR));
  return r;
}

SB.ad({
  loop: LOOP,
  thumbAt: LAST + 0.5,
  build: function (frame, ctx) {
    wheels = []; commas = []; boxes = null;
    var center = SB.el('div', 'mc-center', frame);
    var lockup = SB.el('div', 'mc-lockup', center);
    lockup.style.fontSize = F + 'px';
    var col;
    if (ctx.narrow) {
      lockup.style.flexDirection = 'column';
      lockup.style.alignItems = 'flex-start';
      lockup.style.gap = '10px';
      var top = SB.el('div', '', lockup);
      top.style.display = 'flex'; top.style.alignItems = 'center'; top.style.gap = '44px';
      mark = SB.mascot(top, { size: 360, happy: [[LAST + 0.06, 2.1]] });
      label = SB.el('div', 'od-label', top);
      label.innerHTML = 'FREE<br>TOKENS:';
      label.style.fontSize = '0.8em';
      col = SB.el('div', 'od-col', lockup);
    } else {
      mark = SB.mascot(lockup, { size: 380, happy: [[LAST + 0.06, 2.1]] });
      col = SB.el('div', 'od-col', lockup);
      label = SB.el('div', 'od-label', col, 'FREE TOKENS:');
    }
    num = SB.el('div', 'od-num', col);
    TARGET.forEach(function (d, i) {
      var win = SB.el('span', 'wheel', num);
      var strip = SB.el('span', 'strip', win);
      for (var k = 0; k <= 10; k++) SB.el('span', '', strip, String(k % 10));
      var k6 = 6 - i;
      wheels.push({ win: win, strip: strip, target: d, final: 10 * (3 + k6) + d, land: landAt(i) });
      if (i === 0 || i === 3) commas.push({ node: SB.el('span', 'comma', num, ','), after: i });
    });
    rule = SB.el('div', 'od-rule', col);
    SB.fit(lockup, ctx.w * (ctx.narrow ? 0.9 : 0.88), 1080 * 0.8);
    mark.look = function (t) {
      if (!boxes) boxes = { w: wheels.map(function (w) { return SB.box(w.win); }), n: SB.box(num) };
      if (t < START - 0.15 || t > RESET + 0.2) return null;
      if (t >= LAST) return { x: boxes.n.x, y: boxes.n.y };
      for (var i = 6; i >= 0; i--) if (t < wheels[i].land) { var b = boxes.w[i]; return { x: b.x, y: b.y }; }
      return null;
    };
  },
  frame: function (t) {
    var dimOut = SB.easeInOut(SB.seg(t, RESET, RESET + RESET_DUR + 0.36));
    wheels.forEach(function (w, i) {
      var r = roll(i, t);
      var v = Math.abs(roll(i, t + 1 / 60) - roll(i, t - 1 / 60)) * 30; // digits per second
      var pos = ((r % 10) + 10) % 10;
      w.strip.style.transform = 'translateY(' + (-pos * 1.3).toFixed(4) + 'em)';
      var landed = t >= w.land;
      var lp = SB.seg(t, w.land, w.land + 0.38);
      var split = landed ? SB.lerp(18, 2.2, SB.easeOut(lp)) * (1 - dimOut) : 0;
      var sm = Math.min(70, v * 1.05);
      var sh = [];
      if (split > 0.05) sh.push((-split).toFixed(2) + 'px 0 var(--storm-0)', split.toFixed(2) + 'px 0 var(--storm-3)');
      if (sm > 0.5) sh.push('0 ' + sm.toFixed(1) + 'px 0 rgba(255,255,255,0.3)', '0 ' + (-sm).toFixed(1) + 'px 0 rgba(255,255,255,0.3)',
        '0 ' + (sm * 2).toFixed(1) + 'px 0 rgba(255,255,255,0.12)', '0 ' + (-sm * 2).toFixed(1) + 'px 0 rgba(255,255,255,0.12)');
      w.strip.style.textShadow = sh.length ? sh.join(', ') : 'none';
      var spinning = t >= START && !landed ? 0.62 : 0.34;
      var o = landed ? SB.lerp(1, 0.34, dimOut) : spinning;
      w.strip.style.opacity = String(o);
    });
    commas.forEach(function (c) {
      var on = t >= wheels[c.after + 1].land;
      c.node.style.opacity = String(on ? SB.lerp(1, 0.34, dimOut) : 0.34);
    });
    var pop = SB.seg(t, LAST, LAST + 0.45);
    num.style.transformOrigin = '0 60%';
    num.style.transform = t >= LAST ? 'scale(' + SB.lerp(1.045, 1, SB.backOut(pop)) + ')' : 'none';
    var ruleIn = SB.easeOut(SB.seg(t, LAST, LAST + 0.5));
    rule.style.transform = 'scaleX(' + (ruleIn * (1 - dimOut)).toFixed(4) + ')';
  }
});
</script>
</body>
</html>
