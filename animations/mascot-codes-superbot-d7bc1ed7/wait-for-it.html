<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WAIT FOR IT... · then comment AGAIN · superbot ad spot</title>
<script src="../../assets/ar.js"></script>
<link rel="stylesheet" href="../../assets/ar.css">
<link rel="stylesheet" href="kit/mascot.css">
<link rel="stylesheet" href="kit/stage.css">
<script src="kit/mascot.js"></script>
<script src="kit/codes.js"></script>
<script src="kit/stage.js"></script>
<style>
  .wall { position: absolute; inset: 0; background: #000; }
  .wall-grid { position: absolute; display: grid; justify-content: space-between; align-items: center; color: #fff; }
  .wall-grid > div { white-space: nowrap; text-align: center; }
  .wall-grid .d { opacity: 0.42; }
  .slot { position: relative; }
  .it { position: absolute; left: 0; top: 50%; transform: translateY(-50%); }
  .big { font-size: 230px; line-height: 0.9; }
  .ln { display: block; transform-origin: 0% 60%; }
  .dot { display: inline-block; transform-origin: 50% 85%; }
  .sub { font-size: 108px; line-height: 0.95; margin-top: 30px; display: block; }
  .acc { display: inline-block; }
</style>
</head>
<body>
<script>
/* WAIT FOR IT, one dot at a time, while the mark glances left and right faster and faster.
   The dots start hopping, the wait drags, and the codes go by in three frames when nobody expects it.
   Then TOO SLOW? COMMENT 'AGAIN' and a smug little smile. */
var FPS = 30, LOOP = 7.5;
var IN = 0.15, DOTS = [0.75, 1.3, 1.85], FLASH = 84, END = 3.1, SUB = 3.5, OUT = 6.85;
var GLANCE = [[0.2, 1], [0.62, -1], [1.05, 1], [1.42, -1], [1.74, 1], [2.02, -1], [2.26, 1], [2.46, -1], [2.62, 1]];
var lockHold, slot, textA, lnA, dots, textB, lnB, sub, acc, wall, mark, boxes;

function fi(t) { return Math.floor(t * FPS + 1e-4); }
function flashOn(t, k) { var f = fi(t); return f >= k && f < k + 3; }
function split(node, px) { node.style.textShadow = (-px).toFixed(2) + 'px 0 var(--storm-0), ' + px.toFixed(2) + 'px 0 var(--storm-3)'; }

// 100 codes laid out edge to edge: pick the column count that gives the biggest legible type.
function codeWall(parent, ctx, list, opts) {
  opts = opts || {};
  var W = ctx.w, H = 1080, n = list.length;
  var pad = Math.round(Math.min(W, H) * (opts.padK || 0.045)), top = opts.label ? 84 : 0;
  var aw = W - 2 * pad, ah = H - 2 * pad - top, GAP = 1.2, LH = 1.28, CH = 11.9, best = null;
  for (var c = 1; c <= 8; c++) {
    var r = Math.ceil(n / c);
    var f = Math.min(aw / (c * CH + (c - 1) * GAP), ah / (r * LH), opts.maxFont || 999);
    var score = f * (n % c === 0 ? 1.12 : 1);
    if (!best || score > best.score) best = { c: c, r: r, f: f, score: score };
  }
  var wallEl = SB.el('div', 'wall', parent);
  var grid = SB.el('div', 'wall-grid mc-mono', wallEl);
  grid.style.left = pad + 'px'; grid.style.top = (pad + top) + 'px';
  grid.style.width = aw + 'px'; grid.style.height = ah + 'px';
  grid.style.gridTemplateColumns = 'repeat(' + best.c + ', auto)';
  grid.style.gridTemplateRows = 'repeat(' + best.r + ', 1fr)';
  grid.style.fontSize = best.f + 'px';
  list.forEach(function (code) {
    var cell = SB.el('div', '', grid);
    code.split('-').forEach(function (part, i) {
      if (i) SB.el('span', 'd', cell, '-');
      SB.el('span', '', cell, part);
    });
  });
  if (n % best.c) { grid.lastChild.style.gridColumn = '1 / -1'; }
  if (best.c === 1) grid.style.justifyContent = 'center';
  var cw = grid.firstChild.offsetWidth, need = cw * best.c + GAP * best.f * (best.c - 1);
  if (need > aw) grid.style.fontSize = (best.f * aw / need * 0.99) + 'px';
  if (best.f >= 24) split(grid, 1);
  var label = null;
  if (opts.label) {
    label = SB.el('div', 'mc-mono mc-cyan', wallEl, opts.label);
    var lx = best.c === 1 ? pad + (aw - grid.firstChild.offsetWidth) / 2 : pad;
    label.style.cssText += 'position:absolute;left:' + lx + 'px;top:' + pad + 'px;font-size:40px;';
  }
  return { el: wallEl, label: label };
}

// A hit: scale from `from` to 1 with a little overshoot, over dur seconds from `at`.
function hit(t, at, from, dur) { return SB.lerp(from, 1, SB.backOut(SB.seg(t, at, at + (dur || 0.3)))); }
// A slot holds absolutely placed copy that swaps on cuts; size it to its biggest child so the lockup never shifts.
function sizeSlot(slot) {
  var w = 0, h = 0;
  for (var i = 0; i < slot.children.length; i++) { w = Math.max(w, slot.children[i].offsetWidth); h = Math.max(h, slot.children[i].offsetHeight); }
  slot.style.width = w + 'px'; slot.style.height = h + 'px';
  return { w: w, h: h };
}
function show(node, on) { node.style.visibility = on ? 'visible' : 'hidden'; }


SB.ad({
  loop: LOOP,
  thumbAt: 2.3,
  build: function (frame, ctx) {
    boxes = null;
    var c = SB.el('div', 'mc-center', frame);
    lockHold = SB.el('div', '', c);
    var lock = SB.el('div', 'mc-lockup', lockHold);
    lock.style.gap = (ctx.narrow ? 44 : 70) + 'px';
    var markBox = SB.el('div', '', lock);
    mark = SB.mascot(markBox, {
      size: 440,
      blinks: [{ t: 1.16 }, { t: 2.36 }, { t: 5.3 }],
      happy: [[3.36, 1.55]],
      look: function (t) {
        if (!boxes) {
          var m = SB.box(markBox);
          boxes = {
            L: { x: m.left - 1000, y: m.y - 60 }, R: { x: SB.box(slot).right + 900, y: m.y - 60 },
            acc: SB.box(acc)
          };
        }
        if (t >= GLANCE[0][0] && t < FLASH / FPS) {
          var side = 0;
          GLANCE.forEach(function (g) { if (t >= g[0]) side = g[1]; });
          return side < 0 ? boxes.L : boxes.R;
        }
        if (t >= END && t < 3.36) return { x: boxes.acc.x, y: boxes.acc.y };
        if (t >= 4.95 && t < 5.9) return { x: boxes.acc.x, y: boxes.acc.y };
        return null;
      }
    });
    slot = SB.el('div', 'slot', lock);
    textA = SB.el('div', 'mc-type it big', slot);
    lnA = [SB.el('span', 'ln', textA, 'WAIT'), SB.el('span', 'ln', textA, 'FOR IT')];
    dots = [0, 1, 2].map(function () { return SB.el('span', 'dot', lnA[1], '.'); });
    textB = SB.el('div', 'mc-type it big', slot);
    lnB = [SB.el('span', 'ln', textB)];
    lnB[0].innerHTML = ctx.narrow ? 'TOO<br>SLOW?' : 'TOO SLOW?';
    sub = SB.el('span', 'mc-type sub', textB);
    sub.innerHTML = ctx.narrow ? 'COMMENT<br>' : 'COMMENT ';
    acc = SB.el('span', 'acc', sub, '‘AGAIN’');
    sizeSlot(slot);
    SB.fit(lock, ctx.w * 0.86, 1080 * 0.72);
    wall = codeWall(frame, ctx, SB.codes(100, 404));
  },
  frame: function (t) {
    var f = fi(t), fl = flashOn(t, FLASH);
    var sceneA = t >= IN && f < FLASH, sceneB = t >= END && t < OUT + 0.4;
    var pout = SB.easeInOut(SB.seg(t, OUT, OUT + 0.4));
    show(lockHold, sceneA || sceneB);
    show(wall.el, fl);
    lockHold.style.opacity = String((sceneB ? 1 : SB.seg(t, IN, IN + 0.1)) * (1 - pout));
    lockHold.style.transform = 'scale(' + SB.lerp(1, 0.95, pout).toFixed(4) + ')';
    show(textA, sceneA); show(textB, sceneB);

    lnA[0].style.transform = 'scale(' + hit(t, IN, 1.16, 0.3).toFixed(4) + ')';
    split(lnA[0], SB.lerp(20, 3, SB.easeOut(SB.seg(t, IN, IN + 0.3))));
    split(lnA[1], SB.lerp(20, 3, SB.easeOut(SB.seg(t, IN, IN + 0.3))));
    lnA[1].style.transform = lnA[0].style.transform;
    // Dots land one by one, then hop in a restless wave while the wait drags on.
    dots.forEach(function (d, i) {
      show(d, sceneA && t >= DOTS[i]);
      var s = hit(t, DOTS[i], 1.9, 0.26);
      var wave = 0;
      if (t >= 2.05) { var ph = ((t - 2.05 - i * 0.1) % 0.5 + 0.5) % 0.5; wave = ph < 0.22 ? Math.sin(Math.PI * ph / 0.22) : 0; }
      d.style.transform = 'translateY(' + (-34 * wave).toFixed(2) + 'px) scale(' + s.toFixed(4) + ')';
    });

    lnB[0].style.transform = 'scale(' + hit(t, END, 1.2, 0.32).toFixed(4) + ')';
    split(lnB[0], SB.lerp(24, 3, SB.easeOut(SB.seg(t, END, END + 0.3))));
    var w = SB.easeOut(SB.seg(t, SUB, SUB + 0.42));
    sub.style.clipPath = 'inset(-20% ' + ((1 - w) * 100).toFixed(2) + '% -20% 0)';
    split(sub, 2);
    // AGAIN pulses its split like a heartbeat, asking for the comment.
    var beat = t >= SUB + 0.5 ? Math.pow(Math.max(0, Math.sin(Math.PI * ((t - SUB - 0.5) % 0.8) / 0.8)), 6) : 0;
    split(acc, 2 + 7 * beat);
    acc.style.transform = 'scale(' + (1 + 0.04 * beat).toFixed(4) + ')';
  }
});
</script>
</body>
</html>
