<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>superbot · is mayonnaise an instrument</title>
<script src="../../assets/ar.js"></script>
<link rel="stylesheet" href="style.css"/>
<link rel="stylesheet" href="../../assets/sb-real.css">
</head>
<body>
  <main class="stage" aria-label="the pitch: Patrick's 'Is mayonnaise an instrument?' with the ChatGPT icon on his head; a ChatGPT-like screen is asked 'Is mayonnaise an instrument?' and rambles about organology and emulsions forever, accelerating, until the camera flies down the wall of text; the same clip with the superbot icon on his head; a superbot screen in blue, pink and purple is asked the same and answers 'No.'; stop burning tokens; then the superbot.gg end card">

    <!-- scene 1 / scene 3: Patrick's "Is mayonnaise an instrument?", the icon
         composited onto his head offline (hand keyframes, .tmp/mayo + .tmp/whoareyou/composite.swift) -->
    <div class="clip" id="clipA"><video id="vidA" src="clip-gpt.mp4" preload="auto" playsinline></video></div>
    <div class="clip" id="clipB"><video id="vidB" src="clip-sb.mp4" preload="auto" playsinline></video></div>

    <!-- scene 2 / scene 4: the chat frontend. One DOM, two skins: the ChatGPT
         copy (favorite-color's reference) and the superbot take (.sb) -->
    <div class="chatui" id="chatui">
      <div class="gpt-head" id="gptHead"><span class="gpt-only">Ready when you are.</span><svg class="sb-mascot sb-only" viewBox="0 0 100 100" aria-hidden="true"><g transform="translate(-3 0)" fill="#00e5c3"><path d="M29 32H71A15 15 0 0 1 86 47V71A15 15 0 0 1 71 86H29A15 15 0 0 1 14 71V47A15 15 0 0 1 29 32ZM35 47a8 11 0 1 0 0 22a8 11 0 1 0 0-22ZM65 47a8 11 0 1 0 0 22a8 11 0 1 0 0-22Z" fill-rule="evenodd"/><path d="M14 46V28Q14 20 21 21Q28 24 36 32Z"/><path d="M86 46V28Q86 20 79 21Q72 24 64 32Z"/></g><g transform="translate(3 0)" fill="#c026d3"><path d="M29 32H71A15 15 0 0 1 86 47V71A15 15 0 0 1 71 86H29A15 15 0 0 1 14 71V47A15 15 0 0 1 29 32ZM35 47a8 11 0 1 0 0 22a8 11 0 1 0 0-22ZM65 47a8 11 0 1 0 0 22a8 11 0 1 0 0-22Z" fill-rule="evenodd"/><path d="M14 46V28Q14 20 21 21Q28 24 36 32Z"/><path d="M86 46V28Q86 20 79 21Q72 24 64 32Z"/></g><g transform="translate(0 0)" fill="#ffffff"><path d="M29 32H71A15 15 0 0 1 86 47V71A15 15 0 0 1 71 86H29A15 15 0 0 1 14 71V47A15 15 0 0 1 29 32ZM35 47a8 11 0 1 0 0 22a8 11 0 1 0 0-22ZM65 47a8 11 0 1 0 0 22a8 11 0 1 0 0-22Z" fill-rule="evenodd"/><path d="M14 46V28Q14 20 21 21Q28 24 36 32Z"/><path d="M86 46V28Q86 20 79 21Q72 24 64 32Z"/></g></svg><span class="sb-only">Good afternoon. What's the job?</span></div>

      <div class="msg-area" id="msgArea">
        <div class="msg msg-user" id="msgUser"></div>
        <div class="typing-indicator" id="typingDots" aria-hidden="true"><i></i><i></i><i></i></div>
        <div class="msg msg-ai" id="msgAi"></div>
      </div>

      <div class="input-pill" id="pill">
        <svg class="plus-ic" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        <span class="pill-text"><span class="input-text" id="inputText"></span><span class="placeholder" id="placeholder"><span class="gpt-only">Ask anything</span><span class="sb-only">How can superbot help you today?</span></span><span class="caret" id="caret"></span></span>
        <span class="think-chip" aria-hidden="true">
          <svg class="think-ic" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
            <path d="M12 3c2.8 0 4 1.9 4 3.6 1.5.3 2.6 1.6 2.6 3.2 0 .8-.3 1.6-.8 2.1.9.7 1.4 1.7 1.4 2.8 0 2-1.7 3.8-4 3.8h-.6V21h-2v-2h-2v2H7v-2.8C5.2 17.7 4 16.2 4 14.4c0-1.4.7-2.6 1.8-3.3C4.9 7.7 7.8 6.4 6.6 4.6 7.8 5 8.6 5.8 9 6.8 9.8 6 10.8 5.6 12 5.6z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
          </svg>
          <svg class="bot-ic" viewBox="0 0 100 100" aria-hidden="true">
            <g fill="currentColor"><rect x="14" y="32" width="72" height="54" rx="15"/><path d="M14 46V28Q14 20 21 21Q28 24 36 32Z"/><path d="M86 46V28Q86 20 79 21Q72 24 64 32Z"/></g>
            <g fill="var(--bg)"><ellipse cx="35" cy="58" rx="8" ry="11"/><ellipse cx="65" cy="58" rx="8" ry="11"/></g>
          </svg>
          <span class="think-label">Think</span>
        </span>
        <svg class="mic-ic" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="9.2" y="3" width="5.6" height="11" rx="2.8" fill="none" stroke="currentColor" stroke-width="1.8"/>
          <path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3.2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        <span class="voice-btn" id="voiceBtn" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
            <path d="M4 10v4M8 7v10M12 5v14M16 7v10M20 9v6" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
          </svg>
        </span>
      
        <span class="sb-ctl sb-seg sb-only" aria-hidden="true"><span><svg viewBox="0 0 24 24"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg></span><span><svg viewBox="0 0 24 24"><path d="m15 12-8.373 8.373a1 1 0 1 1-3-3L12 9"/><path d="m18 15 4-4"/><path d="m21.5 11.5-1.914-1.914A2 2 0 0 1 19 8.172V7l-2.26-2.26a6 6 0 0 0-4.202-1.756L9 2.96l.92.82A6.18 6.18 0 0 1 12 8.4V10l2 2h1.172a2 2 0 0 1 1.414.586L18.5 14.5"/></svg></span></span>
        <span class="sb-ctl sb-super sb-only" aria-hidden="true">SUPER</span>
        <span class="sb-ctl sb-plat sb-only" aria-hidden="true"><svg class="sb-cat" viewBox="0 0 100 100" aria-hidden="true"><g fill="#fff"><path d="M29 32H71A15 15 0 0 1 86 47V71A15 15 0 0 1 71 86H29A15 15 0 0 1 14 71V47A15 15 0 0 1 29 32Z"/><path d="M14 46V28Q14 20 21 21Q28 24 36 32Z"/><path d="M86 46V28Q86 20 79 21Q72 24 64 32Z"/></g><g fill="#1a1a1c"><ellipse cx="35" cy="58" rx="8" ry="11"/><ellipse cx="65" cy="58" rx="8" ry="11"/></g></svg><span class="sb-plat-l">superbot</span><svg class="sb-chev" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></span>
        <span class="sb-ctl sb-computer sb-only" aria-hidden="true"><svg viewBox="0 0 24 24"><rect width="20" height="14" x="2" y="3" rx="2"/><path d="M8 21h8M12 17v4"/></svg></span>
        <span class="sb-ctl sb-mic sb-only" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><path d="M12 19v3"/></svg></span>
        <span class="sb-ctl sb-send sb-only" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m5 12 7-7 7 7"/><path d="M12 19V5"/></svg></span>
      </div>

      <div class="suggestions" id="suggestions">
        <div class="sug">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="3" fill="none" stroke="currentColor" stroke-width="1.7"/><circle cx="9" cy="10" r="1.7" fill="currentColor"/><path d="M5 17.5l4.4-4.2 3.2 3 3-2.6 3.6 3.6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
          Create an image or sticker
        </div>
        <div class="sug">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l1-4L16.5 4.5a2.1 2.1 0 013 3L8 20l-4 0z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
          Write or edit
        </div>
        <div class="sug">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M3.5 12h17M12 3.5c2.6 2.3 3.9 5.2 3.9 8.5s-1.3 6.2-3.9 8.5c-2.6-2.3-3.9-5.2-3.9-8.5s1.3-6.2 3.9-8.5z" fill="none" stroke="currentColor" stroke-width="1.7"/></svg>
          Search the web
        </div>
      </div>
    </div>

    <!-- stop burning tokens. -->
    <div class="simple" id="simple" aria-hidden="true">Stop burning tokens.</div>

    <!-- the end card: the superbot.gg lockup (favorite-color's end sequence) -->
    <div class="endcard" id="endcard" aria-hidden="true" style="display:none">
      <div class="endcard-bot" id="endBot"><svg class="endcard-face" viewBox="0 0 100 100" aria-hidden="true" focusable="false"><defs><mask id="endFace" maskUnits="userSpaceOnUse" x="-30" y="-30" width="160" height="160"><g fill="#fff"><rect x="14" y="32" width="72" height="54" rx="15"/><path d="M14 46V28Q14 20 21 21Q28 24 36 32Z"/><path d="M86 46V28Q86 20 79 21Q72 24 64 32Z"/></g><g fill="#000"><ellipse cx="35" cy="58" rx="8" ry="11"/><ellipse cx="65" cy="58" rx="8" ry="11"/></g></mask></defs><rect x="-30" y="-30" width="160" height="160" fill="#00e5c3" mask="url(#endFace)" transform="translate(-1.2 -1.2)"/><rect x="-30" y="-30" width="160" height="160" fill="#c026d3" mask="url(#endFace)" transform="translate(1.2 1.2)"/><rect x="-30" y="-30" width="160" height="160" fill="#fff" mask="url(#endFace)"/></svg></div>
      <div class="endcard-word" id="endWord"><h1>superbot.gg</h1><p>the agent to manage your agents.</p></div>
    </div>

    <div class="veil" id="veil" aria-hidden="true"></div>
    <!-- shown only when the browser refused sound: one tap anywhere unmutes -->
    <button class="sound-hint" id="soundHint" type="button" style="display:none">tap for sound</button>
  </main>
  <div class="hint" id="hint">↺ replay</div>

  <button class="rec-btn" id="recordBtn" type="button" aria-label="record the animation">
    <span class="rec-dot"></span><span id="recordLabel">Record</span>
  </button>
  <div class="rec-hud" id="recHud" aria-hidden="true"><span class="rec-dot"></span><span id="recTime">0:00</span></div>

  <script src="recorder.js"></script>
  <script type="module" src="timeline.js"></script>
</body>
</html>
