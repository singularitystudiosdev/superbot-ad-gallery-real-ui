<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ghx7 beat D: the race (source of video/race-16x9)</title>
<!-- The race clip, drawn from code. The page is a pure function of t: window.seek(t) draws the frame for local time
     t in [0, 5.2] (spot time 2.90 to 8.10), ?t=<seconds> freezes a frame, no query plays it live in a loop.
     render.mjs steps it frame by frame (30 fps, 156 frames) in headless Chromium and encodes video/race-16x9.{mp4,webm}. -->
<link rel="stylesheet" href="../../../assets/sb-mark-live.css">
<link rel="stylesheet" href="race.css">
</head>
<body>
<div id="stage">
  <div id="glow"></div>
  <header id="strip">
    <div class="chip repo"><span class="av" data-src="../img/avatar-kitebase.png" data-fb="K" data-fbc="#2b6bff"></span><b>kitebase/web</b></div>
    <div class="chip issue"><span class="av" data-src="../img/avatar-jonah-reyes.png" data-fb="JR" data-fbc="#8b5cf6"></span><i class="oct io" data-oct="issue-opened"></i><b class="num">#482</b><span class="ttl">Users get logged out after 15 minutes</span></div>
    <div class="chip br"><i class="oct" data-oct="git-branch"></i><code>fix/482-session-refresh</code></div>
    <div class="race"><span class="mk" id="stripMark"></span><span>racing 3 patches</span></div>
  </header>
  <div id="wins"></div>
  <div id="kept"><span class="mk" id="keptMark"></span><span class="kw">Kept</span></div>
</div>
<script src="../../../assets/sb-mark-live.js"></script>
<script src="race.js"></script>
</body>
</html>
