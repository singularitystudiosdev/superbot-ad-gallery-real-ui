<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ytx1 Studio states</title>
<link rel="stylesheet" href="studio.css">
<style>
  html, body { margin: 0; background: #000; }
  body.grid { width: 1920px; height: 1080px; display: grid; grid-template-columns: 960px 960px; grid-template-rows: 540px 540px; overflow: hidden; }
  body.grid iframe { width: 1920px; height: 1080px; border: 0; transform: scale(.5); transform-origin: 0 0; }
  body.grid .cell { position: relative; width: 960px; height: 540px; overflow: hidden; }
</style>
</head>
<body>
<script type="module">
  import { buildStudio, applyState } from './studio.js';
  const q = new URLSearchParams(location.search);
  if (q.has('state')) {
    const root = document.createElement('div');
    document.body.appendChild(root);
    const api = buildStudio(root, undefined, { base: '../' });
    window.__studio = api;
    const n = Number(q.get('state'));
    applyState(api, n);
    api.ready().then(() => { applyState(api, n); window.__ready = true; });
  } else {
    // overview: the four reference states, each a real 1920x1080 render scaled to a quarter
    document.body.className = 'grid';
    document.body.innerHTML = [0, 1, 2, 3].map((n) => `<div class="cell"><iframe src="preview.html?state=${n}"></iframe></div>`).join('');
    window.__ready = true;
  }
</script>
</body>
</html>
