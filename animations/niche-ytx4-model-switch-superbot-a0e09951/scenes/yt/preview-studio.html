<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ytx4 preview: YouTube Studio comments</title>
<link rel="stylesheet" href="yt.css">
<style>html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#fff}</style>
</head>
<body>
<script type="module">
import { mountStudioComments, ytReady } from './studio-comments.js';
import data from './story-data.js';

const SORTED = ['c1', 'c4', 'c6', 'c2', 'c5', 'c7', 'c10', 'c3', 'c8', 'c9'];
const ALL_POSTED = { c1: { typed: 1, posted: 1 }, c2: { typed: 1, posted: 1 }, c3: { typed: 1, posted: 1 }, c4: { typed: 1, posted: 1 } };
const LEG4 = ['c2', 'c4', 'c1', 'c3', 'c5', 'c6', 'c7', 'c8', 'c10', 'c9'];
const PRESETS = {
  default: {},
  sorting: { counts: { love: 410, questions: 96, critique: 59, spam: 12 }, reorder: { from: data.comments.map((c) => c.id), p: 0.5 }, order: SORTED },
  sorted: { counts: data.sentimentCounts, order: SORTED, filter: 'questions', highlightId: 'c1' },
  replying: { order: LEG4, replies: { c2: { typed: 1, posted: 1 }, c4: { typed: 0.55, posted: 0 } }, hearted: ['c2'], highlightId: 'c4' },
  posted: { order: LEG4, replies: ALL_POSTED, hearted: ['c1', 'c2'] },
  menu: { order: LEG4, replies: ALL_POSTED, hearted: ['c1', 'c2'], menuOpenId: 'c1', highlightId: 'c1' },
  pinning: { order: LEG4, replies: ALL_POSTED, hearted: ['c1', 'c2'], pin: { id: 'c1', p: 0.62 } },
  pinned: { order: LEG4, replies: ALL_POSTED, hearted: ['c1', 'c2'], pin: { id: 'c1', p: 1 } },
};
const q = new URLSearchParams(location.search);
let state = PRESETS[q.get('preset') || 'default'] || {};
if (q.get('state')) state = JSON.parse(q.get('state'));
const api = mountStudioComments(document.body, data);
window.__yt = api;
window.__presets = PRESETS;
api.update(state);
await ytReady(api.el);
api.update(state);
window.__ready = true;
</script>
</body>
</html>
