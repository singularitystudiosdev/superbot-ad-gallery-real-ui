<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Superbot doesn't refuse:  the same curl pointed at api.openai.com and at beta.superbot.gg, a content_filtered refus</title>
<style>
/* Plays the rendered film (24.0 s, 60 fps, with sound), 1920x1080 fitted whole on a near-black canvas. */
:root { --canvas: #070707; }
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--canvas); }
body { display: grid; place-items: center; }
.frame { position: relative; width: min(100vw, 177.78vh); aspect-ratio: 16 / 9; background: var(--canvas); }
video { display: block; width: 100%; height: 100%; object-fit: contain; background: var(--canvas); }
</style>
</head>
<body>
<div class="frame">
  <video id="film" autoplay loop playsinline preload="auto" aria-label="superbot ad: the same curl at api.openai.com returns content_filtered, then at beta.superbot.gg returns 200 with x-superbot-route: claude-opus-5.5"></video>
</div>
<script>
  const video = document.getElementById("film");
  video.poster = "poster.png";
  video.src = "final.mp4";
  const unmute = () => { video.muted = false; video.play().catch(() => {}); };
  const start = () => {
    video.muted = false;
    video.play().catch(() => { video.muted = true; video.play().catch(() => {}); });
  };
  for (const type of ["pointerdown", "keydown", "touchstart"]) addEventListener(type, unmute, { once: true, capture: true });
  addEventListener("message", (e) => { if (e.data && e.data.type === "unmute") unmute(); });
  if (video.readyState >= 2) start();
  else video.addEventListener("canplay", start, { once: true });
</script>
</body>
</html>
