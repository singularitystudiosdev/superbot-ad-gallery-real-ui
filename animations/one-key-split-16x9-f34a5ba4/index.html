<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>One API key, all your subscriptions: 4 logins, 4 keys, 4 tabs, then 1 key (before and after, 16:9)</title>
<style>
/* Plays the rendered 1920x1080 film (final.mp4, 18.0 s, 30 fps, with sound) at 16:9 on
   the film's own near-black canvas. The gallery loads this page in a frame at any
   ?ar=; the 16:9 picture is fitted whole and the rest of the frame stays near-black. */
:root {
  --canvas: #070707;
  --surface: #ffffff;
  --ink: #14171c;
  --hairline: #d4d8de;
}

*, *::before, *::after { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  background: var(--canvas);
}

body {
  display: grid;
  place-items: center;
}

.frame {
  position: relative;
  width: min(100vw, calc(100vh * 16 / 9));
  aspect-ratio: 16 / 9;
  background: var(--canvas);
}

.wide .frame {
  width: min(100vw, calc(100vh * 16 / 9));
  aspect-ratio: 16 / 9;
}

video {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
  background: var(--canvas);
}

</style>
</head>
<body>
<div class="frame">
  <video id="film" autoplay loop playsinline preload="auto"
    aria-label="One API key, all your subscriptions: 4 logins, 4 keys, 4 tabs, then 1 key (before and after, 16:9): A pile of logins, provider keys and tabs for ChatGPT, Claude, Grok and Cursor is wiped away and replaced by one Superbot panel with one caller key and four connected subscriptions, then shown side by side, with sound on (18.0s loop)."></video>
</div>
<script>
  const video = document.getElementById("film");
  const wide = new URLSearchParams(location.search).get("ar") === "16x9";
  document.documentElement.classList.toggle("wide", wide);
  video.poster = wide ? "poster-16x9.png" : "poster.png";
  video.src = wide ? "final-16x9.mp4" : "final.mp4";
  // Sound is always on: try unmuted autoplay, and if the browser refuses it, play muted and unmute on the
  // viewer's first click, key or touch.
  const unmute = () => {
    video.muted = false;
    video.play().catch(() => {});
  };
  const start = () => {
    video.muted = false;
    video.play().catch(() => {
      video.muted = true;
      video.play().catch(() => {});
    });
  };
  for (const type of ["pointerdown", "keydown", "touchstart"]) addEventListener(type, unmute, { once: true, capture: true });
  // the gallery lightbox posts { type: "unmute" } on the viewer's first click or key
  addEventListener("message", (e) => {
    if (e.data && e.data.type === "unmute") unmute();
  });
  if (video.readyState >= 2) start();
  else video.addEventListener("canplay", start, { once: true });
</script>
</body>
</html>
