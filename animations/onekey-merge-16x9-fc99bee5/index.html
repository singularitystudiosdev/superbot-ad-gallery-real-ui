<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>One API key for all your subscriptions</title>
<style>
/* Plays the rendered film (20 s, 1920x1080, 60 fps, with sound) on its own near-black canvas. */
:root { --canvas: #060607; }
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--canvas); }
body { display: grid; place-items: center; }
.frame { position: relative; width: min(100vw, calc(100vh * 16 / 9)); aspect-ratio: 16 / 9; background: var(--canvas); }
video { display: block; width: 100%; height: 100%; object-fit: contain; background: var(--canvas); }
</style>
</head>
<body>
<div class="frame">
  <video id="film" autoplay loop playsinline preload="auto" poster="poster.png" src="final.mp4"
    aria-label="A 2x2 wall of the Anthropic, OpenAI, Google and DeepSeek consoles: four logins, four API keys pages, four quota errors. The four keys lift out of their dashboards, stack and scramble into one sk-superbot key that is copied once and pasted into a single terminal line (OPENAI_BASE_URL and OPENAI_API_KEY). A request log then spins a model reel per request: Claude Opus 5.5 on your Claude Max plan, Gemini 3.1 Pro on your Google AI Pro plan, DeepSeek V4 as the cheapest fit. Ends on &quot;One API key for all your subscriptions.&quot; 20 s, 1920x1080, 60 fps, with sound."></video>
</div>
<script>
  const video = document.getElementById("film");
  // Sound is always on: try unmuted autoplay, and if the browser refuses it, play muted and unmute on the
  // viewer's first click, key or touch.
  const unmute = () => {
    video.muted = false;
    video.play().catch(() => {});
  };
  const start = () => {
    video.muted = false;
    video.play().catch(() => {
      video.muted = true;
      video.play().catch(() => {});
    });
  };
  for (const type of ["pointerdown", "keydown", "touchstart"]) addEventListener(type, unmute, { once: true, capture: true });
  // the gallery lightbox posts { type: "unmute" } on the viewer's first click or key
  addEventListener("message", (e) => {
    if (e.data && e.data.type === "unmute") unmute();
  });
  if (video.readyState >= 2) start();
  else video.addEventListener("canplay", start, { once: true });
</script>
</body>
</html>
