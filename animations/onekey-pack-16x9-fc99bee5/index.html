<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>One API key for all your subscriptions</title>
<style>
/* Plays the rendered film (20 s, 1920x1080, 60 fps, with sound) on its own near-black canvas. */
:root { --canvas: #060607; }
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--canvas); }
body { display: grid; place-items: center; }
.frame { position: relative; width: min(100vw, calc(100vh * 16 / 9)); aspect-ratio: 16 / 9; background: var(--canvas); }
video { display: block; width: 100%; height: 100%; object-fit: contain; background: var(--canvas); }
</style>
</head>
<body>
<div class="frame">
  <video id="film" autoplay loop playsinline preload="auto" poster="poster.png" src="final.mp4"
    aria-label="Four browser windows bury the desktop: Claude Console, OpenAI Platform, Google AI Studio and DeepSeek Platform, each with its own login, API keys page and quota error. The windows shrink into their plans (Claude Max, ChatGPT Pro, Google AI Pro, DeepSeek balance) and the plans pack into one sk-superbot key. The key is pasted once into the OpenAI client line (base_url http://127.0.0.1:18787/v1), then each request routes to the model that fits: a 2,000-line refactor to Claude Opus 5.5 on Claude Max, three 300-page PDFs to Gemini 3.1 Pro on Google AI Pro, a CSV to JSON job to DeepSeek V4, the cheapest fit. Ends on &quot;One API key for all your subscriptions.&quot; 20 s, 1920x1080, 60 fps, with sound."></video>
</div>
<script>
  const video = document.getElementById("film");
  // Sound is always on: try unmuted autoplay, and if the browser refuses it, play muted and unmute on the
  // viewer's first click, key or touch.
  const unmute = () => {
    video.muted = false;
    video.play().catch(() => {});
  };
  const start = () => {
    video.muted = false;
    video.play().catch(() => {
      video.muted = true;
      video.play().catch(() => {});
    });
  };
  for (const type of ["pointerdown", "keydown", "touchstart"]) addEventListener(type, unmute, { once: true, capture: true });
  // the gallery lightbox posts { type: "unmute" } on the viewer's first click or key
  addEventListener("message", (e) => {
    if (e.data && e.data.type === "unmute") unmute();
  });
  if (video.readyState >= 2) start();
  else video.addEventListener("canplay", start, { once: true });
</script>
</body>
</html>
