<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>One download, fixed in every app (side by side): without superbot, refused 3x; with superbot, answered 2 of 2 in the same app (16:9)</title>
<style>
/* Plays the rendered 1920x1080 film (final.mp4, 14.4 s, 30 fps, with sound) at 16:9 on the film's own
   near-black canvas. The gallery loads this page in a frame at any ?ar=; the 16:9 picture is fitted whole
   and the rest of the frame stays near-black. Source: refuse-relay.8d1a06d2/v5-split (window.seek(t)). */
:root { --canvas: #070707; }
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--canvas); }
body { display: grid; place-items: center; }
.frame { position: relative; width: min(100vw, calc(100vh * 16 / 9)); aspect-ratio: 16 / 9; background: var(--canvas); }
video { display: block; width: 100%; height: 100%; object-fit: contain; background: var(--canvas); }
</style>
</head>
<body>
<div class="frame">
  <video id="film" src="final.mp4" poster="poster.png" autoplay loop playsinline preload="auto"
    aria-label="Before and after, in the same app. &quot;same app. same ask.&quot; Two Claude windows, without superbot on the left and with superbot on the right, each over its own Dock; both get &quot;I can’t help with that.&quot; On the right, Download now is pressed and Superbot’s icon lands in its Dock: &quot;one download fixes it right there.&quot; Superbot’s notice, Switched to DeepSeek V4 Flash and the answer land inside the right Claude window while the left one is refused again. Then a ChatGPT pair: the left refuses, the right is fixed in place with Grok 4.7. Counters end on refused 3x against answered 2 of 2. Ends on Download now, one download. fixed in every app., superbot.gg. 14.4 s, 1920x1080, 30 fps, with sound."></video>
</div>
<script>
  const video = document.getElementById("film");
  // Sound is always on: try unmuted autoplay, and if the browser refuses it, play muted and unmute on the
  // viewer's first click, key or touch.
  const unmute = () => {
    video.muted = false;
    video.play().catch(() => {});
  };
  const start = () => {
    video.muted = false;
    video.play().catch(() => {
      video.muted = true;
      video.play().catch(() => {});
    });
  };
  for (const type of ["pointerdown", "keydown", "touchstart"]) addEventListener(type, unmute, { once: true, capture: true });
  // the gallery lightbox posts { type: "unmute" } on the viewer's first click or key
  addEventListener("message", (e) => {
    if (e.data && e.data.type === "unmute") unmute();
  });
  if (video.readyState >= 2) start();
  else video.addEventListener("canplay", start, { once: true });
</script>
</body>
</html>
