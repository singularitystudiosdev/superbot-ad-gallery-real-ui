<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>One download, fixed in every app (live demo): Download now, then Claude refuses and Superbot fixes it inside Claude’s own window (16:9)</title>
<style>
/* Plays the rendered 1920x1080 film (final.mp4, 19.2 s, 30 fps, with sound) at 16:9 on the film's own
   near-black canvas. The gallery loads this page in a frame at any ?ar=; the 16:9 picture is fitted whole
   and the rest of the frame stays near-black. Source: refuse-relay.8d1a06d2/v3-thread (window.seek(t)). */
:root { --canvas: #070707; }
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--canvas); }
body { display: grid; place-items: center; }
.frame { position: relative; width: min(100vw, calc(100vh * 16 / 9)); aspect-ratio: 16 / 9; background: var(--canvas); }
video { display: block; width: 100%; height: 100%; object-fit: contain; background: var(--canvas); }
</style>
</head>
<body>
<div class="frame">
  <video id="film" src="final.mp4" poster="poster.png" autoplay loop playsinline preload="auto"
    aria-label="The product demo, inside the apps you already use. It opens on a Claude window over the Dock: Download now is pressed and Superbot’s icon lands in the Dock, once. Then the camera works the Claude window like the bikeride spot: the ask is typed into Claude’s own composer, Claude Opus 5.5 refuses, the line is struck, Superbot’s notice &quot;Claude can’t make this here / Superbot made it instead.&quot; lands inside Claude’s window, the camera pushes in on Switching to DeepSeek V4 Flash until the check lands, and the answer streams in the same window. The camera slides to ChatGPT: refused, &quot;ChatGPT can’t make this here&quot;, Switched to Grok 4.7, answered in ChatGPT’s window. A pull back shows Gemini and Grok windows fixed too. Ends on Download now, one download. fixed in every app., superbot.gg. 19.2 s, 1920x1080, 30 fps, with sound."></video>
</div>
<script>
  const video = document.getElementById("film");
  // Sound is always on: try unmuted autoplay, and if the browser refuses it, play muted and unmute on the
  // viewer's first click, key or touch.
  const unmute = () => {
    video.muted = false;
    video.play().catch(() => {});
  };
  const start = () => {
    video.muted = false;
    video.play().catch(() => {
      video.muted = true;
      video.play().catch(() => {});
    });
  };
  for (const type of ["pointerdown", "keydown", "touchstart"]) addEventListener(type, unmute, { once: true, capture: true });
  // the gallery lightbox posts { type: "unmute" } on the viewer's first click or key
  addEventListener("message", (e) => {
    if (e.data && e.data.type === "unmute") unmute();
  });
  if (video.readyState >= 2) start();
  else video.addEventListener("canplay", start, { once: true });
</script>
</body>
</html>
