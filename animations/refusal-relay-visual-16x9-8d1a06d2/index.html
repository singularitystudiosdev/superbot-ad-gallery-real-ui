<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>One download, fixed in every app (visual): Claude says no, Superbot fixes it right in Claude’s window, then ChatGPT, Gemini and Grok (16:9)</title>
<style>
/* Plays the rendered 1920x1080 film (final.mp4, 16.8 s, 30 fps, with sound) at 16:9 on the film's own
   near-black canvas. The gallery loads this page in a frame at any ?ar=; the 16:9 picture is fitted whole
   and the rest of the frame stays near-black. Source: refuse-relay.8d1a06d2/v1-visual (window.seek(t)). */
:root { --canvas: #070707; }
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--canvas); }
body { display: grid; place-items: center; }
.frame { position: relative; width: min(100vw, calc(100vh * 16 / 9)); aspect-ratio: 16 / 9; background: var(--canvas); }
video { display: block; width: 100%; height: 100%; object-fit: contain; background: var(--canvas); }
</style>
</head>
<body>
<div class="frame">
  <video id="film" src="final.mp4" poster="poster.png" autoplay loop playsinline preload="auto"
    aria-label="No headline, only real UI. Frame 0: a Download now button over the Dock (Claude, ChatGPT, Gemini, Grok, Cursor); it is pressed and Superbot’s icon bounces into the Dock, once. A Claude window opens, Claude Opus 5.5 answers &quot;Roast my brother for his 30th&quot; with &quot;I can’t help with that.&quot; and the line is struck. The Superbot dial rises out of its Dock icon, swallows the refusal, ring-snaps to DeepSeek V4 Flash and throws it back into the same Claude window, where Superbot’s own switch pill (Switched to DeepSeek V4 Flash), notice (&quot;Claude can’t make this here / Superbot made it instead.&quot;) and the answer land. The same in a ChatGPT window, to Grok 4.7. Then four windows, Claude, ChatGPT, Gemini and Grok, each refusal fixed where it happened while the Dock icon hops. Ends on Download now, one download. fixed in every app., superbot.gg. The Claude, ChatGPT, Gemini and Grok panes wear superbot-desktop’s own vendor fronts. 16.8 s, 1920x1080, 30 fps, with sound."></video>
</div>
<script>
  const video = document.getElementById("film");
  // Sound is always on: try unmuted autoplay, and if the browser refuses it, play muted and unmute on the
  // viewer's first click, key or touch.
  const unmute = () => {
    video.muted = false;
    video.play().catch(() => {});
  };
  const start = () => {
    video.muted = false;
    video.play().catch(() => {
      video.muted = true;
      video.play().catch(() => {});
    });
  };
  for (const type of ["pointerdown", "keydown", "touchstart"]) addEventListener(type, unmute, { once: true, capture: true });
  // the gallery lightbox posts { type: "unmute" } on the viewer's first click or key
  addEventListener("message", (e) => {
    if (e.data && e.data.type === "unmute") unmute();
  });
  if (video.readyState >= 2) start();
  else video.addEventListener("canplay", start, { once: true });
</script>
</body>
</html>
