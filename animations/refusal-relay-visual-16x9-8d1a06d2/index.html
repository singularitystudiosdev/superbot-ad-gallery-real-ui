<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A refusal, relayed (visual): Claude says no, the Superbot dial swallows it and snaps to DeepSeek, the answer lands (16:9)</title>
<style>
/* Plays the rendered 1920x1080 film (final.mp4, 14.4 s, 30 fps, with sound) at 16:9 on the film's own
   near-black canvas. The gallery loads this page in a frame at any ?ar=; the 16:9 picture is fitted whole
   and the rest of the frame stays near-black. Source: refuse-relay.8d1a06d2/v1-visual (window.seek(t)). */
:root { --canvas: #070707; }
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--canvas); }
body { display: grid; place-items: center; }
.frame { position: relative; width: min(100vw, calc(100vh * 16 / 9)); aspect-ratio: 16 / 9; background: var(--canvas); }
video { display: block; width: 100%; height: 100%; object-fit: contain; background: var(--canvas); }
</style>
</head>
<body>
<div class="frame">
  <video id="film" src="final.mp4" poster="poster.png" autoplay loop playsinline preload="auto"
    aria-label="No headline, only the real Superbot UI on the knit phone. Claude Opus 5.5 on your Mac answers &quot;Roast my brother for his 30th&quot; with &quot;I can’t help with that.&quot; The line is struck, peeled out of the thread as a pill and swallowed by a Superbot dial of model tiles beside the phone, which spins and ring-snaps to DeepSeek V4 Flash. DeepSeek drops back into the thread as the real switch pill (Switching to, then Switched to DeepSeek V4 Flash) and answers. Then ChatGPT refuses a D&amp;D villain speech and the dial snaps to Grok 4.7. The music cuts out on each refusal and drops back in on each switch. Ends on superbot.gg, never get refused again. 14.4 s, 1920x1080, 30 fps, with sound."></video>
</div>
<script>
  const video = document.getElementById("film");
  // Sound is always on: try unmuted autoplay, and if the browser refuses it, play muted and unmute on the
  // viewer's first click, key or touch.
  const unmute = () => {
    video.muted = false;
    video.play().catch(() => {});
  };
  const start = () => {
    video.muted = false;
    video.play().catch(() => {
      video.muted = true;
      video.play().catch(() => {});
    });
  };
  for (const type of ["pointerdown", "keydown", "touchstart"]) addEventListener(type, unmute, { once: true, capture: true });
  // the gallery lightbox posts { type: "unmute" } on the viewer's first click or key
  addEventListener("message", (e) => {
    if (e.data && e.data.type === "unmute") unmute();
  });
  if (video.readyState >= 2) start();
  else video.addEventListener("canplay", start, { once: true });
</script>
</body>
</html>
