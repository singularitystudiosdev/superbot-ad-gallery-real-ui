<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>One download, fixed in every app (words): claude said no. chatgpt said no. one download. fixed right there. in every app. (16:9)</title>
<style>
/* Plays the rendered 1920x1080 film (final.mp4, 14.4 s, 30 fps, with sound) at 16:9 on the film's own
   near-black canvas. The gallery loads this page in a frame at any ?ar=; the 16:9 picture is fitted whole
   and the rest of the frame stays near-black. Source: refuse-relay.8d1a06d2/v2-words (window.seek(t)). */
:root { --canvas: #070707; }
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--canvas); }
body { display: grid; place-items: center; }
.frame { position: relative; width: min(100vw, calc(100vh * 16 / 9)); aspect-ratio: 16 / 9; background: var(--canvas); }
video { display: block; width: 100%; height: 100%; object-fit: contain; background: var(--canvas); }
</style>
</head>
<body>
<div class="frame">
  <video id="film" src="final.mp4" poster="poster.png" autoplay loop playsinline preload="auto"
    aria-label="Kinetic type over the real windows. &quot;claude said no.&quot; over a Claude window where Claude Opus 5.5’s &quot;I can’t help with that.&quot; is struck; &quot;chatgpt said no.&quot; as a ChatGPT window refuses a D&amp;D villain speech; &quot;one download.&quot; as Download now is pressed and Superbot’s icon lands in the Dock beside Claude, ChatGPT, Gemini, Grok and Cursor; &quot;fixed right there.&quot; as Superbot’s own notice, switch pills (Switched to DeepSeek V4 Flash, Switched to Grok 4.7) and the answers land inside those same two windows; &quot;in every app.&quot; as Gemini and Grok windows get fixed the same way. Each &quot;no.&quot; lands on a cut in the music, the fix on the drop. Ends on Download now, one download. fixed in every app., superbot.gg. 14.4 s, 1920x1080, 30 fps, with sound."></video>
</div>
<script>
  const video = document.getElementById("film");
  // Sound is always on: try unmuted autoplay, and if the browser refuses it, play muted and unmute on the
  // viewer's first click, key or touch.
  const unmute = () => {
    video.muted = false;
    video.play().catch(() => {});
  };
  const start = () => {
    video.muted = false;
    video.play().catch(() => {
      video.muted = true;
      video.play().catch(() => {});
    });
  };
  for (const type of ["pointerdown", "keydown", "touchstart"]) addEventListener(type, unmute, { once: true, capture: true });
  // the gallery lightbox posts { type: "unmute" } on the viewer's first click or key
  addEventListener("message", (e) => {
    if (e.data && e.data.type === "unmute") unmute();
  });
  if (video.readyState >= 2) start();
  else video.addEventListener("canplay", start, { once: true });
</script>
</body>
</html>
