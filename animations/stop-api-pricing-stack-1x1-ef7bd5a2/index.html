<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>superbot: STOP PAYING API PRICING (stack, 1:1)</title>
<style>
/* Plays the rendered film (10.667 s, 60 fps, with sound) fitted whole at its native 1080x1080; any ?ar= the
   gallery passes keeps the film whole, the rest of the frame the film's own canvas colour. Seekable source:
   quick-chats/stop-api-pricing.ef7bd5a2/c.html (window.seek(t)). */
:root { --canvas: #070707; }
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--canvas); }
body { display: grid; place-items: center; }
.frame { position: relative; width: min(100vw, calc(100vh * 1080 / 1080)); aspect-ratio: 1080 / 1080; background: var(--canvas); }
video { display: block; width: 100%; height: 100%; object-fit: contain; background: var(--canvas); }
</style>
</head>
<body>
<div class="frame">
  <video id="film" src="final.mp4" poster="poster.png" autoplay loop playsinline preload="auto"
    aria-label="STOP PAYING API PRICING over a plain API key; at once the key turns into the purple, pink and blue superbot key with the superbot mascot to its right and the headline changes to SUPERBOT REROUTES TO SUBSCRIPTION, SUBSCRIPTION in the same gradient; the end card reads superbot.gg with the mascot to its right (10.667 s loop, with sound)."></video>
</div>
<script>
  const video = document.getElementById("film");
  // Sound is on: try unmuted autoplay; if the browser refuses, play muted and unmute on the first click, key or touch.
  const unmute = () => { video.muted = false; video.play().catch(() => {}); };
  const start = () => {
    video.muted = false;
    video.play().catch(() => { video.muted = true; video.play().catch(() => {}); });
  };
  for (const type of ["pointerdown", "keydown", "touchstart"]) addEventListener(type, unmute, { once: true, capture: true });
  // the gallery lightbox posts { type: "unmute" } on the viewer's first click or key
  addEventListener("message", (e) => { if (e.data && e.data.type === "unmute") unmute(); });
  if (video.readyState >= 2) start();
  else video.addEventListener("canplay", start, { once: true });
</script>
</body>
</html>
