<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>API KEY THAT USES YOUR SUBSCRIPTIONS · dock</title>
<style>
/* Plays the rendered 1920x1080 film (final-16x9.mp4: 36 s, 60 fps, with sound) on its own near-black canvas.
   The spot is 16:9 only, so every ?ar= the gallery passes plays the same film, fitted whole. */
:root {
  --canvas: #070707;
  --surface: #ffffff;
  --ink: #14171c;
  --hairline: #d4d8de;
}

*, *::before, *::after { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  background: var(--canvas);
}

body {
  display: grid;
  place-items: center;
}

.frame {
  position: relative;
  width: min(100vw, 80vh);
  aspect-ratio: 4 / 5;
  background: var(--canvas);
}

.wide .frame {
  width: min(100vw, calc(100vh * 16 / 9));
  aspect-ratio: 16 / 9;
}

video {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
  background: var(--canvas);
}

</style>
</head>
<body>
<div class="frame">
  <video id="film" autoplay loop playsinline preload="auto"
    aria-label="API KEY THAT USES YOUR SUBSCRIPTIONS: eleven headlines, three seconds each, over the superbot API key with the superbot mascot beside it and the ChatGPT, Grok, Claude, Cursor, Gemini and Copilot icons right of SUBSCRIPTIONS, then the superbot.gg end card (dock cut, 36 s loop, with sound)."></video>
</div>
<script>
  const video = document.getElementById("film");
  document.documentElement.classList.add("wide");
  video.poster = "poster-16x9.png";
  video.src = "final-16x9.mp4";
  // Sound is always on: try unmuted autoplay, and if the browser refuses it, play muted and unmute on the
  // viewer's first click, key or touch.
  const unmute = () => {
    video.muted = false;
    video.play().catch(() => {});
  };
  const start = () => {
    video.muted = false;
    video.play().catch(() => {
      video.muted = true;
      video.play().catch(() => {});
    });
  };
  for (const type of ["pointerdown", "keydown", "touchstart"]) addEventListener(type, unmute, { once: true, capture: true });
  // the gallery lightbox posts { type: "unmute" } on the viewer's first click or key
  addEventListener("message", (e) => {
    if (e.data && e.data.type === "unmute") unmute();
  });
  if (video.readyState >= 2) start();
  else video.addEventListener("canplay", start, { once: true });
</script>
</body>
</html>
