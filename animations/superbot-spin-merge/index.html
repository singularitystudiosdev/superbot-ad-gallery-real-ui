<title>superbot — all your agents in one (spin-merge sting)</title>

<style>
  /* ============ tokens: superbot.gg site.css, verbatim ============ */
  :root {
    --bg: #000000; --card: #0d0d0d; --raised: #181818; --line: #262626;
    --fg: #ececec; --muted: #9a9a9a;
    --storm-0: #00e5c3; --storm-1: #2b6bff; --storm-2: #6a1fd8; --storm-3: #c026d3; --storm-4: #ff3d9a;
    /* the tri-colour "one": pink = storm-4, blue = storm-1, orange = the rail's Claude ground (hub-boot.css --brand-claude) */
    --one-pink: #ff3d9a; --one-blue: #2b6bff; --one-orange: #d97757;
    --font-ui: "SF Pro Rounded", "SF Pro Display", -apple-system, system-ui, "Segoe UI", sans-serif;
    /* hub-boot.css: the rail's surfaces and vendor brand pairs */
    --surface: #181818;
    --brand-openai: #000000;    --brand-openai-ink: #ffffff;
    --brand-claude: #d97757;    --brand-claude-ink: #ffffff;
    --brand-gemini: #ffffff;    --brand-gemini-ink: #1f1f1f;
    --brand-cursor: #000000;    --brand-cursor-ink: #ffffff;
    --brand-vscode: #0078d4;    --brand-vscode-ink: #ffffff;
    --brand-zed: #084ccf;       --brand-zed-ink: #ffffff;
    --brand-windsurf: #0b100f;  --brand-windsurf-ink: #58e5bb;
    --brand-copilot: #24292f;   --brand-copilot-ink: #ffffff;
    /* Material 3 motion tokens (emphasized decelerate / accelerate) */
    --ease-emph-out: cubic-bezier(0.05, 0.7, 0.1, 1);
    --ease-emph-in: cubic-bezier(0.3, 0, 0.8, 0.15);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body { background: #000; color: var(--fg); font-family: var(--font-ui); display: grid; place-items: center; overflow: hidden; -webkit-font-smoothing: antialiased; }

  /* ============ the 16:9 frame, scaled to fit; the stage is 1280x720 design px ============ */
  .frame { position: relative; width: min(1280px, 100vw); aspect-ratio: 16 / 9; max-height: 100vh; background: #000; overflow: hidden; }
  #stage { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; transform-origin: 0 0; background: #000; overflow: hidden; user-select: none; }
  #stage > * { pointer-events: none; }

  /* ============ beat 1: the sphere's tiles — hub-boot.css .rail-item, verbatim ============ */
  .rail-item { position: relative; flex: none; width: 44px; height: 44px; border-radius: 14px; background: var(--surface); display: grid; place-items: center; color: var(--fg); opacity: 0; }
  .rail-item svg { width: 26px; height: 26px; }
  .rail-item[data-app="openai"]   { background: var(--brand-openai);   color: var(--brand-openai-ink);   box-shadow: inset 0 0 0 1px rgb(255 255 255 / .14); }
  .rail-item[data-app="claude"]   { background: var(--brand-claude);   color: var(--brand-claude-ink); }
  .rail-item[data-app="gemini"]   { background: var(--brand-gemini);   color: var(--brand-gemini-ink); }
  .rail-item[data-app="cursor"]   { background: var(--brand-cursor);   color: var(--brand-cursor-ink);   box-shadow: inset 0 0 0 1px rgb(255 255 255 / .14); }
  .rail-item[data-app="copilot"]  { background: var(--brand-copilot);  color: var(--brand-copilot-ink);  box-shadow: inset 0 0 0 1px rgb(255 255 255 / .14); }
  .rail-item.bleed { background: #000; box-shadow: inset 0 0 0 1px rgb(255 255 255 / .14); }
  .rail-item.bleed img { width: 100%; height: 100%; display: block; object-fit: cover; border-radius: inherit; box-shadow: inset 0 0 0 1px rgb(255 255 255 / .14); }

  .sphere { position: absolute; inset: 0; overflow: hidden; z-index: 30; }
  .holder { position: absolute; left: 50%; top: 50%; width: 460px; height: 460px; transform: translate(-50%, -50%); transform-style: preserve-3d; perspective: 1100px; }

  /* ============ beat 2: the brand tile (brand/tile.svg) flips and grows ============ */
  .bloom-wrap { position: absolute; left: 50%; top: 50%; width: 250px; height: 250px; margin: -125px 0 0 -125px; z-index: 40; opacity: 0; will-change: transform, opacity; }
  .bloom { position: absolute; inset: 0; will-change: transform, filter; }
  .bloom img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  /* ============ beat 3: the headline — the site's wordmark type (hero.css .sb-words h1) ============ */
  .head { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%); margin: 0; text-align: center; font-size: 84px; line-height: 1; letter-spacing: -.025em; font-weight: 800; color: #fff; white-space: nowrap; z-index: 50; }
  .head .w, .head .l { display: inline-block; opacity: 0; will-change: transform, opacity; transform-origin: 50% 50%; }
  .head .one { display: inline-block; }
  .head .sp { display: inline-block; width: .26em; }
  .head .o { color: var(--one-pink); }
  .head .n { color: var(--one-blue); }
  .head .e { color: var(--one-orange); }

  /* ============ beat 4: the end card — mark, then "superbot" extends out of it ============ */
  .end { position: absolute; inset: 0; z-index: 60; display: grid; place-items: center; opacity: 0; }
  .lockup { display: flex; align-items: center; gap: 28px; will-change: transform; }
  /* the superbot.gg lockup — the tabs-chaos end card (220 / 128 / 34 / 44 on a
     1080 frame) at this 720-high stage's scale */
  .lockup { gap: 29px; }
  .mark { width: 147px; height: 147px; flex: none; opacity: 0; will-change: transform, opacity; }
  .mark svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .word-clip { padding-right: .08em; clip-path: inset(0 100% 0 0); will-change: clip-path; }
  .word { display: block; letter-spacing: -.03em; color: #fff; white-space: nowrap; will-change: transform; }
  .word h1 { margin: 0; font-size: 85px; line-height: 1; font-weight: 800; letter-spacing: inherit; }
  .word p { margin: 8px 0 0 4px; font-size: 23px; font-weight: 500; letter-spacing: 0; color: #9a9a9a; }
  .fade { position: absolute; inset: 0; z-index: 80; background: #000; opacity: 0; }

  .disc { position: absolute; bottom: 10px; left: 14px; z-index: 70; font-size: 11px; color: #5c5c66; letter-spacing: .04em; text-decoration: none; }
  .disc:hover { color: #8a8a97; }
</style>

  // ---------- the frame scales the 1280x720 stage to fit ----------
  const frame = document.getElementById("frame"), stage = document.getElementById("stage");
  const fit = () => { stage.style.transform = "scale(" + (frame.clientWidth / 1280) + ")"; };
  fit(); addEventListener("resize", fit);

  // ---------- one clock, every beat derived from it (?t=<ms> seeks; R replays) ----------
  // beat sheet (ms): spin 0-4000 · flip 4000-4920 · tile flips out into the

  const HOLD = params.has("pause"); // ?t=<ms>&pause renders that one frame and stops (the verify harness)
  const REDUCE = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const lerp = (a, b, t) => a + (b - a) * t;
  const clamp01 = (t) => Math.min(1, Math.max(0, t));

  // ---------- beat 1: sphere-intro-28.js, the site's own choreography ----------
  const SPIN = [
    { app: "openai" }, { app: "claude" }, { app: "gemini" }, { app: "cursor" },
    { app: "devin", name: "Devin", img: "assets/devin.png" },

    { name: "Replit", logo: "assets/replit.png", bg: "var(--surface)" },
    { name: "Lovable", logo: "assets/lovable.png", bg: "#ffffff" },
    { name: "Zed", sym: "zed", bg: "var(--brand-zed)", ink: "var(--brand-zed-ink)" },

    { name: "Base44", logo: "assets/base44.png", bg: "var(--surface)" },
    { name: "v0", logo: "assets/v0.svg", bg: "#000000" },
  ];
  const N = SPIN.length;
  const STAGE = 460, C = STAGE / 2, R = 175, TILE = 54;
  const rotY3 = (v, a) => ({ x: v.x * Math.cos(a) + v.z * Math.sin(a), y: v.y, z: -v.x * Math.sin(a) + v.z * Math.cos(a) });
  const fibDirs = (n) => Array.from({ length: n }, (_, i) => {
    const y = 1 - (2 * i + 1) / n;
    const r = Math.sqrt(Math.max(0, 1 - y * y));
    const th = 2.399963 * i;
    return { x: Math.cos(th) * r, y, z: Math.sin(th) * r };
  });
  const POP_START = 120, POP_STAGGER = 60;
  const popAt = (i) => POP_START + i * POP_STAGGER;
  const OMEGA0 = 0.35, OMEGA_MAX = 21;
  const omegaAt = (tMs) => {
    const x = clamp01(tMs / T.MERGE);
    return OMEGA0 * Math.exp(Math.log(OMEGA_MAX / OMEGA0) * Math.pow(x, 1.55));
  };
  const holder = document.getElementById("holder");
  const FIB = fibDirs(N);
  const HAIRLINE = "inset 0 0 0 1px rgb(255 255 255 / .14)";
  const tiles = SPIN.map((a) => {
    const t = document.createElement("span");
    t.className = "rail-item" + (a.img ? " bleed" : "");
    if (a.app) t.dataset.app = a.app;
    t.title = a.name || a.app;
    t.style.cssText = "position:absolute;left:0;top:0;width:" + TILE + "px;height:" + TILE + "px;will-change:transform,opacity,filter;opacity:0;";
    if (a.img) {
      const img = new Image(); img.src = a.img; img.alt = ""; img.draggable = false; t.appendChild(img);
    } else if (a.logo) {
      t.style.background = a.bg; t.style.boxShadow = HAIRLINE;
      const img = new Image(); img.src = a.logo; img.alt = ""; img.draggable = false;
      img.style.cssText = "width:60%;height:60%;object-fit:contain;display:block;"; t.appendChild(img);
    } else {
      if (a.sym) { t.style.background = a.bg; t.style.color = a.ink; t.style.boxShadow = HAIRLINE; }
      t.innerHTML = '<svg><use href="#sb-ic-' + (a.sym || a.app) + '"/></svg>';
      const svg = t.querySelector("svg"); svg.style.width = "31px"; svg.style.height = "31px";
    }
    holder.appendChild(t);
    return t;
  });
  const place3 = (el, x, y, z) => { el.style.transform = "translate3d(" + (C - TILE / 2 + x) + "px," + (C - TILE / 2 + y) + "px," + z + "px)"; };

  // the spin angle is the integral of omega: integrated in 1ms steps from the
  // last rendered clock, so a seek and a live run land on the same angle
  let ang = 0, angClock = 0;
  const advanceAng = (to) => {
    if (to < angClock) { ang = 0; angClock = 0; }
    const end = Math.min(to, T.MERGE);
    for (let t = angClock; t < end; t += 1) ang += 0.001 * omegaAt(t + 0.5);
    angClock = to;
  };
  const renderSphere = (clock) => {
    advanceAng(clock);
    const gone = clock >= T.MERGE + 220;
    for (let i = 0; i < N; i++) {
      const el = tiles[i];
      if (gone || clock < popAt(i)) { el.style.opacity = "0"; continue; }
      const v = rotY3(FIB[i], ang);
      const mergeT = Math.pow(clamp01((clock - (T.MERGE - 450)) / 450), 1.7);
      const x = lerp(v.x * R, 0, mergeT), y = lerp(v.y * R, 0, mergeT), z = v.z * lerp(R, 10, mergeT);
      const depth = (z + 190) / 380;
      place3(el, x, y, z);
      el.style.opacity = String(Math.min(1, (0.16 + 0.84 * depth) * (1 - clamp01((clock - T.MERGE) / 220))));
      const blurT = clamp01((clock - T.MERGE * 0.62) / (T.MERGE * 0.38));
      const blur = Math.pow(blurT, 2) * 3.6 + (depth < 0.5 ? (0.5 - depth) * 3 : 0);
      el.style.filter = blur > 0.05 ? "blur(" + blur.toFixed(2) + "px)" : "none";
    }
  };

  // ---------- cues: paused Web Animations, scrubbed by the clock ----------
  const cues = [];
  const cue = (el, keyframes, opts, start) => {
    const a = el.animate(keyframes, Object.assign({ fill: "both" }, opts));
    a.pause();
    cues.push({ a, start, dur: opts.duration });
    return a;
  };
  const scrub = (clock) => { for (const c of cues) c.a.currentTime = Math.min(c.dur, Math.max(0, clock - c.start)); };

  // beat 2 — fv-flip-icon-grow, exact (sphere-intro-28.js runFinisher)
  const bloomWrap = document.getElementById("bloomWrap"), bloom = document.getElementById("bloom");
  cue(bloom, [
    { transform: "perspective(900px) rotateY(180deg) scale(" + (TILE / 250) + ")", filter: "brightness(0.5)", easing: "cubic-bezier(.3,.85,.3,1.04)" },
    { transform: "perspective(900px) rotateY(0deg) scale(1.05)", filter: "brightness(1)", offset: 0.76, easing: "ease-out" },
    { transform: "scale(1)", filter: "brightness(1)" },
  ], { duration: T.FLIP }, T.MERGE);
  // beat 3 — "all your agents in" rises in word by word; the tile flips OUT
  // edge-on into the exact slot of "one", and o / n / e flip IN from that spot
  // on the tile's own bezier, arriving lit (brightness 1.6 → 1): the tile
  // becomes the word
  const head = document.getElementById("head");
  const S = frame.clientWidth / 1280; // screen px per design px, for measuring
  const words = [...head.querySelectorAll(".w")], letters = [...head.querySelectorAll(".l")];
  words.forEach((el, i) => cue(el, [
    { opacity: 0, transform: "translateY(0.35em)", easing: "cubic-bezier(0.05, 0.7, 0.1, 1)" },
    { opacity: 1, transform: "translateY(0)" },
  ], { duration: 450 }, T.WORDS + i * 60));
  const stR = stage.getBoundingClientRect(), oneR = head.querySelector(".one").getBoundingClientRect();
  const oneX = ((oneR.left + oneR.width / 2) - (stR.left + stR.width / 2)) / S;
  const oneY = ((oneR.top + oneR.height / 2) - (stR.top + stR.height / 2)) / S;
  // one cue owns the wrapper's whole life (two animations on one property
  // would let the later one's backward fill show the tile during the sphere):
  // hidden → shown at the merge → held → flipped out into the "one" slot
  const WRAP_END = T.TILE_OUT + 280, WRAP_DUR = WRAP_END - T.MERGE;
  const at = (ms) => (ms - T.MERGE) / WRAP_DUR;
  const REST = "perspective(900px) translate(0,0) rotateY(0deg) scale(1)";
  const SLOT = "perspective(900px) translate(" + oneX.toFixed(1) + "px," + oneY.toFixed(1) + "px) ";
  cue(bloomWrap, [
    { opacity: 0, transform: REST, offset: 0 },
    { opacity: 1, transform: REST, offset: at(T.MERGE + 1) },
    { opacity: 1, transform: REST, offset: at(T.TILE_OUT), easing: "cubic-bezier(0.4, 0, 1, 1)" },
    { opacity: 1, transform: SLOT + "rotateY(88deg) scale(0.42)", offset: at(T.TILE_OUT + 252) },
    { opacity: 0, transform: SLOT + "rotateY(90deg) scale(0.42)", offset: 1 },
  ], { duration: WRAP_DUR }, T.MERGE);
  letters.forEach((el, i) => cue(el, [
    { opacity: 0, transform: "perspective(600px) rotateY(-90deg) scale(0.9)", filter: "brightness(1.6)", easing: "cubic-bezier(.3,.85,.3,1.04)" },
    { opacity: 1, transform: "perspective(600px) rotateY(0deg) scale(1)", filter: "brightness(1)" },
  ], { duration: 520 }, T.ONE + i * 60));

  // beat 4 — hard cut (80ms of true black), the mark pops in on the brand
  // bezier, anticipates 6px right, then slides left as "superbot" extends out
  // of it: a stationary clip reveal, the type settling from wide tracking
  const end = document.getElementById("end"), lockup = document.getElementById("lockup");
  const mark = document.getElementById("mark"), word = document.getElementById("word"), wordClip = document.getElementById("wordClip");
  const GAP = 29;
  const wordW = word.getBoundingClientRect().width / S;
  const off = (wordW + GAP) / 2; // the lockup sits right by this much while the mark alone is centered
  lockup.style.transform = "translateX(" + off + "px)";
  cue(mark, [
    { opacity: 0, transform: "scale(0.6)", easing: "cubic-bezier(.3,.85,.3,1.04)" },
    { opacity: 1, transform: "scale(1.04)", offset: 0.76, easing: "ease-out" },
    { opacity: 1, transform: "scale(1)" },
  ], { duration: 380 }, T.MARK);
  cue(lockup, [
    { transform: "translateX(" + off + "px)", easing: "cubic-bezier(0.4, 0, 1, 1)" },
    { transform: "translateX(" + (off + 6) + "px)", offset: (T.LOCKUP - T.ANTIC) / 690, easing: "cubic-bezier(0.05, 0.7, 0.1, 1)" },
    { transform: "translateX(0)" },
  ], { duration: 690 }, T.ANTIC);
  cue(wordClip, [
    { clipPath: "inset(0 100% 0 0)", easing: "cubic-bezier(0.05, 0.7, 0.1, 1)" },
    { clipPath: "inset(0 0 0 0)" },
  ], { duration: 550 }, T.WORD);
  cue(word, [
    { transform: "translateX(-18%)", letterSpacing: ".06em", easing: "cubic-bezier(0.05, 0.7, 0.1, 1)" },
    { transform: "translateX(0)", letterSpacing: "-.03em" },
  ], { duration: 550 }, T.WORD);
  // the loop closes on black, so the restart into the black stage is seamless
  cue(document.getElementById("fade"), [
    { opacity: 0, easing: "cubic-bezier(0.4, 0, 1, 1)" },
    { opacity: 1 },
  ], { duration: 200 }, T.FADE);

  // ---------- render(t): every element's state from the clock alone ----------
  const render = (clock) => {
    renderSphere(clock);
    scrub(clock);
    head.style.opacity = clock >= T.CUT ? "0" : "1";
    end.style.opacity = clock >= T.CUT ? "1" : "0";
  };

  if (REDUCE) { render(T.FADE - 1); return; } // the held end card, nothing moves
  if (HOLD) { render(seek); return; }

  let clock = seek, last = null;
  const frameFn = (ts) => {
    if (last == null) last = ts;
    clock += Math.min(50, ts - last);
    last = ts;
    if (clock >= T.END) clock = 0; // loop
    render(clock);
    requestAnimationFrame(frameFn);
  };
  render(clock);
  requestAnimationFrame(frameFn);

  addEventListener("keydown", (e) => { if (e.key === "r" || e.key === "R") { clock = 0; render(0); } });
})();
</script>
</body>
</html>
