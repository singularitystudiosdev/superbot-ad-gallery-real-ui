<!doctype html>
<!-- The mascot layer for the 3s doorstep clip: the REAL superbot.gg animated mark
     (assets/sb-mark-live.{css,js}, window.sbMarkLive) with the ad's kawaii dressing
     (../assets/kawaii.js: blush, black eye backing, heart and sparkle bursts; the mark itself is
     never redrawn) on a transparent 1920x1080 page. build/render-mascot.mjs screenshots it frame
     by frame with omitBackground and ffmpeg overlays the PNG sequence on the stock plate.
     window.renderFrame(i) is a pure function of the clip frame (25fps).
     Frame 75 (the clip's last, "clean" frame) is empty on purpose: index.html holds the video on
     it and the SAME mascot, live in the page, takes over from frame 74's exact pose and hops out
     of the clip into the end card. window.handoff() reports that pose for index.html's HOP_FROM. -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../../assets/sb-mark-live.css">
<style>
  html, body { margin: 0; width: 1920px; height: 1080px; background: transparent; overflow: hidden; }
  #rig { position: absolute; left: 0; top: 0; width: 154px; height: 154px; transform-origin: 77px 132.4px; }
  #rig .sb-mark { filter: drop-shadow(0 5px 7px rgba(0,0,0,.42)) drop-shadow(0 0 2px rgba(0,0,0,.35)); }
  #shadow { position: absolute; left: 0; top: 0; width: 100px; height: 16px; margin: -8px 0 0 -50px; border-radius: 50%; background: rgba(20,12,6,.34); filter: blur(4px); }
  #fx { position: absolute; inset: 0; }
</style>
<script src="../../../assets/sb-mark-live.js"></script>
<script src="../assets/kawaii.js"></script>
</head><body>
<div id="shadow"></div>
<div id="rig"></div>
<div id="fx"></div>
<script>
const FPS = 25, N = 76, BOX = 154, FOOT = 132.4; // 30% bigger than v1's 118px box; the feet sit at y=86 of the mark's 100-unit box
const CLEAN = 75;                                  // the empty frame the page takes over on
const mark = sbMarkLive('#rig', { size: BOX, interactive: false });
const dress = kawaiiDress(mark);
const svg = mark.svg;
const eyes = [svg.querySelector('.mark-eye-l'), svg.querySelector('.mark-eye-r')];
const EYE = [{ cx: 35, cy: 58 }, { cx: 65, cy: 58 }];
const burst = kawaiiBurst(document.getElementById('fx'), 9);

// The courier's RIGHT shoulder = the viewer's LEFT (she faces the camera), in 1920x1080 plate px:
// the top of the shoulder where the mascot's feet sit, keyframed by hand on labelled full-res crops
// of the plate (25px grid, build/ notes in build-clip.sh), Catmull-Rom between keys.
// The plate is a jump cut: frames 0-27 are source 5.40-6.48s (the door swings open and she is
// revealed), frames 28-74 are source 17.60-19.44s (she lifts the bag and hands it over).
// The door edge covers her shoulder until frame ~19, so the mascot only pops in at frame 20.
const CUT = 28;
const KEYS = [
  [20, 748, 552], [22, 752, 552], [24, 758, 553], [27, 768, 560],
  [28, 905, 575], [30, 905, 572], [36, 910, 545], [42, 893, 510], [48, 880, 492],
  [54, 848, 495], [60, 818, 505], [66, 800, 510], [70, 802, 515], [74, 800, 520],
];
function cr(p0, p1, p2, p3, u) { // catmull-rom
  return 0.5 * ((2 * p1) + (-p0 + p2) * u + (2 * p0 - 5 * p1 + 4 * p2 - p3) * u * u + (-p0 + 3 * p1 - 3 * p2 + p3) * u * u * u);
}
function shoulder(f) {
  // interpolate within the side of the cut the frame is on, so the spline never smears across it
  const ks = KEYS.filter(k => (f < CUT) === (k[0] < CUT));
  if (f <= ks[0][0]) return { x: ks[0][1], y: ks[0][2] };
  if (f >= ks[ks.length - 1][0]) return { x: ks[ks.length - 1][1], y: ks[ks.length - 1][2] };
  let j = 0; while (ks[j + 1][0] < f) j++;
  const a = ks[Math.max(0, j - 1)], b = ks[j], c = ks[j + 1], d = ks[Math.min(ks.length - 1, j + 2)];
  const u = (f - b[0]) / (c[0] - b[0]);
  return { x: cr(a[1], b[1], c[1], d[1], u), y: cr(a[2], b[2], c[2], d[2], u) };
}
const clamp01 = v => Math.max(0, Math.min(1, v));
const inAny = (f, list) => list.some(([a, b]) => f >= a && f < b);

const POP = 20;                                     // pops up on her shoulder once the door has cleared it
const RIDE = [[32, 9, 36], [44, 10, 44], [56, 9, 34]]; // bouncy hops on the shoulder: [start, frames, height px]
const CROUCH = [67, 74];                            // the wind-up for the big hop out of the clip
const HAPPY = [[20, 28], [41, 50], [53, 62], [65, 75]];
const BLINK = [[36, 38]];
// hearts and sparkles: [frame, mix (1 = all hearts), scale]
const BURSTS = [[20, 0.2, 0.9], [41, 0.85, 0.85], [53, 0.6, 0.85], [65, 1, 0.9]];

// squash & stretch: rounder, bouncier than v1. In the air: stretched tall; on landing: a squash
// that springs back with a little overshoot (damped cosine over 6 frames).
function squash(f) {
  for (const [a, n] of RIDE) {
    if (f >= a && f < a + n) { const p = (f - a) / n; const k = Math.sin(Math.PI * Math.min(1, p * 1.4)); return { sx: 1 - 0.1 * k, sy: 1 + 0.14 * k, air: 1 }; }
    const g = f - (a + n);
    if (g >= 0 && g < 6) { const k = Math.exp(-g / 2.2) * Math.cos(g * 1.15); return { sx: 1 + 0.2 * k, sy: 1 - 0.2 * k, air: 0 }; }
  }
  if (f >= CROUCH[0]) { const k = Math.pow(clamp01((f - CROUCH[0]) / (CROUCH[1] - CROUCH[0])), 1.6); return { sx: 1 + 0.16 * k, sy: 1 - 0.2 * k, air: 0 }; }
  const g = f - CUT; // a little settle on the cut, so the jump reads as a landing
  if (g >= 0 && g < 5) { const k = Math.exp(-g / 1.8) * Math.cos(g * 1.2); return { sx: 1 + 0.1 * k, sy: 1 - 0.1 * k, air: 0 }; }
  return { sx: 1, sy: 1, air: 0 };
}

function state(f) {
  const t = f / FPS;
  const s = shoulder(f);
  let x = s.x, y = s.y, lift = 0;
  for (const [a, n, h] of RIDE) if (f >= a && f < a + n) { const p = (f - a) / n; lift = h * 4 * p * (1 - p); }
  y -= lift;
  let { sx, sy, air } = squash(f);
  let pop = 1;
  if (f < POP) pop = 0;
  else if (f < POP + 8) { // elastic pop-in from its feet: 0 -> 1.18 -> 0.94 -> 1
    const p = (f - POP) / 8;
    pop = Math.max(0, 1 - Math.exp(-5 * p) * Math.cos(p * Math.PI * 2.6));
    y -= 18 * Math.sin(Math.PI * Math.min(1, p * 1.6)) * (1 - p);
  }
  const tilt = air ? Math.sin(f * 0.8) * 5 : Math.sin(t * 2.2) * 2;
  // eyes: at the camera as it pops up, then at the customer (screen right) and the bag
  let ex = 0, ey = 0.4;
  if (f >= CUT) { ex = 1.5; ey = 0.5; }
  if (f >= CROUCH[0]) { ex = 0.6; ey = -0.9; } // looks up at where it is about to hop
  return { f, x, y, sx: sx * pop, sy: sy * pop, tilt, ex, ey, happy: inAny(f, HAPPY), blink: inAny(f, BLINK), lift, base: s, air, visible: f >= POP && f < CLEAN, t };
}

window.renderFrame = function (f) {
  const st = state(f);
  // the mark's own CSS loops (bob, breath, ears, glitch), pinned to clip time
  for (const a of document.getAnimations()) { a.pause(); a.currentTime = (st.t * 1000) % 1e7; }
  const rig = document.getElementById('rig'), sh = document.getElementById('shadow');
  rig.style.opacity = st.visible ? '1' : '0';
  rig.style.transform = `translate(${(st.x - BOX / 2).toFixed(1)}px, ${(st.y - FOOT).toFixed(1)}px) rotate(${st.tilt.toFixed(2)}deg) scale(${st.sx.toFixed(3)}, ${st.sy.toFixed(3)})`;
  // contact shadow on the shoulder, shrinking as it hops
  sh.style.opacity = st.visible ? String(clamp01(1 - st.lift / 70) * 0.85 * Math.min(1, st.sx)) : '0';
  sh.style.transform = `translate(${st.base.x.toFixed(1)}px, ${(st.base.y - 2).toFixed(1)}px) scale(${(1 - Math.min(0.4, st.lift / 130)).toFixed(3)})`;
  eyes.forEach((e, i) => { e.setAttribute('cx', (EYE[i].cx + st.ex).toFixed(2)); e.setAttribute('cy', (EYE[i].cy + st.ey).toFixed(2)); e.setAttribute('ry', st.blink ? '1' : '11'); });
  svg.classList.toggle('is-happy', st.happy);
  dress.setBlush(st.happy ? 0.9 : 0.72);
  // the latest burst still alive, from the mascot's head
  let live = null;
  for (const b of BURSTS) if (f >= b[0] && (f - b[0]) / FPS < burst.life) live = b;
  if (live && st.visible) burst.set((f - live[0]) / FPS, st.x, st.y - FOOT * 0.72, live[2], live[0], live[1]);
  else burst.set(-1, 0, 0, 1, 1, 0);
  return st;
};
// frame 74's pose: index.html's live mascot starts its hop from exactly here
window.handoff = () => { const s = state(CLEAN - 1); return { x: s.x, y: s.y, sx: s.sx, sy: s.sy, tilt: s.tilt, ex: s.ex, ey: s.ey, happy: s.happy, t: s.t }; };
window.N = N;
</script>
</body></html>
