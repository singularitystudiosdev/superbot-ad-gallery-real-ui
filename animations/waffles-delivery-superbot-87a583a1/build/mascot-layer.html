<!doctype html>
<!-- The mascot layer for the doorstep clip: the REAL superbot.gg animated mark
     (assets/sb-mark-live.{css,js}, window.sbMarkLive) on a transparent 1920x1080
     page. build/render-mascot.mjs screenshots it frame by frame with
     omitBackground and ffmpeg overlays the PNG sequence on the stock plate.
     window.renderFrame(i) is a pure function of the clip frame (25fps). -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../../assets/sb-mark-live.css">
<style>
  html, body { margin: 0; width: 1920px; height: 1080px; background: transparent; overflow: hidden; }
  #rig { position: absolute; left: 0; top: 0; width: 118px; height: 118px; transform-origin: 59px 101px; }
  #rig .sb-mark { filter: drop-shadow(0 4px 6px rgba(0,0,0,.42)) drop-shadow(0 0 2px rgba(0,0,0,.35)); }
  #shadow { position: absolute; left: 0; top: 0; width: 78px; height: 14px; margin: -7px 0 0 -39px; border-radius: 50%; background: rgba(20,12,6,.34); filter: blur(4px); }
</style>
<script src="../../../assets/sb-mark-live.js"></script>
</head><body>
<div id="shadow"></div>
<div id="rig"></div>
<script>
const FPS = 25, N = 210, BOX = 118, FOOT = 101; // the mark's feet sit at y=86 of its 100-unit box
const NUDGE = 10; // the mark's centre sits a touch outboard of the shoulder-top point, clear of her hair
const mark = sbMarkLive('#rig', { size: BOX, interactive: false });
const svg = mark.svg;
const eyes = [svg.querySelector('.mark-eye-l'), svg.querySelector('.mark-eye-r')];
const EYE = [{ cx: 35, cy: 58 }, { cx: 65, cy: 58 }];

// the courier's LEFT shoulder (her left = the viewer's right; she faces the camera),
// in 1920x1080 plate px: the top of the shoulder, keyframed by hand on labelled full-res
// crops of the plate (50px grid), Catmull-Rom between keys. Apple Vision body pose was
// the first choice but its model cannot load in the render sandbox; a mustard-beanie
// colour track (build/track.py) was used to cross-check the head path.
// Frame 92 is the jump cut (source 8.0s -> 15.6s).
const KEYS = [
  [44, 980, 547], [52, 980, 553], [60, 986, 553], [70, 1017, 553], [80, 1017, 553], [91, 1015, 553],
  [92, 1060, 718], [100, 1075, 684], [110, 1096, 671], [120, 1109, 665], [130, 1110, 652],
  [140, 1065, 618], [150, 1067, 621], [160, 1055, 587], [168, 1022, 549], [176, 985, 537],
  [184, 972, 537], [192, 960, 537], [200, 954, 537], [209, 947, 543],
];
const CUT = 92;
function cr(p0, p1, p2, p3, u) { // catmull-rom
  return 0.5 * ((2 * p1) + (-p0 + p2) * u + (2 * p0 - 5 * p1 + 4 * p2 - p3) * u * u + (-p0 + 3 * p1 - 3 * p2 + p3) * u * u * u);
}
function shoulder(f) {
  // interpolate within the side of the cut the frame is on, so the spline never smears across it
  const ks = KEYS.filter(k => (f < CUT) === (k[0] < CUT));
  if (f <= ks[0][0]) return { x: ks[0][1], y: ks[0][2] };
  if (f >= ks[ks.length - 1][0]) return { x: ks[ks.length - 1][1], y: ks[ks.length - 1][2] };
  let j = 0; while (ks[j + 1][0] < f) j++;
  const a = ks[Math.max(0, j - 1)], b = ks[j], c = ks[j + 1], d = ks[Math.min(ks.length - 1, j + 2)];
  const u = (f - b[0]) / (c[0] - b[0]);
  return { x: cr(a[1], b[1], c[1], d[1], u), y: cr(a[2], b[2], c[2], d[2], u) };
}
const clamp01 = v => Math.max(0, Math.min(1, v));
const lerp = (a, b, p) => a + (b - a) * p;
const easeIO = p => p < .5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;

// the hop-in: from off-screen left along the bottom of the frame, over the door, then the
// big hop that lands on the shoulder at frame 54
const HOPS = [ // [f0, f1, x0, y0, x1, y1, height]
  [0, 11, -120, 1030, 230, 1040, 150],
  [11, 22, 230, 1040, 480, 1010, 190],
  [22, 32, 480, 1010, 680, 1000, 160],
  [32, 40, 680, 1000, 740, 990, 80],
];
const LAND = [40, 54, 740, 990, 300]; // the big hop, onto the moving shoulder
// once riding: small hops on the shoulder [start, frames, height]
const RIDE = [[70, 10, 34], [93, 9, 26], [118, 10, 28], [146, 10, 24], [170, 8, 40], [179, 8, 40], [198, 9, 24]];
const HAPPY = [[54, 70], [170, 196]];
const BLINK = [[86, 89], [128, 131], [158, 161], [203, 206]];
const inAny = (f, list) => list.some(([a, b]) => f >= a && f < b);

function pose(f) {
  let x, y, air = 0, landedAt = -1;
  const hop = HOPS.find(h => f >= h[0] && f < h[1]);
  if (hop) {
    const p = (f - hop[0]) / (hop[1] - hop[0]);
    x = lerp(hop[2], hop[4], p); y = lerp(hop[3], hop[5], p) - hop[6] * 4 * p * (1 - p);
    air = 1;
  } else if (f >= LAND[0] && f < LAND[1]) {
    const p = (f - LAND[0]) / (LAND[1] - LAND[0]);
    const s = shoulder(f), q = easeIO(p);
    x = lerp(LAND[2], s.x, q); y = lerp(LAND[3], s.y, p) - LAND[4] * 4 * p * (1 - p);
    air = 1;
  } else {
    const s = shoulder(f); x = s.x; y = s.y;
    for (const [a, n, h] of RIDE) if (f >= a && f < a + n) { const p = (f - a) / n; y -= h * 4 * p * (1 - p); air = 1; }
  }
  // the last landing, for the squash
  const lands = [...HOPS.map(h => h[1]), LAND[1], ...RIDE.map(r => r[0] + r[1]), CUT];
  for (const l of lands) if (f >= l && f < l + 5) landedAt = l;
  return { x, y, air, landedAt };
}

window.renderFrame = function (f) {
  const t = f / FPS;
  // the mark's own CSS loops (bob, breath, ears, glitch), pinned to clip time
  for (const a of document.getAnimations()) { a.pause(); a.currentTime = (t * 1000) % 1e7; }
  const { x, y, air, landedAt } = pose(f);
  let sx = 1, sy = 1;
  if (air) { sx = 0.95; sy = 1.07; }
  if (landedAt >= 0 && !air) { const k = 1 - (f - landedAt) / 5; sx = 1 + 0.14 * k; sy = 1 - 0.16 * k; }
  const rig = document.getElementById('rig');
  const tilt = air ? Math.sin(f * 0.9) * 6 : Math.sin(t * 2.2) * 2;
  rig.style.transform = `translate(${(x + (f >= LAND[0] ? NUDGE : 0) - BOX / 2).toFixed(1)}px, ${(y - FOOT).toFixed(1)}px) rotate(${tilt.toFixed(2)}deg) scale(${sx.toFixed(3)}, ${sy.toFixed(3)})`;
  // contact shadow only while it rides the shoulder
  const sh = document.getElementById('shadow');
  const riding = f >= LAND[1] - 1;
  const base = riding ? shoulder(f) : { x, y };
  const lift = Math.max(0, base.y - y);
  sh.style.opacity = riding ? String(clamp01(1 - lift / 60) * 0.9) : '0';
  sh.style.transform = `translate(${(base.x + NUDGE).toFixed(1)}px, ${(base.y - 2).toFixed(1)}px) scale(${(1 - Math.min(0.4, lift / 120)).toFixed(3)})`;
  // eyes: toward the customer (right), down at the bag while she digs for it
  let ex = 1.3, ey = 0.2;
  if (f >= 92 && f < 160) { ex = 0.6; ey = 1.6; }
  if (f < LAND[0]) { ex = 1.8; ey = -0.6; }
  eyes.forEach((e, i) => { e.setAttribute('cx', (EYE[i].cx + ex).toFixed(2)); e.setAttribute('cy', (EYE[i].cy + ey).toFixed(2)); e.setAttribute('ry', inAny(f, BLINK) ? '1' : '11'); });
  svg.classList.toggle('is-happy', inAny(f, HAPPY));
  return { x, y };
};
window.N = N;
</script>
</body></html>
